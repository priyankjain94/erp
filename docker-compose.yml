# Production stack: Caddy (HTTPS, automatic Let's Encrypt) -> app -> PostgreSQL 16.
# 1) cp .env.example .env  and fill it in   2) set DOMAIN in .env   3) docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mms
      POSTGRES_USER: mms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: [ "pgdata:/var/lib/postgresql/data" ]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U mms -d mms" ]
      interval: 10s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://mms:${POSTGRES_PASSWORD}@db:5432/mms
      APP_BASE_URL: https://${DOMAIN}
      CORS_ORIGINS: https://${DOMAIN}
    volumes: [ "uploads:/data/uploads" ]
    depends_on:
      db: { condition: service_healthy }

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: [ "80:80", "443:443" ]
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [ app ]

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
