  function moveLead(id, stage, reason){
    const lead = leads.find(l => l.id === id); if (!lead || lead.stage === stage) return;
    if (stage === 'lost' && !reason){ setLostFor(id); return; }
    setLeads(ls => ls.map(l => l.id === id ? {...l, stage} : l));
    call('POST', `/leads/${id}/stage`, {stage, reason:reason || ''}, r => (r.notes || []).join(' '));
  }
  const send = (id, text, tpl) => call('POST', `/leads/${id}/messages`, tpl ? {tpl} : {text});
  const setFollow = (id, days) => call('PATCH', `/leads/${id}`, {followUpDays:days}, `Follow-up set for ${days === 1 ? 'tomorrow' : fmtDate(addDays(days))}.`);
  async function addLead(data){
    const r = await call('POST', '/leads', {name:data.name, phone:data.phone, source:data.source, sub:data.sub || '', ref:data.ref || null, showroom:data.showroom || '', interest:data.interest || '', value:Number(data.value) || 0, area:data.area || '', owner:data.owner},
      res => `${data.name} added to New and assigned to ${res.ownerName}.${srcById[data.source].family === 'partner' ? ' Partner thanked on WhatsApp.' : ''}${res.dup ? ' Duplicate number flagged.' : ''}`);
    if (r) setAdding(false);
  }
  const toggleAuto = id => { const a = autos.find(x => x.id === id); setAutos(as => as.map(x => x.id === id ? {...x, on:!x.on} : x)); call('PATCH', `/automations/${id}`, {on:!a.on}); };
  async function reset(){ if (!confirmReset()) return; const r = await call('POST', '/admin/demo-reset', {}); if (r) { app.loggedOut(); toast('Sample data restored. Log in again.'); } }
  const confirmReset = () => true;
  const open = (id, tab='chat') => { setOpenTab(tab); setOpenId(id); };

  const unread = leads.filter(l => awaitingReply(l) && !['won','lost'].includes(l.stage)).length;
  const current = leads.find(l => l.id === openId);
  const meta = VIEWS.find(v => v.id === view);
  const toastsEl = html`<div className="toasts" role="status" aria-live="polite">${toasts.map(t => html`<div className="toast" key=${t.id}><${Icon} n="check" s=${16}/><span>${t.text}</span></div>`)}</div>`;

  if (boot === 'loading') return html`<div style=${{height:'100%',display:'grid',placeItems:'center',color:'var(--muted)'}}>Loading…</div>`;
  if (boot === 'login' || !erp.me || !userById[erp.me]) return html`<${React.Fragment}><${LoginScreen} audience="staff" onLogin=${async () => { await app.reload(); toast('Logged in.'); }}/>${toastsEl}<//>`;
  return html`<div className="app">
    <aside className="rail">
      <div className="brand"><${Mark}/><div><b>Make My Space</b><small>CRM + OPERATIONS</small></div></div>
      ${[['crm','Sales · CRM'],['ops','Operations'],['admin','Admin']].filter(([g]) => VIEWS.some(v => (v.g || 'crm') === g && canView(erp, v.id))).map(([g, label]) => html`<div key=${g}>
        <div className="rail-label">${label}</div>
        <nav className="nav" aria-label=${label}>${VIEWS.filter(v => (v.g || 'crm') === g && canView(erp, v.id)).map(v => html`<button key=${v.id} aria-current=${view === v.id ? 'page' : undefined} onClick=${() => go(v.id)}><${Icon} n=${v.icon}/>${v.name}${v.id === 'inbox' && unread ? html`<span className="count num">${unread}</span>` : null}${v.id === 'tasks' && erp.tasks.filter(t => t.assignee === erp.me && t.status !== 'done' && daysFrom(t.deadline) <= 0).length ? html`<span className="count num" style=${{background:'var(--crit)'}}>${erp.tasks.filter(t => t.assignee === erp.me && t.status !== 'done' && daysFrom(t.deadline) <= 0).length}</span>` : null}</button>`)}</nav>
      </div>`)}
      <div className="me-box"><span>Logged in</span><div style=${{display:'flex',alignItems:'center',gap:8,color:'var(--rail-ink)',fontSize:13}}><b style=${{fontWeight:500}}>${uname(erp.me)}</b><span style=${{color:'var(--rail-muted)',fontSize:11.5}}>${roleById[userById[erp.me].role]?.name}</span><button className="linkbtn" style=${{marginLeft:'auto',marginTop:0}} onClick=${() => ops.setMe(null)}>Log out</button></div></div>
      ${SERVER.demoMode && html`<label className="me-box"><span>Switch user (demo)</span><select value=${erp.me} onChange=${e => ops.setMe(e.target.value)}>${TEAM.map(u => html`<option key=${u.id} value=${u.id}>${u.name} · ${roleById[u.role]?.name || u.role}</option>`)}</select></label>`}
      ${queued > 0 && html`<div className="me-box" style=${{color:'var(--warn)',fontSize:12}}>${queued} change${queued > 1 ? 's' : ''} saved on this device, waiting to sync</div>`}
      <div className="wa-status">
        <b><span className="dot" style=${{background:SERVER.whatsappLive ? 'var(--wa)' : 'var(--warn)'}}></span>${SERVER.whatsappLive ? 'WhatsApp connected' : 'WhatsApp simulated'}</b>
        <span>${SERVER.whatsappLive ? 'Messages go out from your business number' : 'Add Meta tokens on the server to go live'}</span>
        ${SERVER.demoMode && can(erp, 'admin') && html`<button className="linkbtn" onClick=${reset}>Reset sample data</button>`}
      </div>
    </aside>

    <main className="main">
      <header className="topbar">
        <h1><span className="eyebrow">${meta.g === 'ops' ? 'MAKE MY SPACE OPERATIONS' : meta.g === 'admin' ? 'MAKE MY SPACE ADMIN' : 'MAKE MY SPACE CRM'}</span>${meta.title || (meta.name === 'Leads' ? 'Lead pipeline' : meta.name)}</h1>
        ${SERVER.demoMode && html`<span className="sample hide-sm">Demo mode</span>`}
        ${!meta.g && allowed && html`<button className="btn primary" onClick=${() => setAdding(true)}><${Icon} n="plus" s=${16}/>Add lead</button>`}
        ${view === 'projects' && can(erp, 'edit') && html`<button className="btn primary" onClick=${() => setNewProj(true)}><${Icon} n="plus" s=${16}/>New project</button>`}
        ${(view === 'tasks' || view === 'ops') && html`<button className="btn primary" onClick=${() => setNewTask(true)}><${Icon} n="plus" s=${16}/>New task</button>`}

      ${!allowed ? html`<${NoAccess} erp=${erp} view=${view}/>` : html`<${React.Fragment}>
      ${view === 'dashboard' && html`<${Dashboard} leads=${leads} open=${open} go=${go}/>`}

      ${view === 'users' && html`<${UsersAdmin} erp=${erp} ops=${ops} toast=${toast}/>`}
      <//>`}
    </main>

    <nav className="bottomnav" aria-label="Main">${VIEWS.filter(v => canView(erp, v.id)).map(v => html`<button key=${v.id} aria-current=${view === v.id ? 'page' : undefined} onClick=${() => go(v.id)}><${Icon} n=${v.icon} s=${20}/>${v.name}${v.id === 'inbox' && unread ? html`<span className="count">${unread}</span>` : null}</button>`)}</nav>

    ${current && html`<${Drawer} lead=${current} leads=${leads} tab=${openTab} setTab=${setOpenTab} close=${() => setOpenId(null)} move=${moveLead} send=${send} follow=${setFollow} extra=${current.stage === 'won' && can(erp, 'edit') ? html`<${ConvertBox} key=${current.id} lead=${current} erp=${erp} ops=${ops} ui=${ui}/>` : null} setOwner=${o => call('PATCH', `/leads/${current.id}`, {owner:o}, `${current.name} reassigned to ${o}.`)}/>`}

    ${pOpen && html`<${ProjectDrawer} key=${pOpen} p=${erp.projects.find(p => p.id === pOpen)} erp=${erp} ui=${ui} ops=${ops} leads=${leads} tab=${pTab} setTab=${setPTab} close=${() => setPOpen(null)}/>`}
    ${tOpen && html`<${TaskDrawer} key=${tOpen} t=${erp.tasks.find(t => t.id === tOpen)} erp=${erp} ops=${ops} close=${() => setTOpen(null)}/>`}
    ${iOpen && html`<${ItemModal} key=${iOpen} it=${erp.items.find(i => i.id === iOpen)} erp=${erp} ops=${ops} ui=${ui} close=${() => setIOpen(null)}/>`}
    ${newProj && html`<${NewProject} leads=${leads} erp=${erp} ops=${ops} ui=${ui} close=${() => setNewProj(false)}/>`}
    ${newTask && html`<${NewTask} erp=${erp} ops=${ops} close=${() => setNewTask(false)}/>`}
    ${lostFor && html`<${LostDialog} lead=${leads.find(l => l.id === lostFor)} close=${() => setLostFor(null)} pick=${r => { const id = lostFor; setLostFor(null); moveLead(id, 'lost', r); }}/>`}
    <div className="toasts" role="status" aria-live="polite">${toasts.map(t => html`<div className="toast" key=${t.id}><${Icon} n="check" s=${16}/><span>${t.text}</span></div>`)}</div>
  </div>`;
}

/* ---------- Pipeline (board + list) ---------- */
function Pipeline({leads, open, move}){
  const [mode, setMode] = useState(() => { try { return localStorage.getItem('mms-crm-mode') || 'board'; } catch(e){ return 'board'; } });
  const [q, setQ] = useState('');
  const [src, setSrc] = useState('all');
  const [owner, setOwner] = useState('all');
  const [dragId, setDragId] = useState(null);
  const [over, setOver] = useState(null);
  useEffect(() => { try { localStorage.setItem('mms-crm-mode', mode); } catch(e){} }, [mode]);

  const shown = leads.filter(l =>
    (src === 'all' || l.source === src) && (owner === 'all' || l.owner === owner) &&
    (!q || (l.name + ' ' + l.phone + ' ' + l.interest + ' ' + refName(l, leads) + ' ' + l.area).toLowerCase().includes(q.toLowerCase())));
  const counts = Object.fromEntries(SOURCES.map(s => [s.id, leads.filter(l => l.source === s.id).length]));

  return html`<section className="view board-view">
    <div className="toolbar">
      <div className="seg" role="group" aria-label="View">
        <button aria-pressed=${mode === 'board'} onClick=${() => setMode('board')}><${Icon} n="board" s=${15}/>Board</button>
        <button aria-pressed=${mode === 'list'} onClick=${() => setMode('list')}><${Icon} n="list" s=${15}/>List</button>
      </div>
      <label className="search"><${Icon} n="search" s=${16}/><input id="lead-search" placeholder="Search name, phone, partner" value=${q} onInput=${e => setQ(e.target.value)} aria-label="Search leads"/></label>
      <select className="sel" id="owner-filter" value=${owner} onChange=${e => setOwner(e.target.value)} aria-label="Owner"><option value="all">All owners</option>${OWNERS.map(o => html`<option key=${o}>${o}</option>`)}</select>
    </div>
    <div className="chips" style=${{marginBottom:14}} role="group" aria-label="Lead source">
      <button className="chip" aria-pressed=${src === 'all'} onClick=${() => setSrc('all')}>All sources <span className="n">${leads.length}</span></button>
      ${SOURCES.map(s => html`<button key=${s.id} className="chip" aria-pressed=${src === s.id} onClick=${() => setSrc(src === s.id ? 'all' : s.id)}><i className="sw" style=${{width:8,height:8,borderRadius:2,background:`var(--s-${s.id})`,display:'inline-block'}}></i>${s.short} <span className="n">${counts[s.id]}</span></button>`)}
    </div>

    ${mode === 'board' ? html`<div className="board">
      ${STAGES.map(st => {
        const items = shown.filter(l => l.stage === st.id).sort((a,b) => (a.fu||'9') < (b.fu||'9') ? -1 : 1);
        const total = items.reduce((s,l) => s + l.value, 0);
        return html`<div key=${st.id} className=${'col' + (over === st.id ? ' over' : '') + (st.type !== 'open' ? ' closed' : '')}
          onDragOver=${e => { e.preventDefault(); setOver(st.id); }} onDragLeave=${() => setOver(o => o === st.id ? null : o)}
          onDrop=${e => { e.preventDefault(); const id = e.dataTransfer.getData('text/plain') || dragId; setOver(null); setDragId(null); if (id) move(id, st.id); }}>
          <div className="col-head">
            <i className="mark" style=${{background: st.type === 'won' ? 'var(--good)' : st.type === 'lost' ? 'var(--crit)' : st.type === 'nurture' ? 'var(--line-2)' : 'var(--accent)'}}></i>
            <h2>${st.name}</h2><span className="c">${items.length}</span><span className="v">${total ? lakh(total) : ''}</span>
          </div>
          <div className="col-list">
            ${items.length ? items.map(l => html`<${Card} key=${l.id} lead=${l} leads=${leads} open=${open} dragging=${dragId === l.id} onDrag=${setDragId}/>`) : html`<div className="col-empty">Drop a lead here</div>`}
          </div>
        </div>`;
      })}
    </div>` : html`<div className="table-wrap" style=${{flex:1,minHeight:0,overflow:'auto'}}><table>
      <thead><tr><th>Client</th><th>Source</th><th>Stage</th><th className="r">Value</th><th>Follow-up</th><th>WhatsApp</th><th>Owner</th></tr></thead>
      <tbody>${shown.map(l => html`<tr key=${l.id} className="click" onClick=${() => open(l.id, 'details')}>
        <td><b>${l.name}</b><div className="sub">${l.interest}</div></td>
        <td><${SourceTag} lead=${l} leads=${leads}/></td>
        <td onClick=${e => e.stopPropagation()}><select className="sel" id=${'st-' + l.id} value=${l.stage} onChange=${e => move(l.id, e.target.value)} aria-label=${'Stage for ' + l.name}>${STAGES.map(s => html`<option key=${s.id} value=${s.id}>${s.name}</option>`)}</select></td>
        <td className="r num"><b>${lakh(l.value)}</b></td>
        <td>${['won','lost'].includes(l.stage) ? html`<span className="sub">Closed</span>` : html`<${Due} fu=${l.fu}/>`}</td>
        <td>${windowOpen(l) ? html`<span className="wa-pill"><span className="dot"></span>${hoursLeft(l)}h left</span>` : html`<span className="sub">Template only</span>`}</td>
        <td>${l.owner}</td>
      </tr>`)}</tbody></table></div>`}
  </section>`;
}
function Card({lead, leads, open, dragging, onDrag}){
  const closed = ['won','lost'].includes(lead.stage);
  return html`<button className=${'card' + (dragging ? ' dragging' : '')} draggable="true"
    onDragStart=${e => { e.dataTransfer.setData('text/plain', lead.id); e.dataTransfer.effectAllowed = 'move'; onDrag(lead.id); }}
    onDragEnd=${() => onDrag(null)} onClick=${() => open(lead.id, 'chat')}>
    <div className="card-top"><span className="name">${lead.name}</span>${windowOpen(lead) && awaitingReply(lead) ? html`<span className="wa-pill wa-dot" title="Client is waiting for a reply"><span className="dot"></span>Reply</span>` : windowOpen(lead) ? html`<span className="dot wa-dot" title="WhatsApp 24-hour window open"></span>` : null}</div>
    <div className="card-meta">${lead.interest}${lead.area ? ' · ' + lead.area : ''}</div>
    <div className="card-row"><${SourceTag} lead=${lead} leads=${leads}/><span className="val">${lakh(lead.value)}</span></div>
    <div className="card-foot">${closed ? html`<span className="due">${lead.stage === 'lost' ? 'Lost · ' + lead.lostReason : 'Closed'}</span>` : html`<${Due} fu=${lead.fu}/>`}<span className="avatar" title=${'Owner: ' + lead.owner}>${lead.owner.slice(0,2).toUpperCase()}</span></div>
  </button>`;
}

/* ---------- Drawer ---------- */
function Drawer({lead, leads, tab, setTab, close, move, send, follow, setOwner, extra}){
  useEffect(() => { const k = e => e.key === 'Escape' && close(); window.addEventListener('keydown', k); return () => window.removeEventListener('keydown', k); }, []);
  const idx = OPEN.indexOf(lead.stage);
  const [copied, setCopied] = useState(false);
  const copy = () => { navigator.clipboard?.writeText(lead.phone).then(() => { setCopied(true); setTimeout(() => setCopied(false), 1500); }).catch(() => {}); };
  const by = refName(lead, leads);
  return html`<div>
    <div className="scrim" onClick=${close}></div>
    <aside className="drawer" role="dialog" aria-label=${lead.name}>
      <div className="d-head">
        <div className="d-title">
          <div style=${{minWidth:0}}>
            <h2>${lead.name}</h2>
            <div className="phone">${lead.phone} · <button className="linkbtn" style=${{color:'var(--muted)',fontSize:12,marginTop:0}} onClick=${copy}>${copied ? 'Copied' : 'Copy'}</button></div>
          </div>
          <div className="d-actions"><button className="icon-btn" onClick=${close} aria-label="Close"><${Icon} n="x"/></button></div>
        </div>
        <div style=${{display:'flex',gap:10,alignItems:'center',flexWrap:'wrap'}}><${SourceTag} lead=${lead} leads=${leads} full=${true}/><span className="val">${lakh(lead.value)}</span>${!['won','lost'].includes(lead.stage) && html`<${Due} fu=${lead.fu}/>`}</div>
        <div className="stepper" role="group" aria-label="Stage">
          ${STAGES.map(s => { const i = OPEN.indexOf(s.id); const done = idx >= 0 && i >= 0 && i < idx;
            return html`<button key=${s.id} className=${'step ' + s.type + (s.id === lead.stage ? ' cur' : done ? ' done' : '')} onClick=${() => move(lead.id, s.id)} aria-pressed=${s.id === lead.stage}>${s.name}</button>`; })}
        </div>
      </div>
      <div className="tabs" role="tablist">
        ${[['chat','WhatsApp'],['details','Details'],['timeline','Timeline']].map(([id,n]) => html`<button key=${id} role="tab" aria-selected=${tab === id} onClick=${() => setTab(id)}>${n}</button>`)}
      </div>
      <div className="d-body" style=${tab === 'chat' ? {overflow:'hidden'} : null}>
        ${tab === 'chat' && html`<${Chat} lead=${lead} send=${send}/>`}
        ${tab === 'details' && html`<div className="details">
          <dl className="fields">
            <div><dt>Source</dt><dd>${srcById[lead.source].name}${lead.sub ? ' · ' + lead.sub : ''}</dd></div>
            <div><dt>Referred by</dt><dd>${by ? (partnerById[lead.ref] ? `${by}, ${partnerById[lead.ref].firm}` : `${by} (client)`) : '—'}</dd></div>
            <div><dt>Interest</dt><dd>${lead.interest}</dd></div>
            <div><dt>Deal value</dt><dd className="num">${inr(lead.value)}</dd></div>
            <div><dt>Area</dt><dd>${lead.area || '—'}</dd></div>
            <div><dt>Showroom</dt><dd>${lead.showroom || '—'}</dd></div>
            <div><dt>Created</dt><dd>${dayLabel(lead.created)}</dd></div>
            <div><dt>Owner</dt><dd><select className="sel" id=${'owner-' + lead.id} value=${lead.owner} onChange=${e => setOwner(e.target.value)} aria-label="Owner">${OWNERS.map(o => html`<option key=${o}>${o}</option>`)}</select></dd></div>
          </dl>
          ${!['won','lost'].includes(lead.stage) && html`<div className="box"><h4>Next follow-up</h4>
            <div style=${{display:'flex',alignItems:'center',gap:10}}><${Due} fu=${lead.fu}/>${lead.fu && html`<span className="sub" style=${{fontSize:12,color:'var(--muted)'}}>${fmtDate(lead.fu)}</span>`}</div>
            <div className="row-btns">${[[0,'Today'],[1,'Tomorrow'],[3,'In 3 days'],[7,'Next week']].map(([d,n]) => html`<button key=${d} className="btn small" onClick=${() => follow(lead.id, d)}><${Icon} n="cal" s=${14}/>${n}</button>`)}</div>
          </div>`}
          ${srcById[lead.source].family === 'partner' && html`<div className="box"><h4>Partner credit</h4>
            <div style=${{fontSize:13}}>${partnerById[lead.ref].name} · ${partnerById[lead.ref].tier} · ${partnerById[lead.ref].rate}% commission</div>
            <div style=${{fontSize:13,color:'var(--muted)'}}>${lead.stage === 'won' ? `Commission ${inr(lead.value * partnerById[lead.ref].rate / 100)} due for approval.` : `Estimated commission on Won: ${inr(lead.value * partnerById[lead.ref].rate / 100)}. Credit protected for 90 days from ${dayLabel(lead.created)}.`}</div>
          </div>`}
          ${extra}
          ${lead.stage === 'lost' && html`<div className="box"><h4>Lost reason</h4><div>${lead.lostReason}</div></div>`}
        </div>`}
        ${tab === 'timeline' && html`<ol className="timeline">${[...lead.timeline].reverse().map((e,i) => html`<li key=${i} className=${e.auto ? 'auto' : ''}><span>${e.text}${e.auto ? html` <span style=${{color:'var(--accent)',fontSize:11,fontWeight:600}}>· automation</span>` : null}</span><time>${dayLabel(e.t)}, ${clock(e.t)}</time></li>`)}</ol>`}
      </div>
    </aside>
  </div>`;
}

/* ---------- Chat ---------- */
function Chat({lead, send}){
  const [text, setText] = useState('');
  const [tpl, setTpl] = useState(TEMPLATES[0].id);
  const end = useRef(null);
  const isOpen = windowOpen(lead);
  useEffect(() => { end.current?.scrollIntoView({block:'end'}); }, [lead.msgs.length, lead.id]);
  const fill = b => b.replace('{{name}}', first(lead.name)).replace('{{interest}}', lead.interest.toLowerCase());
  const submit = () => { const t = text.trim(); if (!t) return; send(lead.id, t); setText(''); };
  let lastDay = '';
  return html`<div className="chat">
    ${isOpen ? html`<div className="window open"><span className="dot"></span>24-hour window open · ${hoursLeft(lead)}h left for free-form replies</div>`
      : html`<div className="window closed"><${Icon} n="lock" s=${14}/>Window closed. Send an approved template to restart the chat.</div>`}
    <div className="msgs">
      ${lead.msgs.length === 0 && html`<div className="day">No messages yet</div>`}
      ${lead.msgs.map((m,i) => { const d = dayLabel(m.t); const sep = d !== lastDay; lastDay = d;
        return html`<${React.Fragment} key=${i}>${sep && html`<div className="day">${d}</div>`}
          <div className=${'msg ' + m.from}>${m.tpl && html`<span className="tpl">${m.from === 'auto' ? 'Automation · ' : 'Template · '}${m.tpl}</span>`}<span>${m.text}</span><span className="meta">${clock(m.t)}${m.from !== 'them' ? html`<span style=${{color:'var(--wa)'}}>✓✓</span>` : null}</span></div>
        <//>`; })}
      <div ref=${end}></div>
    </div>
    <div className="composer">
      ${isOpen ? html`
        <div className="quick">${QUICK.map(q => html`<button key=${q} onClick=${() => setText(q)}>${q}</button>`)}</div>
        <div className="compose-row">
          <textarea id=${'compose-' + lead.id} rows="1" placeholder=${'Reply to ' + first(lead.name)} value=${text} onInput=${e => setText(e.target.value)} onKeyDown=${e => { if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); submit(); } }} aria-label="Message"></textarea>
          <button className="btn wa" onClick=${submit} disabled=${!text.trim()}><${Icon} n="send" s=${16}/>Send</button>
        </div>` : html`
        <div className="tpl-list" role="group" aria-label="Approved templates">${TEMPLATES.map(t => html`<button key=${t.id} className="tpl-opt" aria-pressed=${tpl === t.id} onClick=${() => setTpl(t.id)}><b>${t.id}</b><em>${t.cat}</em><span>${fill(t.body)}</span></button>`)}</div>
        <div style=${{display:'flex',justifyContent:'flex-end'}}><button className="btn wa" onClick=${() => { const t = TEMPLATES.find(x => x.id === tpl); send(lead.id, fill(t.body), t.id); }}><${Icon} n="send" s=${16}/>Send template</button></div>`}
    </div>
  </div>`;
}

/* ---------- Dashboard ---------- */
function Dashboard({leads, open, go}){
  const openLeads = leads.filter(l => OPEN.includes(l.stage));
  const weekNew = leads.filter(l => Date.now() - l.created < 7*DAY).length;
  const due = openLeads.filter(l => l.fu && daysFrom(l.fu) <= 0).sort((a,b) => a.fu < b.fu ? -1 : 1);
  const overdue = due.filter(l => daysFrom(l.fu) < 0).length;
  const pipe = openLeads.reduce((s,l) => s + l.value, 0);
  const won = leads.filter(l => l.stage === 'won');
  const wonVal = won.reduce((s,l) => s + l.value, 0);
  const waiting = leads.filter(l => awaitingReply(l) && windowOpen(l) && !['won','lost'].includes(l.stage));
  const bySrc = SOURCES.map(s => { const all = leads.filter(l => l.source === s.id); return {s, n:all.length, won:all.filter(l => l.stage === 'won').length, val:all.filter(l => l.stage === 'won').reduce((a,l) => a + l.value, 0)}; });
  const max = Math.max(...bySrc.map(x => x.n), 1);
  const reached = OPEN.map((id,i) => ({id, name:stageById[id].name, n:leads.filter(l => { const j = OPEN.indexOf(l.stage); return (j >= i) || l.stage === 'won'; }).length}));
  const fmax = Math.max(...reached.map(r => r.n), 1);
  const hr = new Date().getHours();
  return html`<section className="view">
    <p style=${{margin:'0 0 14px',color:'var(--muted)'}}>${hr < 12 ? 'Good morning' : hr < 17 ? 'Good afternoon' : 'Good evening'}. ${due.length} follow-ups need attention today and ${waiting.length} clients are waiting for a reply.</p>
    <div className="kpis">
      <div className="kpi"><span className="l">New this week</span><span className="v">${weekNew}</span><span className="s">${leads.filter(l => Date.now() - l.created < DAY).length} today</span></div>
      <div className=${'kpi' + (overdue ? ' alert' : '')}><span className="l">Follow-ups due</span><span className="v">${due.length}</span><span className="s">${overdue} overdue</span></div>
      <div className="kpi"><span className="l">Open pipeline</span><span className="v">${lakh(pipe)}</span><span className="s">${openLeads.length} active leads</span></div>
      <div className="kpi"><span className="l">Won</span><span className="v">${lakh(wonVal)}</span><span className="s">${won.length} deals closed</span></div>
    </div>
    <div className="grid2">
      <div className="stack">
        <div className="panel"><h3>Leads by source</h3><p className="hint">Total leads, with the won share filled solid. Partner sources close the largest deals.</p>
          <div className="bars">${bySrc.map(x => html`<div className="bar-row" key=${x.s.id}>
            <span style=${{display:'flex',alignItems:'center',gap:8,minWidth:0}}><i style=${{width:8,height:8,borderRadius:2,background:`var(--s-${x.s.id})`,flex:'none'}}></i><span style=${{overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>${x.s.short}</span></span>
            <div className="bar-track" title=${`${x.n} leads, ${x.won} won`}><i style=${{width:(x.won/max*100)+'%',background:`var(--s-${x.s.id})`}}></i><i style=${{width:((x.n-x.won)/max*100)+'%',background:`var(--s-${x.s.id})`,opacity:.35}}></i></div>
            <span className="n"><b>${x.n}</b> · ${x.val ? lakh(x.val) : '—'}</span></div>`)}</div>
          <div className="legend"><span><i style=${{background:'var(--ink-2)'}}></i>Won</span><span><i style=${{background:'var(--ink-2)',opacity:.35}}></i>Open, nurture or lost</span><span>Right: leads · won value</span></div>
        </div>
        <div className="panel"><h3>Pipeline funnel</h3><p className="hint">Leads that have reached each stage, including those now won.</p>
          <div className="funnel">${reached.map(r => html`<div className="f-row" key=${r.id}><span>${r.name}</span><div><div className="f-bar" style=${{width:(r.n/fmax*100)+'%'}}></div></div><span className="n">${r.n}</span></div>`)}</div>
        </div>
      </div>
      <div className="stack">
        <div className="panel"><h3>Waiting for a reply</h3><p className="hint">Inside the free 24-hour window. Answer these first.</p>
          <div className="task-list">${waiting.length ? waiting.map(l => html`<button className="task" key=${l.id} onClick=${() => open(l.id, 'chat')}><span className="avatar" style=${{marginLeft:0}}>${initials(l.name)}</span><span className="who"><b>${l.name}</b><span>${l.msgs[l.msgs.length-1].text}</span></span><span className="wa-pill" style=${{marginLeft:'auto'}}>${ago(l.lastIn)}</span></button>`) : html`<p className="hint">All caught up.</p>`}</div>
        </div>
        <div className="panel"><h3>Follow-ups due</h3><p className="hint">Overdue first, then today.</p>
          <div className="task-list">${due.map(l => html`<button className="task" key=${l.id} onClick=${() => open(l.id, 'details')}><span className="avatar" style=${{marginLeft:0}}>${initials(l.name)}</span><span className="who"><b>${l.name}</b><span>${stageById[l.stage].name} · ${l.owner}</span></span><${Due} fu=${l.fu}/></button>`)}</div>
          <button className="btn small ghost" style=${{marginTop:8}} onClick=${() => go('pipeline')}>Open the board</button>
        </div>
      </div>
    </div>
  </section>`;
}

/* ---------- Inbox ---------- */
function Inbox({leads, open, send}){
  const [filter, setFilter] = useState('all');
  const convs = leads.filter(l => l.msgs.length).sort((a,b) => b.msgs[b.msgs.length-1].t - a.msgs[a.msgs.length-1].t)
    .filter(l => filter === 'all' || (filter === 'waiting' ? awaitingReply(l) : windowOpen(l)));
  const [sel, setSel] = useState(() => convs[0]?.id);
  const lead = leads.find(l => l.id === sel) || convs[0];
  const narrow = () => window.matchMedia('(max-width:860px)').matches;
  return html`<section className="view inbox-view">
    <div className="inbox">
      <div className="convs">
        <div className="inbox-filter" role="group" aria-label="Filter">${[['all','All'],['waiting','Waiting'],['open','Window open']].map(([id,n]) => html`<button key=${id} className="chip" aria-pressed=${filter === id} onClick=${() => setFilter(id)}>${n}</button>`)}</div>
        ${convs.map(l => { const m = l.msgs[l.msgs.length-1]; return html`<button key=${l.id} className="conv" aria-current=${lead && lead.id === l.id ? 'true' : undefined} onClick=${() => narrow() ? open(l.id, 'chat') : setSel(l.id)}>
          <span className="av">${initials(l.name)}</span>
          <span className="mid"><b>${l.name}</b><span className="prev">${m.from === 'them' ? '' : 'You: '}${m.text}</span><${SourceTag} lead=${l} leads=${leads}/></span>
          <span className="right"><span>${ago(m.t)}</span>${awaitingReply(l) ? html`<span className="unread">1</span>` : null}</span>
        </button>`; })}
      </div>
      <div className="chat-pane">${lead ? html`
        <div className="chat-head"><span className="avatar" style=${{marginLeft:0}}>${initials(lead.name)}</span><div style=${{minWidth:0}}><b>${lead.name}</b><div style=${{fontSize:12,color:'var(--muted)'}}>${stageById[lead.stage].name} · ${lead.owner}</div></div><button className="btn small" style=${{marginLeft:'auto'}} onClick=${() => open(lead.id, 'details')}>Open lead</button></div>
        <div style=${{flex:1,minHeight:0}}><${Chat} key=${lead.id} lead=${lead} send=${send}/></div>` : null}
      </div>
    </div>
  </section>`;
}

/* ---------- Partners ---------- */
function Partners({leads, open}){
  const [exp, setExp] = useState(null);
  const [type, setType] = useState('all');
  const rows = PARTNERS.map(p => {
    const ls = leads.filter(l => l.ref === p.id);
    const won = ls.filter(l => l.stage === 'won');
    const wonVal = won.reduce((s,l) => s + l.value, 0);
    const last = ls.length ? Math.max(...ls.map(l => l.created)) : null;
    return {p, ls, won:won.length, wonVal, comm:wonVal * p.rate / 100, open:ls.filter(l => OPEN.includes(l.stage)).length, lastDays: last ? Math.floor((Date.now()-last)/DAY) : null};
  }).filter(r => type === 'all' || r.p.type === type).sort((a,b) => b.wonVal - a.wonVal || b.ls.length - a.ls.length);
  const typeName = {architect:'Architect / Interior planner', contractor:'Civil engineer / Contractor', agent:'Real estate agent'};
  const totalDue = rows.reduce((s,r) => s + r.comm, 0);
  return html`<section className="view">
    <div className="toolbar">
      <div className="chips" role="group" aria-label="Partner type">${[['all','All partners'],['architect','Architects'],['contractor','Contractors'],['agent','Agents']].map(([id,n]) => html`<button key=${id} className="chip" aria-pressed=${type === id} onClick=${() => setType(id)}>${n}</button>`)}</div>
      <span style=${{marginLeft:'auto',fontSize:13,color:'var(--muted)'}}>Commission due: <b className="num" style=${{color:'var(--ink)'}}>${inr(totalDue)}</b></span>
    </div>
    <div className="table-wrap"><table>
      <thead><tr><th>Partner</th><th>Type</th><th>Tier</th><th className="r">Leads</th><th className="r">Open</th><th className="r">Won value</th><th className="r">Commission due</th><th>Last lead</th></tr></thead>
      <tbody>${rows.map(r => html`<${React.Fragment} key=${r.p.id}>
        <tr className="click" onClick=${() => setExp(exp === r.p.id ? null : r.p.id)} aria-expanded=${exp === r.p.id}>
          <td className="p-name"><b>${r.p.name}</b><div className="sub">${r.p.firm} · managed by ${r.p.owner}</div></td>
          <td><span className="src"><i className="sw" style=${{background:`var(--s-${r.p.type})`}}></i>${typeName[r.p.type]}</span></td>
          <td><span className=${'tier ' + r.p.tier}>${r.p.tier}</span></td>
          <td className="r num">${r.ls.length}</td><td className="r num">${r.open}</td>
          <td className="r num"><b>${r.wonVal ? lakh(r.wonVal) : '—'}</b></td>
          <td className="r num">${r.comm ? inr(r.comm) : '—'}<div className="sub">${r.p.rate}%</div></td>
          <td>${r.lastDays == null ? html`<span className="dormant">No leads yet</span>` : r.lastDays > 60 ? html`<span className="dormant">${r.lastDays}d ago</span>` : html`<span className="num">${r.lastDays === 0 ? 'Today' : r.lastDays + 'd ago'}</span>`}</td>
        </tr>
        ${exp === r.p.id && html`<tr className="expand"><td colSpan="8">${r.ls.length ? html`<div className="mini-leads">${r.ls.map(l => html`<button key=${l.id} className="mini" onClick=${() => open(l.id, 'details')}><b>${l.name}</b><span style=${{color:'var(--muted)'}}>${stageById[l.stage].name}</span><span className="num">${lakh(l.value)}</span></button>`)}</div>` : html`<span style=${{color:'var(--muted)'}}>No leads referred yet. The dormant-partner automation will create a visit task for ${r.p.owner}.</span>`}</td></tr>`}
      <//>`)}</tbody>
    </table></div>
  </section>`;
}

/* ---------- Automations ---------- */
function Automations({autos, toggle}){
  const on = autos.filter(a => a.on).length;
  return html`<section className="view">

    <div className="autos">${autos.map(a => html`<article key=${a.id} className=${'auto' + (a.on ? '' : ' off')}>

      <div className="auto-foot"><span>${a.on ? 'Running' : 'Paused'}</span><span className="num">${a.runs} runs this month</span></div>
    </article>`)}</div>
  </section>`;
}

/* ---------- Add lead ---------- */
function AddLead({leads, close, add}){
  const [f, setF] = useState({name:'', phone:'', source:'', sub:'', ref:'', showroom:SHOWROOMS[0], interest:'', value:'', area:'', owner:OWNERS[0]});
  const [tried, setTried] = useState(false);
  const set = (k,v) => setF(x => ({...x, [k]:v}));
  const s = srcById[f.source];
  const digits = f.phone.replace(/\D/g,'').slice(-10);
  const dup = digits.length === 10 ? leads.find(l => l.phone.replace(/\D/g,'').slice(-10) === digits) : null;
  const partners = s?.family === 'partner' ? PARTNERS.filter(p => p.type === f.source) : [];
  const clients = leads.filter(l => l.stage === 'won');
  const errs = {name:!f.name.trim(), phone:digits.length !== 10, source:!f.source, ref:(s?.family === 'partner' || s?.family === 'referral') && !f.ref};
  const ok = !Object.values(errs).some(Boolean);
  const submit = e => { e.preventDefault(); setTried(true); if (!ok) return;
    const owner = s.family === 'partner' ? partnerById[f.ref].owner : f.owner;
    add({...f, owner, phone:'+91 ' + digits.slice(0,5) + ' ' + digits.slice(5), showroom: f.source === 'walkin' ? f.showroom : '', dup:!!dup}); };
  return html`<div className="modal" role="dialog" aria-modal="true" aria-label="Add lead">
    <div className="scrim" onClick=${close}></div>
    <form className="sheet" onSubmit=${submit} noValidate>
      <header><h2>Add lead</h2><p>Name, mobile and source are all you need. A welcome message goes out automatically.</p></header>
      <div className="form">
        <label>Client name <span className="req">*</span><input id="f-name" value=${f.name} onInput=${e => set('name', e.target.value)} placeholder="e.g. Rohan Agrawal" autoFocus/>${tried && errs.name && html`<span className="err">Enter the client's name.</span>`}</label>
        <label>WhatsApp number <span className="req">*</span><input id="f-phone" inputMode="tel" value=${f.phone} onInput=${e => set('phone', e.target.value)} placeholder="10-digit mobile"/>${tried && errs.phone && html`<span className="err">Enter a 10-digit mobile number.</span>`}</label>
        ${dup && html`<div className="warnbox full">This number is already a lead: <b>${dup.name}</b> (${srcById[dup.source].short}${dup.ref ? ', ' + refName(dup, leads) : ''}, ${stageById[dup.stage].name}). Saving will flag it for the manager so partner credit is not double-counted.</div>`}
        <div className="full" style=${{display:'grid',gap:6}}>
          <span style=${{fontSize:12,fontWeight:500,color:'var(--ink-2)'}}>Lead source <span className="req">*</span></span>
          <div className="src-grid" role="group" aria-label="Lead source">${SOURCES.map(x => html`<button type="button" key=${x.id} className="src-opt" aria-pressed=${f.source === x.id} onClick=${() => setF(v => ({...v, source:x.id, ref:'', sub:''}))}><i style=${{width:9,height:9,borderRadius:2,background:`var(--s-${x.id})`,flex:'none'}}></i>${x.name}</button>`)}</div>
          ${tried && errs.source && html`<span className="err">Pick where this client came from.</span>`}
        </div>
        ${s?.family === 'partner' && html`<label className="full">Referred by <span className="req">*</span><select id="f-ref" value=${f.ref} onChange=${e => set('ref', e.target.value)}><option value="">Choose ${s.short.toLowerCase()}</option>${partners.map(p => html`<option key=${p.id} value=${p.id}>${p.name}, ${p.firm}</option>`)}</select>${tried && errs.ref && html`<span className="err">Choose the partner who sent this client, so they get credit.</span>`}${f.ref && html`<span style=${{color:'var(--muted)',fontWeight:400}}>Assigned to ${partnerById[f.ref].owner}, who manages this partner.</span>`}</label>`}
        ${s?.family === 'referral' && html`<label className="full">Referred by client <span className="req">*</span><select id="f-client" value=${f.ref} onChange=${e => set('ref', e.target.value)}><option value="">Choose an existing client</option>${clients.map(c => html`<option key=${c.id} value=${c.id}>${c.name}</option>`)}</select>${tried && errs.ref && html`<span className="err">Choose the client who referred them.</span>`}</label>`}
        ${f.source === 'walkin' && html`<label>Showroom<select id="f-showroom" value=${f.showroom} onChange=${e => set('showroom', e.target.value)}>${SHOWROOMS.map(x => html`<option key=${x}>${x}</option>`)}</select></label>`}
        ${SUB[f.source] && html`<label>Sub-source<select id="f-sub" value=${f.sub} onChange=${e => set('sub', e.target.value)}><option value="">Choose</option>${SUB[f.source].map(x => html`<option key=${x}>${x}</option>`)}</select></label>`}
        <label>Interested in<input id="f-interest" value=${f.interest} onInput=${e => set('interest', e.target.value)} placeholder="Modular kitchen, wardrobes"/></label>
        <label>Budget (₹)<input id="f-value" inputMode="numeric" value=${f.value} onInput=${e => set('value', e.target.value.replace(/\D/g,''))} placeholder="350000"/></label>
        <label>Area<input id="f-area" value=${f.area} onInput=${e => set('area', e.target.value)} placeholder="Locality"/></label>
        ${s?.family !== 'partner' && html`<label>Owner<select id="f-owner" value=${f.owner} onChange=${e => set('owner', e.target.value)}>${OWNERS.map(o => html`<option key=${o}>${o}</option>`)}</select></label>`}
        <div className="form-foot"><button type="button" className="btn ghost" onClick=${close}>Cancel</button><button type="submit" className="btn primary">Add lead</button></div>
      </div>
    </form>
  </div>`;
}

function LostDialog({lead, close, pick}){
  return html`<div className="modal" role="dialog" aria-modal="true" aria-label="Lost reason">
    <div className="scrim" onClick=${close}></div>
    <div className="sheet" style=${{width:'min(400px,100%)'}}>
      <header><h2>Mark as lost</h2><p>Why is ${lead.name} not going ahead? This feeds the lost-reason report.</p></header>
      <div className="reasons">${LOST_REASONS.map(r => html`<button key=${r} className="btn" style=${{justifyContent:'flex-start'}} onClick=${() => pick(r)}>${r}</button>`)}<button className="btn ghost" onClick=${close}>Cancel</button></div>
    </div>
  </div>`;
}

const isCustomerPortal = /^\/c(\/|$)/.test(location.pathname);
if (isCustomerPortal) API.setAudience('customer');
ReactDOM.createRoot(document.getElementById('root')).render(isCustomerPortal ? html`<${CustomerApp} live=${true}/>` : html`<${App}/>`);
if ('serviceWorker' in navigator && location.protocol !== 'file:') window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
</script>

</body></html>
