<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Make My Space CRM + Operations</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#F7F4F0">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap">
<style>
/* Make My Space Brand Book v1.0 (2026): Cola Red #F40009, Ink #1A1A1A, White, Warm White #F7F4F0. Inter only.
   Square corners, 2px Ink rules, red reserved for the single primary action and for alerts. No gradients, no shadows.
   Functional greys are Ink at reduced opacity (text hierarchy and hairlines only), so the four-colour palette holds. */
:root{
  --red:#F40009; --ink-solid:#1A1A1A; --white:#FFFFFF; --warm:#F7F4F0;
  --bg:var(--warm); --surface:var(--white); --surface-2:rgba(26,26,26,.045);
  --line:rgba(26,26,26,.12); --line-2:rgba(26,26,26,.28);
  --ink:#1A1A1A; --ink-2:rgba(26,26,26,.84); --muted:rgba(26,26,26,.62);
  --rail:var(--white); --rail-2:rgba(26,26,26,.05); --rail-ink:#1A1A1A; --rail-muted:rgba(26,26,26,.62);
  --accent:var(--red); --accent-strong:var(--red); --accent-soft:rgba(26,26,26,.05); --on-accent:#FFFFFF;
  --good:#1A1A1A; --good-soft:rgba(26,26,26,.06); --warn:var(--red); --warn-soft:rgba(244,0,9,.06); --crit:var(--red); --crit-soft:rgba(244,0,9,.08);
  --wa:#1A1A1A; --bubble-us:var(--warm); --bubble-auto:var(--warm); --bubble-them:var(--white);
  --s-architect:#1A1A1A; --s-contractor:rgba(26,26,26,.72); --s-agent:rgba(26,26,26,.52); --s-walkin:rgba(26,26,26,.36); --s-field:rgba(26,26,26,.22); --s-online:rgba(26,26,26,.6); --s-referral:rgba(26,26,26,.88);
  --shadow:none;
  --f-display:"Inter","Noto Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Inter","Noto Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:0px; color-scheme:light;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14.5px;line-height:1.5;overflow:hidden;-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01"}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
::selection{background:rgba(244,0,9,.16)}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
#root{height:100%}
/* kicker: SemiBold 600, uppercase, +20% tracking, a 40x4 red bar above */
.kicker,.topbar .eyebrow{display:block;font-weight:600;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink)}
.topbar .eyebrow::before,.kicker::before{content:"";display:block;width:32px;height:3px;background:var(--red);margin-bottom:8px}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);height:100%}
.rail{background:var(--rail);color:var(--rail-ink);display:flex;flex-direction:column;padding:24px 16px 18px;gap:24px;min-height:0;border-right:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;padding:0 6px}
.brand img{width:80px;height:auto;display:block;flex:none}
.brand b{font-weight:600;letter-spacing:.2em;font-size:10.5px;text-transform:uppercase;line-height:1.3;color:var(--ink)}
.brand small{display:block;font-weight:500;letter-spacing:.2em;font-size:9.5px;color:var(--muted);margin-top:4px}
.nav{display:flex;flex-direction:column;gap:1px}
.nav button{display:flex;align-items:center;gap:12px;background:none;border:0;color:var(--rail-muted);padding:10px 12px;border-radius:0;text-align:left;font-weight:500;font-size:14px;position:relative}
.nav button:hover{color:var(--ink);background:var(--rail-2)}
.nav button[aria-current="page"]{color:var(--ink);background:var(--rail-2);font-weight:600}
.nav button[aria-current="page"]::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;background:var(--red)}
.nav button[aria-current="page"] svg{color:var(--ink)}
.nav .count{margin-left:auto;font-size:11px;background:var(--ink);color:#fff;border-radius:0;padding:1px 7px;font-weight:600;font-variant-numeric:tabular-nums}
.rail-label{font-size:10.5px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);padding:0 12px;margin-bottom:6px}
.wa-status{margin-top:auto;border-top:2px solid var(--ink);padding:14px 10px 0;display:grid;gap:4px;font-size:12.5px;color:var(--rail-muted)}
.wa-status b{color:var(--ink);font-weight:600;display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:0;background:var(--ink);display:inline-block;flex:none}
.linkbtn{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;font-size:12.5px;justify-self:start;margin-top:6px}
.linkbtn:hover{color:var(--ink)}

.main{display:flex;flex-direction:column;min-width:0;min-height:0;height:100%}
.topbar{display:flex;align-items:flex-end;gap:12px;padding:20px 28px 16px;border-bottom:1px solid var(--line);background:var(--bg);flex-wrap:wrap}
.topbar h1{font-weight:300;font-size:28px;letter-spacing:-.01em;line-height:1.1;margin:0;margin-right:auto;text-wrap:balance;color:var(--ink)}
.topbar .eyebrow{margin-bottom:8px}
.view{flex:1;min-height:0;overflow:auto;padding:24px 28px 32px}
.view.board-view{display:flex;flex-direction:column;overflow:hidden;padding-bottom:12px}

/* ---------- buttons: square, uppercase SemiBold; red only for the primary action ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--ink);background:var(--surface);color:var(--ink);padding:9px 16px;border-radius:0;font-weight:600;font-size:12px;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;line-height:1.2;transition:background .12s,color .12s}
.btn:hover{background:var(--ink);color:#fff}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.btn.primary:hover{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.small{padding:6px 11px;font-size:11px;letter-spacing:.08em}
.btn.ghost{background:transparent;border-color:var(--line-2)}
.btn.ghost:hover{border-color:var(--ink);background:var(--ink);color:#fff}
.btn.wa{background:var(--surface);border-color:var(--ink);color:var(--ink)}
.btn:disabled,.btn:disabled:hover{opacity:.4;cursor:not-allowed;background:var(--surface);color:var(--ink);border-color:var(--line-2)}
.btn.primary:disabled{background:var(--red);border-color:var(--red);color:#fff}
.seg{display:inline-flex;border:1.5px solid var(--ink);padding:0;border-radius:0}
.seg button{border:0;background:none;padding:7px 14px;border-radius:0;display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--ink)}
.seg button+button{border-left:1.5px solid var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}

.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line-2);border-radius:0;padding:0 12px;min-width:0;flex:0 1 280px}
.search:focus-within{border-color:var(--ink)}
.search input{border:0;background:none;outline:none;padding:9px 0;width:100%;min-width:0}
.search svg{color:var(--muted);flex:none}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;max-width:100%;scrollbar-width:none}
.chip{border:1px solid var(--line-2);background:var(--surface);border-radius:0;padding:6px 12px;font-size:12.5px;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;color:var(--ink)}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:#fff}
.chip .n{opacity:.6;font-variant-numeric:tabular-nums}
select.sel{border:1px solid var(--line-2);background:var(--surface);border-radius:0;padding:8px 10px;font-size:13.5px}
select.sel:focus{border-color:var(--ink);outline:none}

/* ---------- board ---------- */
.board{flex:1;min-height:0;display:flex;gap:16px;overflow-x:auto;padding-bottom:8px}
.col{flex:0 0 280px;display:flex;flex-direction:column;min-height:0;background:transparent;border-radius:0;border-top:2px solid var(--ink);transition:background .15s}
.col.over{background:var(--surface-2)}
.col.closed{flex-basis:240px}
.col-head{padding:12px 2px 10px;display:flex;align-items:baseline;gap:8px}
.col-head h2{font-size:11.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;margin:0}
.col-head .c{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.col-head .v{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.col-head .mark{width:8px;height:8px;border-radius:0;flex:none;align-self:center}
.col-list{flex:1;overflow-y:auto;padding:2px 2px 10px;display:flex;flex-direction:column;gap:8px}
.col-empty{border:1px dashed var(--line-2);border-radius:0;padding:16px;text-align:center;color:var(--muted);font-size:12.5px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:0;padding:12px 14px;display:grid;gap:7px;cursor:grab;box-shadow:none;text-align:left;width:100%;transition:border-color .12s}
.card:hover{border-color:var(--ink)}
.card.dragging{opacity:.4}
.card-top{display:flex;align-items:center;gap:8px}
.card-top .name{font-weight:600;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-top .wa-dot{margin-left:auto}
.card-meta{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-row{display:flex;align-items:center;gap:8px;justify-content:space-between;min-width:0}
.card-foot{display:flex;align-items:center;gap:8px}
.val{font-weight:600;font-variant-numeric:tabular-nums;font-size:13.5px;white-space:nowrap}
.avatar{margin-left:auto;width:26px;height:26px;border-radius:0;background:var(--warm);border:1px solid var(--line);color:var(--ink);display:grid;place-items:center;font-size:10px;font-weight:600;flex:none;letter-spacing:.04em}
.src{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--ink-2);min-width:0}
.src .sw{width:8px;height:8px;border-radius:0;flex:none}
.src span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.src .by{color:var(--muted);font-weight:400}
.due{font-size:11.5px;font-weight:600;padding:2px 7px;border-radius:0;display:inline-flex;align-items:center;gap:4px;white-space:nowrap;background:transparent;border:1px solid var(--line-2);color:var(--ink-2)}
.due.over{background:var(--red);border-color:var(--red);color:#fff}
.due.today{background:transparent;border-color:var(--ink);color:var(--ink)}
.due.none{background:transparent;border-color:transparent;color:var(--red);padding-left:0}
.wa-pill{font-size:11.5px;font-weight:600;color:var(--red);display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.wa-pill .dot{background:var(--red)}

/* ---------- tables ---------- */
.table-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-top:2px solid var(--ink);border-radius:0}
table{border-collapse:collapse;width:100%;min-width:860px}
th{text-align:left;font-weight:600;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--warm)}
td .sub{font-size:12.5px;color:var(--muted)}
td.r,th.r{text-align:right}

/* ---------- dashboard: big Light numbers, one in red only when it needs attention ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:20px}
.kpi{background:var(--surface);border:1px solid var(--line);border-top:2px solid var(--ink);border-radius:0;padding:16px 18px 18px;display:grid;gap:4px}
.kpi .l{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kpi .v{font-size:38px;font-weight:300;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .s{font-size:12.5px;color:var(--muted)}
.kpi.alert .v{color:var(--red)}
.grid2{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:20px}
.panel{background:var(--surface);border:1px solid var(--line);border-top:2px solid var(--ink);border-radius:0;padding:18px 20px;min-width:0}
.panel h3{font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;margin:0 0 4px}
.panel .hint{color:var(--muted);font-size:12.5px;margin:0 0 16px}
.bars{display:grid;gap:12px}
.bar-row{display:grid;grid-template-columns:150px minmax(0,1fr) 92px;gap:12px;align-items:center;font-size:13.5px}
.bar-track{height:12px;background:var(--surface-2);border-radius:0;overflow:hidden;display:flex}
.bar-track i{display:block;height:100%}
.bar-row .n{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted);font-size:12.5px}
.bar-row .n b{color:var(--ink);font-weight:600}
.legend{display:flex;gap:16px;font-size:12.5px;color:var(--muted);margin-top:14px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:0;display:inline-block}
.funnel{display:grid;gap:8px}
.f-row{display:grid;grid-template-columns:110px minmax(0,1fr) 34px;gap:12px;align-items:center;font-size:13.5px}
.f-bar{height:20px;background:var(--ink);opacity:1;border-radius:0;min-width:4px}
.f-row .n{font-variant-numeric:tabular-nums;text-align:right;font-weight:600}
.task-list{display:grid;gap:0}
.task{display:flex;align-items:center;gap:12px;padding:11px 6px;border-radius:0;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%}
.task:last-child{border-bottom:0}
.task:hover{background:var(--warm)}
.task .who{display:grid;min-width:0}
.task .who b{font-weight:600;font-size:14px}
.task .who span{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.task .due{margin-left:auto}
.stack{display:grid;gap:20px}

/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(26,26,26,.38);z-index:40;animation:fade .15s}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(600px,100%);background:var(--bg);z-index:41;display:flex;flex-direction:column;border-left:2px solid var(--ink);animation:slide .2s ease-out;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
@keyframes slide{from{transform:translateX(24px);opacity:0}}
@keyframes fade{from{opacity:0}}
.d-head{padding:22px 24px 16px;border-bottom:1px solid var(--line);display:grid;gap:12px;background:var(--surface)}
.d-title{display:flex;align-items:flex-start;gap:12px}
.d-title h2{font-weight:300;font-size:26px;letter-spacing:-.01em;margin:0;line-height:1.15}
.d-title .phone{font-size:13.5px;color:var(--muted);user-select:all;font-variant-numeric:tabular-nums}
.icon-btn{border:1px solid var(--line-2);background:var(--surface);width:36px;height:36px;border-radius:0;display:grid;place-items:center;flex:none}
.icon-btn:hover{border-color:var(--ink);background:var(--ink);color:#fff}
.d-actions{display:flex;gap:6px;margin-left:auto}
.stepper{display:flex;gap:0;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.step{border:1px solid var(--line-2);margin-left:-1px;background:var(--surface);padding:6px 11px;border-radius:0;font-size:12px;font-weight:500;white-space:nowrap;color:var(--muted)}
.step:first-child{margin-left:0}
.step:hover{color:var(--ink)}
.step.done{color:var(--ink);background:var(--warm)}
.step.cur{background:var(--ink);color:#fff;border-color:var(--ink);position:relative;z-index:1}
.step.won.cur{background:var(--ink);border-color:var(--ink);color:#fff}
.step.lost.cur{background:var(--red);border-color:var(--red);color:#fff}
.tabs{display:flex;gap:22px;padding:0 24px;border-bottom:1px solid var(--line);background:var(--surface)}
.tabs button{border:0;background:none;padding:12px 0;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--ink);font-weight:600;border-color:var(--ink)}
.d-body{flex:1;min-height:0;overflow:auto}

/* ---------- chat ---------- */
.chat{display:flex;flex-direction:column;height:100%;min-height:0}
.window{display:flex;align-items:center;gap:8px;padding:9px 18px;font-size:12.5px;border-bottom:1px solid var(--line)}
.window.open{color:var(--ink)}
.window.closed{color:var(--ink);background:var(--warm);border-left:3px solid var(--red)}
.msgs{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.msg{max-width:82%;padding:9px 13px 7px;border-radius:0;font-size:14px;display:grid;gap:3px;border:1px solid var(--line)}
.msg.them{background:var(--white);align-self:flex-start}
.msg.us{background:var(--white);align-self:flex-end;border-color:var(--line-2);border-right:3px solid var(--ink)}
.msg.auto{background:var(--white);align-self:flex-end;border-color:var(--line-2);border-right:3px solid var(--red)}
.msg .meta{font-size:11px;color:var(--muted);justify-self:end;display:flex;gap:6px}
.msg .tpl{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--red);font-weight:600}
.day{align-self:center;font-size:11.5px;color:var(--muted);background:transparent;border:1px solid var(--line);padding:2px 10px;border-radius:0}
.composer{border-top:1px solid var(--line);padding:12px 14px 14px;display:grid;gap:8px;background:var(--surface)}
.quick{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.quick button{border:1px solid var(--line-2);background:var(--surface);border-radius:0;padding:5px 10px;font-size:12.5px;white-space:nowrap;color:var(--ink)}
.quick button:hover{border-color:var(--ink)}
.compose-row{display:flex;gap:8px;align-items:flex-end}
.compose-row textarea{flex:1;resize:none;border:1px solid var(--line-2);background:var(--surface);border-radius:0;padding:10px 12px;min-height:42px;max-height:120px;outline:none}
.compose-row textarea:focus{border-color:var(--ink)}
.tpl-list{display:grid;gap:6px;max-height:220px;overflow:auto}
.tpl-opt{border:1px solid var(--line);background:var(--surface);border-radius:0;padding:9px 11px;text-align:left;display:grid;gap:2px}
.tpl-opt:hover{border-color:var(--line-2)}
.tpl-opt[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 3px 0 0 var(--ink);background:var(--warm)}
.tpl-opt b{font-size:12.5px;font-weight:600;font-family:ui-monospace,Menlo,monospace}
.tpl-opt span{font-size:12.5px;color:var(--muted)}
.tpl-opt em{font-style:normal;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}

.details{padding:20px 24px;display:grid;gap:20px}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 20px;margin:0}
.fields div{display:grid;gap:3px;min-width:0}
.fields dt{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600}
.fields dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.box{border:1px solid var(--line);border-top:2px solid var(--ink);border-radius:0;padding:16px;background:var(--surface);display:grid;gap:12px}
.box h4{margin:0;font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:600}
.row-btns{display:flex;gap:6px;flex-wrap:wrap}
.timeline{padding:20px 24px;display:grid;gap:0;margin:0;list-style:none}
.timeline li{display:grid;grid-template-columns:14px 1fr auto;gap:10px;padding:0 0 16px;position:relative;font-size:13.5px}
.timeline li::before{content:"";width:7px;height:7px;border-radius:0;background:var(--line-2);margin-top:7px;margin-left:3px}
.timeline li.auto::before{background:var(--red)}

const fmtDT = t => `${dayLabel(t)}, ${clock(t)}`;
function itemHealth(it){
  if (it.stage === 'closed') return 'done';
  if (it.waiting) return 'waiting';
  const d = daysFrom(it.target);
  if (d < 0) return 'late';
  if (stageInfo(it).over) return 'late';
  if (d <= 2 || it.flags.length || openSnags(it).length) return 'risk';
  return 'ok';
}
const HEALTH = {ok:'On track', risk:'At risk', late:'Late', done:'Completed', waiting:'Waiting on client'};

  return (sets[type] || sets.OT).map((label,i) => ({n:i+1, label, got:null}));
}

/* ---------- Login (team or customer) ---------- */
function LoginScreen({audience = 'staff', onLogin, title = 'Team login'}){
  const [phone, setPhone] = useState(''), [step, setStep] = useState(1), [code, setCode] = useState(''), [err, setErr] = useState(''), [info, setInfo] = useState(null), [busy, setBusy] = useState(false), [demo, setDemo] = useState([]);
  const [cfg, setCfg] = useState({}), [gCred, setGCred] = useState(null), [req, setReq] = useState(null), [sent, setSent] = useState(null);
  const gBtn = useRef(null);
  useEffect(() => { API.call('GET', '/auth/demo-users?audience=' + audience).then(r => setDemo(r.users || [])).catch(() => {}); API.call('GET', '/auth/config').then(setCfg).catch(() => {}); }, []);
  // Google sign-in (staff only): Google Identity Services button
  useEffect(() => {
    if (audience !== 'staff' || !cfg.googleClientId || step !== 1 || req || sent) return;
    const draw = () => { if (!window.google?.accounts?.id || !gBtn.current) return false;
      window.google.accounts.id.initialize({client_id:cfg.googleClientId, callback:async resp => {
        setErr(''); setBusy(true);
        try { const r = await API.call('POST', '/auth/google', {credential:resp.credential});
          if (r.needsAccess){ if (cfg.signup === 'closed') setErr('This Google account has no access. Ask your admin to add you.'); else if (r.pending) setSent({name:r.name}); else { setGCred(resp.credential); setReq({name:r.name || '', phone:'', roleWanted:'', note:'', email:r.email}); } }
          else { API.setToken(r.accessToken); await onLogin(r); } }
        catch(x){ setErr(x.message); }
        setBusy(false); }});
      window.google.accounts.id.renderButton(gBtn.current, {theme:'outline', size:'large', text:'continue_with', shape:'rectangular', width:Math.min(360, gBtn.current.offsetWidth || 360)});
      return true; };
    if (draw()) return;
    let sc = document.getElementById('gsi-js');
    if (!sc){ sc = document.createElement('script'); sc.id = 'gsi-js'; sc.src = 'https://accounts.google.com/gsi/client'; sc.async = true; document.head.appendChild(sc); }
    const t = setInterval(() => { if (draw()) clearInterval(t); }, 300);
    return () => clearInterval(t);
  }, [cfg.googleClientId, step, req, sent]);
  const sendReq = async e => { e.preventDefault(); setErr('');
    if (req.name.trim().length < 2) return setErr('Enter your name.');
    if (req.phone.replace(/\D/g,'').length < 10) return setErr('Enter your 10-digit WhatsApp number.');
    setBusy(true);
    try { const r = await API.call('POST', '/auth/access-request', {name:req.name, phone:req.phone, roleWanted:req.roleWanted, note:req.note, ...(gCred ? {credential:gCred} : {})}); setSent({name:req.name, joined:!!r.joined}); setReq(null); } catch(x){ setErr(x.message); }
    setBusy(false); };
  const next = async e => { e.preventDefault(); setErr('');
    if (phone.replace(/\D/g,'').length < 10) return setErr('Enter your 10-digit mobile number.');
    setBusy(true);
    try { const r = await API.call('POST', '/auth/otp/request', {phone, audience}); setInfo(r); setStep(2); } catch(x){ setErr(x.message); }
    setBusy(false); };
  const verify = async e => { e.preventDefault(); setErr(''); setBusy(true);
    try { const r = await API.call('POST', '/auth/otp/verify', {phone, audience, code}); API.setToken(r.accessToken); await onLogin(r); } catch(x){ setErr(x.message); }
    setBusy(false); };
  return html`<div style=${{minHeight:'100%',display:'grid',placeItems:'center',padding:16,background:'var(--bg)',overflow:'auto'}}>
    <div className="sheet" style=${{width:'min(440px,100%)',borderTop:0,border:'1px solid var(--line)'}}>
      <header style=${{display:'grid',gap:18,paddingTop:28}}><${Mark} cls="login-logo"/><div><span className="kicker">${title}</span><h2 style=${{marginTop:10}}>${audience === 'customer' ? 'Your home, step by step.' : 'Precision, made yours.'}</h2><p>${audience === 'customer' ? 'Track your furniture, approve drawings and reach your project manager.' : 'Make My Space CRM + Operations. Sign in with your WhatsApp number.'}</p></div></header>
      ${sent ? html`<div className="form" style=${{gridTemplateColumns:'1fr'}}><div className="banner">${sent.joined ? html`Welcome ${sent.name}. Your account is ready: log in below with your WhatsApp number${gCred ? ' or Google' : ''}. Your manager will give you a role.` : html`Thanks ${sent.name}. Your request has reached the admin. You'll get a WhatsApp message once your access is approved; then log in here.`}</div><button className="btn ghost" onClick=${() => setSent(null)}>Back to login</button></div>`
      : req ? html`<form className="form" style=${{gridTemplateColumns:'1fr'}} onSubmit=${sendReq} noValidate>
          <div className="banner">${req.email ? html`Signed in with Google as <b>${req.email}</b>. ` : ''}Ask for access to the Make My Space app. An admin approves it and sets your role.</div>
          <label>Your name<input autoFocus value=${req.name} onInput=${e => setReq({...req, name:e.target.value})}/></label>
          <label>WhatsApp number<input inputMode="tel" value=${req.phone} onInput=${e => setReq({...req, phone:e.target.value})} placeholder="10-digit mobile"/><span className="hint">Tasks and updates come on WhatsApp.</span></label>
          <label>Your work<select value=${req.roleWanted} onChange=${e => setReq({...req, roleWanted:e.target.value})}><option value="">Choose…</option>${['Sales','Site surveyor','Designer','Purchase','Production / factory','Project manager','Installation team lead','Operations','Accounts','Other'].map(x => html`<option key=${x}>${x}</option>`)}</select></label>
          <label>Note for the admin (optional)<input value=${req.note} onInput=${e => setReq({...req, note:e.target.value})} placeholder="e.g. joined the Raipur showroom"/></label>
          ${err && html`<span className="err">${err}</span>`}
          <div className="inline"><button type="button" className="btn ghost" onClick=${() => { setReq(null); setGCred(null); setErr(''); }}>Back</button><button className="btn primary" type="submit" style=${{marginLeft:'auto'}} disabled=${busy}>Request access</button></div>
        </form>`
      : step === 1 ? html`<form className="form" style=${{gridTemplateColumns:'1fr'}} onSubmit=${next} noValidate>
          <label>Mobile number (WhatsApp)<input inputMode="tel" autoFocus value=${phone} onInput=${e => setPhone(e.target.value)} placeholder="10-digit mobile"/></label>
          ${err && html`<span className="err">${err}</span>`}
          <button className="btn primary" type="submit" disabled=${busy} style=${{justifyContent:'center'}}>${busy ? 'Sending…' : 'Send OTP on WhatsApp'}</button>
          ${audience === 'staff' && cfg.googleClientId && html`<div style=${{display:'grid',gap:8,justifyItems:'center'}}><span style=${{fontSize:12,color:'var(--muted)'}}>or</span><div ref=${gBtn} style=${{width:'100%',display:'flex',justifyContent:'center',minHeight:44}}></div></div>`}
          <p style=${{fontSize:13,color:'var(--muted)',margin:'4px 0 0'}}>${audience === 'staff' ? html`Are you a Make My Space customer? <a href="/c">Customer login</a>` : html`Make My Space team member? <a href="/">Team login</a>`}</p>
          ${audience === 'staff' && cfg.signup !== 'closed' && html`<p style=${{fontSize:13,color:'var(--muted)',margin:'4px 0 0'}}>New to the team? <button type="button" className="linkbtn" onClick=${() => { setErr(''); setReq({name:'', phone:phone, roleWanted:'', note:''}); }}>Request access</button></p>`}
          ${demo.length > 0 && html`<details style=${{fontSize:12,color:'var(--muted)'}}><summary>Demo numbers</summary><div style=${{display:'grid',gap:2,marginTop:6}}>${demo.map(u => html`<button type="button" key=${u.phone} className="linkbtn" style=${{color:'var(--muted)',textAlign:'left',marginTop:0}} onClick=${() => setPhone(u.phone)}>${u.name}${u.role ? ' · ' + (roleById[u.role]?.name || u.role) : ''} · ${u.phone}</button>`)}</div></details>`}
        </form>`
      : html`<form className="form" style=${{gridTemplateColumns:'1fr'}} onSubmit=${verify}>
          <div className="banner">Hi ${info.name}. We sent a code to ${info.phone} on WhatsApp.</div>
          ${info.devCode && html`<div className="banner warn">Demo only: the code is ${info.devCode}</div>`}
          <label>Code<input inputMode="numeric" autoFocus maxLength="8" value=${code} onInput=${e => setCode(e.target.value.replace(/\D/g,'').slice(0,8))} style=${{fontSize:22,letterSpacing:'.4em',textAlign:'center'}}/></label>
          ${err && html`<span className="err">${err}</span>`}
          <div className="inline"><button type="button" className="btn ghost" onClick=${() => { setStep(1); setCode(''); setErr(''); }}>Change number</button><button className="btn primary" type="submit" style=${{marginLeft:'auto'}} disabled=${code.length < 4 || busy}>Log in</button></div>
        </form>`}
    </div></div>`;
}

/* ---------- Users, roles and access control ---------- */
const ROLES = [
  {id:'admin', name:'Owner / Admin'}, {id:'ops_head', name:'Operations head'}, {id:'pm', name:'Project coordinator'},
  {id:'sales', name:'Sales'}, {id:'surveyor', name:'Site surveyor'}, {id:'designer', name:'Designer'},
  {id:'purchase', name:'Purchase'}, {id:'production', name:'Production coordinator'}, {id:'installer', name:'Installer'},
  {id:'guest', name:'New member (no role yet)'}];
const roleById = Object.fromEntries(ROLES.map(r => [r.id, r]));
const PERMS = [
  ['crm','CRM','Leads, inbox, partners and automations'],
  ['ops','Operations dashboard','Company-wide numbers and late items'],
  ['projects','View projects','Projects, items, drawings, survey data'],
  ['money','See money','Project values, quotations, payments, invoices, commissions'],
  ['edit','Edit and move items','Move items through stages, edit details, create projects'],
  ['assign','Assign installers','Installer management board and assignment anywhere'],
  ['override','Override hard gates','Push an item past a blocked gate with a logged reason'],
  ['payments','Payments and site readiness','Mark payment milestones and site ready'],
  ['tasksAll','Everyone’s tasks','Team board and WhatsApp reminder screen; otherwise own tasks only'],
  ['survey','Survey app','Capture rooms, walls and measurements'],
  ['install','Installer app','Start, pause, complete jobs, raise snags'],
  ['team','Team performance','On-time %, work time, snag rate'],
  ['support','Customer support','Complaint desk: raise, assign teams, schedule visits, override closures'],
  ['people','Approve sign-ups','Approve access requests and give new members a role (not admin)'],
  ['admin','Users and access','Add users, change roles, edit this matrix']];
const P = s => Object.fromEntries(PERMS.map(([k]) => [k, s.includes(k)]));
const DEFAULT_ROLES = {
  admin:P(PERMS.map(p => p[0])),
  ops_head:P(['crm','ops','projects','money','edit','assign','payments','tasksAll','survey','install','team','support','people']),
  pm:P(['ops','projects','money','edit','assign','payments','tasksAll','survey','install','team','support']),
  sales:P(['crm','projects','money']),
  surveyor:P(['survey','projects']),
  designer:P(['projects','edit']),
  purchase:P(['projects','edit']),
  production:P(['projects','edit']),
  installer:P(['install']),
  guest:P([])};
const VIEW_PERM = {dashboard:'crm', pipeline:'crm', inbox:'crm', partners:'crm', automations:'crm', ops:'ops', projects:'projects', tasks:null, support:'support', survey:'survey', install:'install', team:'team', installers:'assign', users:'admin', customer:'tasksAll'};
const can = (erp, perm) => !perm || !!(erp.roles && erp.roles[userById[erp.me]?.role]?.[perm]);
const canView = (erp, view) => can(erp, VIEW_PERM[view]);

/* keep the shared user lists in step with the user table */
function syncTeam(users){
  const active = users.filter(u => u.active !== false).map(u => ({...u, roleName:u.title || roleById[u.role]?.name || u.role}));
  const all = users.map(u => ({...u, roleName:u.title || roleById[u.role]?.name || u.role}));
  TEAM.splice(0, TEAM.length, ...active);
  Object.keys(userById).forEach(k => delete userById[k]); all.forEach(u => { userById[u.id] = u; });
  INSTALLERS.splice(0, INSTALLERS.length, ...active.filter(u => u.role === 'installer'));
  DESIGNERS.splice(0, DESIGNERS.length, ...active.filter(u => u.role === 'designer'));
}

function NoAccess({erp, view}){
  return html`<section className="view"><div className="panel" style=${{maxWidth:520}}><h3>No access</h3><p className="hint" style=${{marginBottom:0}}>${uname(erp.me)} (${userById[erp.me].roleName}) cannot open this screen. An admin can change this in Admin → Users and access.</p></div></section>`;
}

function gatesFor(it, p){
  const g = [], add = (ok, text, hard) => g.push({ok:!!ok, text, hard});
  if (!it || !p) return g;
  switch (it.stage){
    case 'survey': add(p.survey.status === 'submitted', 'Site survey submitted with every wall measured', false); break;
    case 'drawing': { const d = latestDrawing(it), miss = specMissing(it.spec); add(d && d.url, 'Production drawing file uploaded (PDF or image)', true); add(!miss.length, 'Material specification complete' + (miss.length ? ' (missing: ' + miss.join(', ') + ')' : ''), true); add(it.boxes.length > 0, 'Packing list made', true); add(d && d.approved, 'Customer approved the latest drawing', true); break; }
    case 'pi': { add(it.prodPiNo || it.prodPI, 'Production PI raised with the factory (PI number)', true); const m = p.payments.find(x => x.gate === 'order'); add(!p.payments.length || (m && m.received), `Payment received · ${m ? m.label + ' (' + m.pct + '%)' : 'before order'}`, true); break; }
    case 'order': add(it.po, 'Hardware PO number entered', true); add(it.hwReceived, 'Hardware received', true); add(it.productionDone, 'Factory production complete', true); break;
    case 'dispatch': add(it.dispatch, 'Dispatch details entered (vehicle, boxes, date)', false); add(it.delivered, 'Material delivered at site', true); add(p.siteReady, 'Site ready: civil, electrical, painting, flooring done', true); break;
    case 'install': add(it.installDone, 'Installation completed with photos and checklist', true); add(!openSnags(it).length, 'No open snags', true); add(it.signedOff, 'Customer sign-off by WhatsApp OTP', true); break;
    case 'handover': add((p.docs || []).some(d => d.category === 'handover'), 'Handover documents uploaded (warranty card, care guide, photos)', false); break;
  }
  return g;
}


/* =====================================================================
   API CLIENT — every change goes to the Make My Space server; the server
   enforces permissions and business rules and returns the fresh state.
   ===================================================================== */
const API = (() => {
  let token = null, audience = 'user', onAuthLost = () => {};
  const qKey = 'mms-offline-queue';
  const readQ = () => { try { return JSON.parse(localStorage.getItem(qKey)) || []; } catch(e){ return []; } };
  const writeQ = q => { try { localStorage.setItem(qKey, JSON.stringify(q)); } catch(e){} try { window.dispatchEvent(new Event('mms-queue')); } catch(e){} };
  async function refresh(){
    try {
      const r = await fetch('/api/v1/auth/refresh', {method:'POST', credentials:'same-origin', headers:{'Content-Type':'application/json'}, body:JSON.stringify({audience})});
      if (!r.ok) return false;
      token = (await r.json()).accessToken; return true;
    } catch(e){ return false; }
  }
  async function call(method, path, body, opts = {}){
    const doFetch = () => fetch('/api/v1' + path, {method, credentials:'same-origin', headers:{'Content-Type':'application/json', ...(token ? {Authorization:'Bearer ' + token} : {})}, body: body === undefined ? undefined : JSON.stringify(body)});
    let r;
    try { r = await doFetch(); }
    catch(e){
      if (opts.queue){ const q = readQ().filter(x => !(opts.dedupe && x.dedupe === opts.dedupe)); q.push({method, path, body, dedupe:opts.dedupe, at:Date.now()}); writeQ(q); return {queued:true}; }
      throw new Error('No internet connection. Please try again.');
    }
    if (r.status === 401 && !opts.noRefresh){
      if (await refresh()) r = await doFetch();
      else { onAuthLost(); const err = new Error('Please log in again.'); err.status = 401; throw err; }
    }
    const data = r.status === 204 ? {} : await r.json().catch(() => ({}));
    if (!r.ok){ const err = new Error(data.message || 'Something went wrong.'); err.status = r.status; err.data = data; throw err; }
    return data;
  }
  let flushing = false;
  async function flush(){
    if (flushing || !navigator.onLine) return; const q = readQ(); if (!q.length) return;
    flushing = true; const rest = [];
    for (const x of q){ try { await call(x.method, x.path, x.body); } catch(e){ if (!e.status) rest.push(x); } }
    writeQ(rest); flushing = false;
  }
  window.addEventListener('online', flush); setInterval(flush, 20000);
  async function raw(path){
    const go = () => fetch('/api/v1' + path, {credentials:'same-origin', headers: token ? {Authorization:'Bearer ' + token} : {}});
    let r = await go(); if (r.status === 401 && await refresh()) r = await go();
    if (!r.ok){ const d = await r.json().catch(() => ({})); throw new Error(d.message || 'Could not open the document.'); }
    return r;
  }
  return { call, raw, refresh, flush, pending: () => readQ().length, setToken: t => { token = t; }, setAudience: a => { audience = a; }, onAuthLost: fn => { onAuthLost = fn; } };
})();

async function uploadDataUrl(dataUrl){
  // decode in memory (fetch() of a data: URL is blocked by the page's security policy)
  const [head, b64] = String(dataUrl).split(',');
  const mime = (/data:([^;]+)/.exec(head) || [])[1] || 'image/jpeg';
  const bin = atob(b64 || ''), bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  const blob = new Blob([bytes], {type:mime});
  const type = blob.type || 'image/jpeg';
  const slot = await API.call('POST', '/uploads', {contentType:type, size:blob.size});
  const r = await fetch(slot.uploadUrl, {method:'PUT', body:blob, headers:{'Content-Type':type}});
  if (!r.ok) throw new Error('Upload failed');
  return slot; // {ref, viewUrl}
}

      if (!same(before.dispatch, after.dispatch) && after.dispatch) patch.dispatch = {vehicle:after.dispatch.vehicle || '', boxes:after.dispatch.boxes === '' || after.dispatch.boxes == null ? null : Number(after.dispatch.boxes), date:after.dispatch.date || null};

/* ---------- Scorecards: the audit ---------- */
function Team({erp}){
  const [days, setDays] = useState(30);
  const from = Date.now() - days * DAY;
  const rows = TEAM.map(u => {
    const ts = erp.tasks.filter(t => t.assignee === u.id), open = ts.filter(tOpen);
    const done = ts.filter(t => t.status === 'done' && t.doneAt >= from), missed = ts.filter(t => t.status === 'missed' && parseYmd(t.deadline).getTime() >= from);
    const late = done.filter(t => !onOriginal(t)).map(t => Math.max(0, daysFrom(doneDay(t), t.originalDeadline || t.deadline) * -1));
    const recent = ts.filter(t => t.created >= from);
    const ev = (name) => ts.reduce((n, t) => n + t.events.filter(e => e.e === name && e.t >= from).length, 0);
    const seenH = recent.filter(t => t.seenAt).map(t => (t.seenAt - t.created) / HR);
    const startH = recent.filter(t => t.startedAt).map(t => (t.startedAt - t.created) / HR);
    const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
    const inst = erp.items.filter(i => i.installer === u.id && i.installDone && (i.installedAt || 0) >= from);
    const w = inst.reduce((s,i) => s + workMs(i), 0) / HR, sd = inst.reduce((s,i) => s + typeById[i.type].std, 0);
    return {u, given:recent.length, open:open.length, overdue:open.filter(t => tLate(t) > 0).length, done:done.length, missed:missed.length,
      onTime:done.length ? Math.round(done.filter(onOriginal).length / done.length * 100) : null, avgLate:late.length ? avg(late) : null,
      changes:ev('deadline'), asked:ev('extension'), reopened:ev('reopened'), escal:ev('escalated'),
      seen:avg(seenH), start:avg(startH), blocked:ts.reduce((n, t) => n + (t.blockedDays || 0) + (t.status === 'blocked' && t.blockedAt ? (Date.now() - t.blockedAt) / DAY : 0), 0),
      reminders:done.length ? avg(done.map(t => t.reminders || 0)) : null, inst:inst.length, w, sd};
  }).filter(r => r.given || r.open || r.done || r.inst);
  const segs = erp.items.flatMap(i => i.log.filter(l => l.out && l.out >= from).map(l => ({stage:l.stage, days:(l.out - l.in)/DAY})));
  const cyc = PSTAGES.filter(s => s.id !== 'closed').map(s => { const x = segs.filter(z => z.stage === s.id); const tg = STAGE_TGT[s.id] ?? s.days; return {s, tg, n:x.length, avg:x.length ? x.reduce((a,b) => a + b.days, 0)/x.length : 0, over:x.filter(z => z.days > tg).length}; });
  const cmax = Math.max(...cyc.map(c => Math.max(c.avg, c.tg)), 1);
  const f1 = (v, s = '') => v == null ? '—' : (Math.round(v * 10) / 10) + s;
  const csv = () => {
    const head = ['Person','Role','Tasks given','Done','On time vs original %','Avg days late','Missed repeats','Deadline changes','More time asked','Reopened','Escalations','Hours to seen','Hours to start','Days blocked','Reminders per task','Open now','Overdue now'];
    const lines = [head, ...rows.map(r => [r.u.name, r.u.roleName, r.given, r.done, r.onTime ?? '', f1(r.avgLate), r.missed, r.changes, r.asked, r.reopened, r.escal, f1(r.seen), f1(r.start), f1(r.blocked), f1(r.reminders), r.open, r.overdue])];
    const b = new Blob([lines.map(l => l.map(x => `"${String(x).replace(/"/g, '""')}"`).join(',')).join('\n')], {type:'text/csv'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = `mms-scorecards-${days}d-${todayYmd()}.csv`; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  };
  const red = (v, bad) => ({color: v != null && bad(v) ? 'var(--crit)' : null, fontWeight: v != null && bad(v) ? 600 : 400});
  return html`<section className="view"><div className="stack">
    <div className="toolbar" style=${{margin:0}}><div className="seg">${[[7,'Last 7 days'],[30,'Last 30 days'],[90,'Last 90 days']].map(([d, n]) => html`<button key=${d} aria-pressed=${days === d} onClick=${() => setDays(d)}>${n}</button>`)}</div><button className="btn small" onClick=${csv}>Export to Excel (CSV)</button>
      <span className="meta" style=${{color:'var(--muted)',fontSize:12.5}}>On time is measured against the <b>original</b> deadline, so moved deadlines do not hide delays.</span></div>
    <div className="table-wrap"><table>
      <thead><tr><th>Person</th><th className="r">Given</th><th className="r">Done</th><th className="r">On time</th><th className="r">Avg late</th><th className="r">Missed</th><th className="r">Deadline moved</th><th className="r">Reopened</th><th className="r">Escalated</th><th className="r">To seen</th><th className="r">To start</th><th className="r">Blocked</th><th className="r">Reminders / task</th><th className="r">Open · overdue</th></tr></thead>
      <tbody>${rows.map(r => html`<tr key=${r.u.id}><td><span className="inline" style=${{gap:8}}><${Av} id=${r.u.id}/><span><b>${r.u.name}</b><div className="sub">${r.u.roleName}</div></span></span></td>
        <td className="r num">${r.given}</td><td className="r num">${r.done}</td><td className="r num" style=${red(r.onTime, v => v < 80)}>${r.onTime == null ? '—' : r.onTime + '%'}</td><td className="r num">${r.avgLate ? f1(r.avgLate, ' d') : '—'}</td>
        <td className="r num" style=${red(r.missed, v => v > 0)}>${r.missed || '—'}</td><td className="r num" style=${red(r.changes, v => v >= 3)}>${r.changes || '—'}${r.asked ? html`<div className="sub">${r.asked} asked</div>` : null}</td><td className="r num" style=${red(r.reopened, v => v > 0)}>${r.reopened || '—'}</td><td className="r num" style=${red(r.escal, v => v > 0)}>${r.escal || '—'}</td>
        <td className="r num">${f1(r.seen, ' h')}</td><td className="r num">${f1(r.start, ' h')}</td><td className="r num">${r.blocked > 0.05 ? f1(r.blocked, ' d') : '—'}</td><td className="r num">${f1(r.reminders)}</td>
        <td className="r num">${r.open}${r.overdue ? html` · <span style=${{color:'var(--crit)',fontWeight:600}}>${r.overdue}</span>` : ''}</td></tr>`)}</tbody></table>
      ${!rows.length && html`<p style=${{padding:16,color:'var(--muted)',margin:0}}>No tasks in this period.</p>`}</div>
    ${rows.some(r => r.inst) && html`<div className="table-wrap"><table><thead><tr><th>Installation team</th><th className="r">Items installed</th><th className="r">Work vs standard</th><th className="r">Snag rate</th></tr></thead><tbody>
      ${rows.filter(r => r.inst).map(r => { const inst = erp.items.filter(i => i.installer === r.u.id && i.installDone && (i.installedAt || 0) >= from); const sn = Math.round(inst.filter(i => i.snags.length).length / inst.length * 100);
        return html`<tr key=${r.u.id}><td>${r.u.name}</td><td className="r num">${r.inst}</td><td className="r num">${r.w.toFixed(1)} / ${r.sd} h<div className="sub" style=${{color:r.w > r.sd*1.15 ? 'var(--crit)' : 'var(--good)'}}>${r.w ? Math.round(r.sd / r.w * 100) : 100}% efficiency</div></td><td className="r num">${sn}%</td></tr>`; })}</tbody></table></div>`}
    <div className="panel"><h3>Days per stage</h3><p className="hint">Items that left each stage in this period. The thin mark is the stage target (Users and access → Stages and templates). Red bars are over target.</p>
      <div className="bars">${cyc.map(c => html`<div className="bar-row" key=${c.s.id}><span>${c.s.name}</span><div className="bar-track" style=${{position:'relative'}}><i style=${{width:(c.avg/cmax*100)+'%', background:c.avg > c.tg ? 'var(--crit)' : c.s.color}}></i><span style=${{position:'absolute',left:(c.tg/cmax*100)+'%',top:-2,bottom:-2,width:2,background:'var(--ink)'}} title=${'Target ' + c.tg + ' days'}></span></div><span className="n"><b>${c.n ? c.avg.toFixed(1) + ' d' : '—'}</b> · target ${c.tg}${c.over ? ` · ${c.over} over` : ''}</span></div>`)}</div>
    </div>
  </div></section>`;
}

/* ---------- settings: stage targets and task templates ---------- */

  const admin = can(erp, 'admin'), assign = can(erp, 'assign') || admin;
  const [tg, setTg] = useState(() => ({...STAGE_TGT}));
  const [tp, setTp] = useState(() => TASK_TPL.map(x => ({...x})));
  const stages = PSTAGES.filter(s => s.id !== 'closed');
  const upd = (i, k, v) => setTp(l => l.map((x, j) => j === i ? {...x, [k]:v} : x));
  return html`<div className="stack">
    <div className="box"><h4>Stage targets (days)</h4><p className="hint">An item is shown as stuck when it stays in a stage longer than this. Automatic stage tasks get this deadline. Time waiting on the client is not counted.</p>
      <div className="form" style=${{padding:0,gridTemplateColumns:'repeat(auto-fill,minmax(170px,1fr))'}}>${stages.map(s => html`<label key=${s.id}>${s.name}<input type="number" min="0" max="90" value=${tg[s.id] ?? s.days} disabled=${!admin} onInput=${e => setTg({...tg, [s.id]:e.target.value})}/></label>`)}</div>
      ${admin && html`<div className="inline" style=${{marginTop:10}}><button className="btn primary small" onClick=${() => ops.saveStageTargets(Object.fromEntries(stages.map(s => [s.id, Number(tg[s.id] ?? s.days)])))}>Save stage targets</button></div>`}</div>
    <div className="box"><h4>Task templates</h4><p className="hint">Shown in New task. Picking one fills the title, deadline, proof and check.</p>
      <div className="table-wrap"><table><thead><tr><th>Title</th><th>Days</th><th>Proof</th><th>Check</th><th>Priority</th><th></th></tr></thead><tbody>
        ${tp.map((x, i) => html`<tr key=${i}><td><input className="inp" style=${{width:'100%'}} value=${x.title} disabled=${!assign} onInput=${e => upd(i, 'title', e.target.value)}/></td><td><input className="inp" type="number" min="0" max="60" style=${{width:64}} value=${x.days} disabled=${!assign} onInput=${e => upd(i, 'days', Number(e.target.value))}/></td>
          <td><select className="sel" value=${x.proof} disabled=${!assign} onChange=${e => upd(i, 'proof', e.target.value)}><option value="">None</option><option value="photo">Photo</option><option value="file">File</option><option value="comment">Comment</option></select></td>
          <td><input type="checkbox" checked=${!!x.verify} disabled=${!assign} onChange=${() => upd(i, 'verify', !x.verify)}/></td>
          <td><select className="sel" value=${x.priority} disabled=${!assign} onChange=${e => upd(i, 'priority', e.target.value)}><option value="normal">Normal</option><option value="urgent">Urgent</option></select></td>
          <td>${assign && html`<button className="btn small ghost" onClick=${() => setTp(l => l.filter((_, j) => j !== i))}>Remove</button>`}</td></tr>`)}</tbody></table></div>
      ${assign && html`<div className="inline" style=${{marginTop:10}}><button className="btn small" onClick=${() => setTp(l => [...l, {title:'', days:1, proof:'', verify:false, priority:'normal'}])}>Add template</button><button className="btn primary small" disabled=${tp.some(x => x.title.trim().length < 2)} onClick=${() => ops.saveTaskTemplates(tp.map(x => ({...x, title:x.title.trim(), days:Number(x.days) || 0})))}>Save templates</button></div>`}</div>
    <div className="box"><h4>How reminders and escalation work</h4><div style=${{fontSize:13,lineHeight:1.6}}>
      Person doing the task: WhatsApp the day before, on the day, then every morning while late.<br/>
      2 days late: the person who gave the task. For automatic tasks and tasks people give themselves, the project's PM.<br/>
      4 days late: the ops head. 7 days late: the owner.<br/>
      Blocked: the person it is waiting on is reminded every morning; after the follow-up date it counts as late again.<br/>
      Deadlines: only the person who gave the task, the project's PM or a manager can change them. The person doing it asks with "Need more time". The original deadline is kept for the scorecard.<br/>
      No messages on Sundays and holidays.</div></div>
  </div>`;
}

function SketchSVG({r, size = 220, active}){
  const walls = r.walls, n = walls.length;
  if (r.shape === 'L' && n === 6){
    const pts = [[20,20],[200,20],[200,110],[120,110],[120,200],[20,200]];
    return html`<svg viewBox="0 0 220 220" width=${size} height=${size} aria-label="Room sketch"><polygon points=${pts.map(p => p.join(',')).join(' ')} fill="var(--surface-2)" stroke="var(--ink-2)" strokeWidth="2"/>
      ${pts.map((a,i) => { const b = pts[(i+1)%6], mx = (a[0]+b[0])/2, my = (a[1]+b[1])/2; return html`<g key=${i}><circle cx=${mx} cy=${my} r="11" fill=${active === walls[i].label ? 'var(--accent)' : 'var(--ink)'}/><text x=${mx} y=${my+4} textAnchor="middle" fontSize="11" fontWeight="600" fill="var(--bg)">${walls[i].label}</text></g>`; })}
      <rect x="40" y="194" width="40" height="12" fill="var(--bg)"/><text x="60" y="216" textAnchor="middle" fontSize="9" fill="var(--muted)">door</text></svg>`;
  }
  const cx = 110, cy = 110, R = 82;
  const pts = walls.map((_,i) => { const a = Math.PI/2 + (i * 2*Math.PI/n) + Math.PI/n; return [cx + R*Math.cos(a) * (n === 4 ? 1.12 : 1), cy + R*Math.sin(a) * (n === 4 ? 1.12 : 1)]; });
  return html`<svg viewBox="0 0 220 220" width=${size} height=${size} aria-label="Room sketch"><polygon points=${pts.map(p => p.map(v => v.toFixed(1)).join(',')).join(' ')} fill="var(--surface-2)" stroke="var(--ink-2)" strokeWidth="2"/>
    ${pts.map((a,i) => { const b = pts[(i+1)%n], mx = (a[0]+b[0])/2, my = (a[1]+b[1])/2; return html`<g key=${i}><circle cx=${mx} cy=${my} r="11" fill=${active === walls[i].label ? 'var(--accent)' : 'var(--ink)'}/><text x=${mx} y=${my+4} textAnchor="middle" fontSize="11" fontWeight="600" fill="var(--bg)">${walls[i].label}</text></g>`; })}
    <text x="110" y="214" textAnchor="middle" fontSize="9" fill="var(--muted)">Wall A has the door · clockwise</text></svg>`;
}

function Elevation({it, wall}){
  const W = wall ? wall.w : 2400, H = wall ? wall.h : 2900, sc = 300 / Math.max(W, H);
  const uw = Math.min(W - 200, it.type === 'VN' ? 900 : it.type === 'TV' ? 2400 : W - 300), uh = it.type === 'VN' ? 600 : it.type === 'TV' ? 500 : it.type === 'KT' ? 850 : Math.min(H - 300, 2400);
  const ux = (W - uw) / 2, uy = it.type === 'VN' ? 850 : it.type === 'TV' ? 450 : it.type === 'KT' ? 0 : 0;
  const doors = Math.max(1, Math.round(uw / 600));
  return html`<svg className="elev" viewBox=${`0 0 ${W*sc + 60} ${H*sc + 50}`} role="img" aria-label=${'Elevation of ' + it.code}>
    <rect x="30" y="10" width=${W*sc} height=${H*sc} fill="none" stroke="var(--line-2)" strokeDasharray="4 3"/>
    <rect x=${30 + ux*sc} y=${10 + (H - uy - uh)*sc} width=${uw*sc} height=${uh*sc} fill="var(--warm)" stroke="var(--ink)" strokeWidth="1.5"/>
    ${Array.from({length:doors - 1}, (_, k) => html`<line key=${k} x1=${30 + (ux + uw/doors*(k+1))*sc} x2=${30 + (ux + uw/doors*(k+1))*sc} y1=${10 + (H - uy - uh)*sc} y2=${10 + (H - uy)*sc} stroke="var(--ink)"/>`)}
    <text x=${30 + W*sc/2} y=${H*sc + 30} textAnchor="middle" fontSize="11" fill="var(--muted)">Wall ${it.wall}: ${W} mm · unit ${uw} × ${uh} mm (R${it.drawings.length ? it.drawings.length - 1 : 0})</text>
    <text x="14" y=${10 + H*sc/2} fontSize="11" fill="var(--muted)" transform=${`rotate(-90 14 ${10 + H*sc/2})`} textAnchor="middle">${H} mm</text></svg>`;
}

function compressPhoto(file, cb){
  const r = new FileReader();
  r.onload = () => { const img = new Image(); img.onload = () => { const s = Math.min(1, 640 / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width*s); c.height = Math.round(img.height*s); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); cb(c.toDataURL('image/jpeg', 0.6)); }; img.src = r.result; };
  r.readAsDataURL(file);
}

/* units: everything is stored in mm; the surveyor can type and read in mm, cm or feet-inches */
const UNITS = [['mm','mm'],['cm','cm'],['ftin','ft-in']];
const getUnit = () => { try { return localStorage.getItem('mms-unit') || 'mm'; } catch(e){ return 'mm'; } };
const toFtIn = mm => { const ti = Number(mm) / 25.4; let ft = Math.floor(ti / 12), inch = Math.round((ti - ft * 12) * 2) / 2; if (inch >= 12){ ft++; inch -= 12; } return [ft, inch]; };
const fmtLen = (mm, u) => { const n = Number(mm); if (!(n > 0)) return '—'; if (u === 'cm') return +(n / 10).toFixed(1) + ' cm'; if (u === 'ftin'){ const [ft, inch] = toFtIn(n); return `${ft}′ ${inch}″`; } return n + ' mm'; };
const lenToInput = (mm, u) => { const n = Number(mm); if (!(n > 0)) return ''; if (u === 'cm') return String(+(n / 10).toFixed(1)); if (u === 'ftin'){ const [ft, inch] = toFtIn(n); return `${ft}'${inch || ''}`; } return String(n); };
const inputToMm = (s, u) => {
  s = String(s || '').trim(); if (!s) return 0;
  if (u === 'ftin'){ const [ft, inch] = s.includes("'") ? s.split("'") : [s, '0']; return Math.round(((Number(ft) || 0) * 12 + (Number(inch) || 0)) * 25.4); }
  const n = Number(s); if (!(n > 0)) return 0;
  return Math.round(u === 'cm' ? n * 10 : n);
};
const showInput = (s, u) => !s ? '0' : u === 'ftin' ? (s.includes("'") ? `${s.split("'")[0]}′ ${s.split("'")[1] || ''}${s.split("'")[1] ? '″' : ''}` : s + '′') : s;
/* "eleven feet nine inches", "3600", "360 cm" → value in the surveyor's unit */
function speechToInput(t, u){
  const w = {zero:0, one:1, two:2, three:3, four:4, five:5, six:6, seven:7, eight:8, nine:9, ten:10, eleven:11, twelve:12};
  t = String(t).toLowerCase().replace(/\b(zero|one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve)\b/g, m => w[m]).replace(/,/g, '').replace(/\bpoint\b/g, '.').replace(/(\d)\s+\.\s*(\d)/g, '$1.$2');
  const nums = (t.match(/\d+(\.\d+)?/g) || []).map(Number);
  if (!nums.length) return null;
  if (/feet|foot|ft/.test(t)){ const mm = Math.round((nums[0] * 12 + (nums[1] || 0)) * 25.4); return lenToInput(mm, u); }
  let mm = /cm|centi/.test(t) ? nums[0] * 10 : /mm|milli/.test(t) ? nums[0] : u === 'cm' ? nums[0] * 10 : u === 'ftin' ? nums[0] * 304.8 : nums[0];
  return lenToInput(Math.round(mm), u);
}

const shotSrc = ph => ph && (String(ph.ref).startsWith('upload:') ? ph.url : ph.ref);
const isLocal = x => typeof x === 'string' && x.startsWith('data:');
function wallChecks(r, wi){
  const w = r.walls[wi], out = [], W = Number(w.w), H = Number(w.h);
  if (W && (W > 9000 || W < 300)) out.push(`Width ${W} mm looks unusual. Check it.`);
  if (H && (H > 6000 || H < 1500)) out.push(`Height ${H} mm looks unusual. Check it.`);
  if (r.walls.length === 4 && W){ const o = r.walls[(wi + 2) % 4], d = Math.abs(W - Number(o.w)); if (Number(o.w) && d > 20) out.push(`Opposite wall ${o.label} is ${o.w} mm, ${d} mm different. Recheck, or add a note that the room is out of square.`); }
  w.obs.forEach(o => { if (W && o.left + o.w > W + 5) out.push(`${o.type} runs past the end of the wall (${o.left} + ${o.w} > ${W} mm).`); if (H && o.floor + o.h > H + 5) out.push(`${o.type} is taller than the wall.`); });
  return out;
}
function useOnline(){
  const [on, setOn] = useState(navigator.onLine);
  useEffect(() => { const a = () => setOn(true), b = () => setOn(false); window.addEventListener('online', a); window.addEventListener('offline', b); return () => { window.removeEventListener('online', a); window.removeEventListener('offline', b); }; }, []);
  return on;
}

/* big on-screen number pad (no phone keyboard), with units and optional voice */
function Keypad({label, mm, unit, setUnit, range, onDone, onClose}){
  const [v, setV] = useState(() => lenToInput(mm, unit));
  const [u, setU] = useState(unit);
  const [listening, setListening] = useState(false), [heard, setHeard] = useState('');
  const val = inputToMm(v, u);
  const switchU = nu => { setV(lenToInput(val, nu)); setU(nu); setUnit(nu); };
  const press = k => setV(s => {
    if (k === 'del') return s.slice(0, -1);
    if (k === "'") return s.includes("'") || !s ? s : s + "'";
    if (k === '.'){ const seg = s.split("'").pop(); return seg.includes('.') ? s : s + (seg ? '.' : '0.'); }
    if (s.length >= 7) return s;
    return s === '0' ? k : s + k;
  });
  const listen = () => {
    try {
      const rec = new SpeechRec(); rec.lang = 'en-IN'; rec.interimResults = false; rec.maxAlternatives = 1;
      rec.onresult = e => { const t = e.results[0][0].transcript, x = speechToInput(t, u); setHeard(x ? '' : `Heard "${t}". Say a number, for example "3600" or "11 feet 9 inches".`); if (x) setV(x); };
      rec.onend = () => setListening(false); rec.onerror = () => setListening(false);
      setListening(true); rec.start();
    } catch(e){ setListening(false); }
  };
  const odd = range && val && (val < range[0] || val > range[1]);
  const sep = u === 'mm' ? '00' : u === 'cm' ? '.' : "'";
  return html`<div className="sheet-m kp-sheet" onClick=${e => e.target === e.currentTarget && onClose()}><div className="in">
    <div className="card-row"><b style=${{fontSize:15}}>${label}</b><div className="seg">${UNITS.map(([id, n]) => html`<button key=${id} aria-pressed=${u === id} onClick=${() => switchU(id)}>${n}</button>`)}</div></div>
    <div className="kp-disp"><span>${showInput(v, u)}</span><small>${u === 'ftin' ? 'feet ′ inches' : u}${u !== 'mm' && val ? ' = ' + val + ' mm' : ''}</small></div>
    ${odd && html`<div className="banner warn" style=${{padding:'7px 10px'}}>Check this: ${val} mm is unusual here.</div>`}
    ${heard && html`<div className="banner warn" style=${{padding:'7px 10px'}}>${heard}</div>`}
    <div className="kp">${['1','2','3','4','5','6','7','8','9', sep, '0', 'del'].map(k => html`<button key=${k} onClick=${() => k === '00' ? (press('0'), press('0')) : press(k)} aria-label=${k === 'del' ? 'Delete' : k}>${k === 'del' ? '⌫' : k === "'" ? 'ft ′' : k}</button>`)}</div>
    ${u === 'ftin' && html`<span className="meta" style=${{fontSize:12,color:'var(--muted)'}}>Type feet, tap ft ′, then inches. Example: 11 ft ′ 9 = 11′ 9″.</span>`}
    <div className="inline">${SpeechRec && html`<button className="big" style=${{flex:'0 0 64px'}} aria-label="Say the number" aria-pressed=${listening} onClick=${listen}><${Icon} n="mic" s=${20}/></button>`}<button className="big" onClick=${onClose}>Cancel</button><button className="big pri" onClick=${() => onDone(val)}>${val ? 'Use ' + fmtLen(val, u) : 'Clear'}</button></div>
  </div></div>`;
}

/* wall photo; tapping it drops a pin for an obstruction */
function PinPhoto({src, obs, onTap, onPin, disabled}){
  const tap = e => {
    if (disabled) return;
    const b = e.currentTarget.getBoundingClientRect();
    onTap(Math.round((e.clientX - b.left) / b.width * 1000) / 10, Math.round((e.clientY - b.top) / b.height * 1000) / 10);
  };
  return html`<div className="pinwrap" onClick=${tap} role="button" aria-label="Tap the photo where an obstruction is">
    ${src === 'sample' ? html`<div className="pin-sample">Sample photo (demo)</div>` : html`<img src=${src} alt="Wall photo" draggable="false"/>`}
    ${obs.map((o, i) => o.px != null && html`<button key=${i} className="pin" style=${{left:o.px + '%', top:o.py + '%'}} onClick=${e => { e.stopPropagation(); onPin(i); }} aria-label=${o.type + ' ' + (i + 1)}>${i + 1}</button>`)}
  </div>`;
}
const CamButton = ({label, onPick, multiple, cls = 'btn small', capture = true}) => html`<label className=${cls} style=${{position:'relative',overflow:'hidden'}}>${label}<input type="file" accept="image/*" capture=${capture && !multiple ? 'environment' : undefined} multiple=${!!multiple} style=${{position:'absolute',inset:0,opacity:0}} onChange=${e => { const fs = [...e.target.files]; e.target.value = ''; fs.forEach((f, i) => compressPhoto(f, d => onPick(d, i))); }}/></label>`;

function SignPad({onSigned}){
  const ref = useRef(null), drawing = useRef(false);
  useEffect(() => { const c = ref.current; c.width = c.offsetWidth * 2; c.height = c.offsetHeight * 2; const x = c.getContext('2d'); x.scale(2,2); x.lineWidth = 2; x.lineCap = 'round'; x.strokeStyle = getComputedStyle(document.body).color; }, []);
  const pos = e => { const b = ref.current.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; };
  return html`<canvas className="sig" ref=${ref} aria-label="Signature pad"
    onPointerDown=${e => { drawing.current = true; const x = ref.current.getContext('2d'); x.beginPath(); x.moveTo(...pos(e)); }}
    onPointerMove=${e => { if (!drawing.current) return; const x = ref.current.getContext('2d'); x.lineTo(...pos(e)); x.stroke(); }}
    onPointerUp=${() => { drawing.current = false; onSigned(); }}></canvas>`;
}

        ${SERVER.demoMode && !sheet.photo && html`<button className="linkbtn" style=${{color:'var(--muted)'}} onClick=${() => setSheet({...sheet, photo:'sample'})}>Demo: use a sample photo</button>`}
        <div className="inline"><button className="big" onClick=${close}>Cancel</button><button className="big pri" disabled=${!allChecked || !sheet.photo || sheet.busy} onClick=${async () => { setSheet({...sheet, busy:true}); const r = await ops.requestSignoff(it.id, sheet.checks, sheet.photo); setSheet(r ? {...sheet, busy:false, step:2, otp:r.devCode || null} : {...sheet, busy:false}); }}>${sheet.busy ? 'Sending…' : 'Send OTP to customer'}</button></div>`)
      : wrap(html`<h3>Customer sign-off</h3><div className="banner">OTP sent to ${erp.projects.find(p => p.id === it.projectId).customer} on WhatsApp. Ask them for the 4 digits.</div>
        ${sheet.otp && html`<div className="banner warn">Demo only: the OTP is ${sheet.otp}</div>`}
        <div className="otp"><input inputMode="numeric" maxLength="4" style=${{width:160,letterSpacing:'.4em'}} value=${sheet.code} onInput=${e => setSheet({...sheet, code:e.target.value.replace(/\D/g,'').slice(0,4)})} aria-label="OTP" autoFocus/></div>
        
        <div className="inline"><button className="big" onClick=${() => setSheet({...sheet, step:1})}>Back</button><button className="big go" disabled=${sheet.code.length < 4 || sheet.busy} onClick=${async () => { setSheet({...sheet, busy:true}); const r = await ops.verifySignoff(it.id, sheet.code); if (r) close(); else setSheet({...sheet, busy:false}); }}>Confirm and complete</button></div>`);
    }
  }
  return html`<section className="view"><div className="phone-wrap">${screen && React.cloneElement(screen, {overlay})}<${SideNote} title="Installer app flow" steps=${steps}/></div></section>`;
}
