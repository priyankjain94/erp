      </div>
    </aside>
  </div>`;
}

/* ---------- Chat ---------- */
function Chat({lead, send}){
  const [text, setText] = useState('');
  const [tpl, setTpl] = useState(TEMPLATES[0].id);
  const end = useRef(null);
  const isOpen = windowOpen(lead);
  useEffect(() => { end.current?.scrollIntoView({block:'end'}); }, [lead.msgs.length, lead.id]);
  const fill = b => b.replace('{{name}}', first(lead.name)).replace('{{interest}}', lead.interest.toLowerCase());
  const submit = () => { const t = text.trim(); if (!t) return; send(lead.id, t); setText(''); };
  let lastDay = '';
  return html`<div className="chat">
    ${isOpen ? html`<div className="window open"><span className="dot"></span>24-hour window open · ${hoursLeft(lead)}h left for free-form replies</div>`
      : html`<div className="window closed"><${Icon} n="lock" s=${14}/>Window closed. Send an approved template to restart the chat.</div>`}
    <div className="msgs">
      ${lead.msgs.length === 0 && html`<div className="day">No messages yet</div>`}
      ${lead.msgs.map((m,i) => { const d = dayLabel(m.t); const sep = d !== lastDay; lastDay = d;
        return html`<${React.Fragment} key=${i}>${sep && html`<div className="day">${d}</div>`}
          <div className=${'msg ' + m.from}>${m.tpl && html`<span className="tpl">${m.from === 'auto' ? 'Automation · ' : 'Template · '}${m.tpl}</span>`}<span>${m.text}</span><span className="meta">${clock(m.t)}${m.from !== 'them' ? html`<span style=${{color:'var(--wa)'}}>✓✓</span>` : null}</span></div>
        <//>`; })}
      <div ref=${end}></div>
    </div>
    <div className="composer">
      ${isOpen ? html`
        <div className="quick">${QUICK.map(q => html`<button key=${q} onClick=${() => setText(q)}>${q}</button>`)}</div>
        <div className="compose-row">
          <textarea id=${'compose-' + lead.id} rows="1" placeholder=${'Reply to ' + first(lead.name)} value=${text} onInput=${e => setText(e.target.value)} onKeyDown=${e => { if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); submit(); } }} aria-label="Message"></textarea>
          <button className="btn wa" onClick=${submit} disabled=${!text.trim()}><${Icon} n="send" s=${16}/>Send</button>
        </div>` : html`
        <div className="tpl-list" role="group" aria-label="Approved templates">${TEMPLATES.map(t => html`<button key=${t.id} className="tpl-opt" aria-pressed=${tpl === t.id} onClick=${() => setTpl(t.id)}><b>${t.id}</b><em>${t.cat}</em><span>${fill(t.body)}</span></button>`)}</div>
        <div style=${{display:'flex',justifyContent:'flex-end'}}><button className="btn wa" onClick=${() => { const t = TEMPLATES.find(x => x.id === tpl); send(lead.id, fill(t.body), t.id); }}><${Icon} n="send" s=${16}/>Send template</button></div>`}
    </div>
  </div>`;
}

/* ---------- Dashboard ---------- */
function Dashboard({leads, open, go}){
  const openLeads = leads.filter(l => OPEN.includes(l.stage));
  const weekNew = leads.filter(l => Date.now() - l.created < 7*DAY).length;
  const due = openLeads.filter(l => l.fu && daysFrom(l.fu) <= 0).sort((a,b) => a.fu < b.fu ? -1 : 1);
  const overdue = due.filter(l => daysFrom(l.fu) < 0).length;
  const pipe = openLeads.reduce((s,l) => s + l.value, 0);
  const won = leads.filter(l => l.stage === 'won');
  const wonVal = won.reduce((s,l) => s + l.value, 0);
  const waiting = leads.filter(l => awaitingReply(l) && windowOpen(l) && !['won','lost'].includes(l.stage));
  const bySrc = SOURCES.map(s => { const all = leads.filter(l => l.source === s.id); return {s, n:all.length, won:all.filter(l => l.stage === 'won').length, val:all.filter(l => l.stage === 'won').reduce((a,l) => a + l.value, 0)}; });
  const max = Math.max(...bySrc.map(x => x.n), 1);
  const reached = OPEN.map((id,i) => ({id, name:stageById[id].name, n:leads.filter(l => { const j = OPEN.indexOf(l.stage); return (j >= i) || l.stage === 'won'; }).length}));
  const fmax = Math.max(...reached.map(r => r.n), 1);
  const hr = new Date().getHours();
  return html`<section className="view">
    <p style=${{margin:'0 0 14px',color:'var(--muted)'}}>${hr < 12 ? 'Good morning' : hr < 17 ? 'Good afternoon' : 'Good evening'}. ${due.length} follow-ups need attention today and ${waiting.length} clients are waiting for a reply.</p>
    <div className="kpis">
      <div className="kpi"><span className="l">New this week</span><span className="v">${weekNew}</span><span className="s">${leads.filter(l => Date.now() - l.created < DAY).length} today</span></div>
      <div className=${'kpi' + (overdue ? ' alert' : '')}><span className="l">Follow-ups due</span><span className="v">${due.length}</span><span className="s">${overdue} overdue</span></div>
      <div className="kpi"><span className="l">Open pipeline</span><span className="v">${lakh(pipe)}</span><span className="s">${openLeads.length} active leads</span></div>
      <div className="kpi"><span className="l">Won</span><span className="v">${lakh(wonVal)}</span><span className="s">${won.length} deals closed</span></div>
    </div>
    <div className="grid2">
      <div className="stack">
        <div className="panel"><h3>Leads by source</h3><p className="hint">Total leads, with the won share filled solid. Partner sources close the largest deals.</p>
          <div className="bars">${bySrc.map(x => html`<div className="bar-row" key=${x.s.id}>
            <span style=${{display:'flex',alignItems:'center',gap:8,minWidth:0}}><i style=${{width:8,height:8,borderRadius:2,background:`var(--s-${x.s.id})`,flex:'none'}}></i><span style=${{overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>${x.s.short}</span></span>
            <div className="bar-track" title=${`${x.n} leads, ${x.won} won`}><i style=${{width:(x.won/max*100)+'%',background:`var(--s-${x.s.id})`}}></i><i style=${{width:((x.n-x.won)/max*100)+'%',background:`var(--s-${x.s.id})`,opacity:.35}}></i></div>
            <span className="n"><b>${x.n}</b> · ${x.val ? lakh(x.val) : '—'}</span></div>`)}</div>
          <div className="legend"><span><i style=${{background:'var(--ink-2)'}}></i>Won</span><span><i style=${{background:'var(--ink-2)',opacity:.35}}></i>Open, nurture or lost</span><span>Right: leads · won value</span></div>
        </div>
        <div className="panel"><h3>Pipeline funnel</h3><p className="hint">Leads that have reached each stage, including those now won.</p>
          <div className="funnel">${reached.map(r => html`<div className="f-row" key=${r.id}><span>${r.name}</span><div><div className="f-bar" style=${{width:(r.n/fmax*100)+'%'}}></div></div><span className="n">${r.n}</span></div>`)}</div>
        </div>
      </div>
      <div className="stack">
        <div className="panel"><h3>Waiting for a reply</h3><p className="hint">Inside the free 24-hour window. Answer these first.</p>
          <div className="task-list">${waiting.length ? waiting.map(l => html`<button className="task" key=${l.id} onClick=${() => open(l.id, 'chat')}><span className="avatar" style=${{marginLeft:0}}>${initials(l.name)}</span><span className="who"><b>${l.name}</b><span>${l.msgs[l.msgs.length-1].text}</span></span><span className="wa-pill" style=${{marginLeft:'auto'}}>${ago(l.lastIn)}</span></button>`) : html`<p className="hint">All caught up.</p>`}</div>
        </div>
        <div className="panel"><h3>Follow-ups due</h3><p className="hint">Overdue first, then today.</p>
          <div className="task-list">${due.map(l => html`<button className="task" key=${l.id} onClick=${() => open(l.id, 'details')}><span className="avatar" style=${{marginLeft:0}}>${initials(l.name)}</span><span className="who"><b>${l.name}</b><span>${stageById[l.stage].name} · ${l.owner}</span></span><${Due} fu=${l.fu}/></button>`)}</div>
          <button className="btn small ghost" style=${{marginTop:8}} onClick=${() => go('pipeline')}>Open the board</button>
        </div>
      </div>
    </div>
  </section>`;
}

/* ---------- Inbox ---------- */
function Inbox({leads, open, send}){
  const [filter, setFilter] = useState('all');
  const convs = leads.filter(l => l.msgs.length).sort((a,b) => b.msgs[b.msgs.length-1].t - a.msgs[a.msgs.length-1].t)
    .filter(l => filter === 'all' || (filter === 'waiting' ? awaitingReply(l) : windowOpen(l)));
  const [sel, setSel] = useState(() => convs[0]?.id);
  const lead = leads.find(l => l.id === sel) || convs[0];
  const narrow = () => window.matchMedia('(max-width:860px)').matches;
  return html`<section className="view inbox-view">
    <div className="inbox">
      <div className="convs">
        <div className="inbox-filter" role="group" aria-label="Filter">${[['all','All'],['waiting','Waiting'],['open','Window open']].map(([id,n]) => html`<button key=${id} className="chip" aria-pressed=${filter === id} onClick=${() => setFilter(id)}>${n}</button>`)}</div>
        ${convs.map(l => { const m = l.msgs[l.msgs.length-1]; return html`<button key=${l.id} className="conv" aria-current=${lead && lead.id === l.id ? 'true' : undefined} onClick=${() => narrow() ? open(l.id, 'chat') : setSel(l.id)}>
          <span className="av">${initials(l.name)}</span>
          <span className="mid"><b>${l.name}</b><span className="prev">${m.from === 'them' ? '' : 'You: '}${m.text}</span><${SourceTag} lead=${l} leads=${leads}/></span>
          <span className="right"><span>${ago(m.t)}</span>${awaitingReply(l) ? html`<span className="unread">1</span>` : null}</span>
        </button>`; })}
      </div>
      <div className="chat-pane">${lead ? html`
        <div className="chat-head"><span className="avatar" style=${{marginLeft:0}}>${initials(lead.name)}</span><div style=${{minWidth:0}}><b>${lead.name}</b><div style=${{fontSize:12,color:'var(--muted)'}}>${stageById[lead.stage].name} · ${lead.owner}</div></div><button className="btn small" style=${{marginLeft:'auto'}} onClick=${() => open(lead.id, 'details')}>Open lead</button></div>
        <div style=${{flex:1,minHeight:0}}><${Chat} key=${lead.id} lead=${lead} send=${send}/></div>` : null}
      </div>
    </div>
  </section>`;
}

/* ---------- Partners ---------- */
const PARTNER_TYPES = {architect:'Architect / Interior planner', contractor:'Civil engineer / Contractor', agent:'Real estate agent'};
function PartnerForm({init, erp, close, save}){
  const blank = {name:'', firm:'', type:'architect', phone:'', email:'', city:'', tier:'Silver', rate:'2', owner:'', notes:'', active:true};
  const [f, setF] = useState(init ? {...blank, ...init, rate:String(init.rate ?? ''), owner:init.ownerId || '', phone:init.phone || ''} : blank);
  const [tried, setTried] = useState(false), [busy, setBusy] = useState(false);
  const set = (k, v) => setF(x => ({...x, [k]:v}));
  const digits = f.phone.replace(/\D/g,'').slice(-10);
  const errs = {name:f.name.trim().length < 2, phone:!!f.phone.trim() && digits.length !== 10, rate:!(Number(f.rate) >= 0 && Number(f.rate) <= 30)};
  const owners = (erp?.users || []).filter(u => u.active !== false && ['sales','admin','ops_head'].includes(u.role));
  const submit = async e => { e.preventDefault(); setTried(true); if (Object.values(errs).some(Boolean)) return; setBusy(true);
    const ok = await save({name:f.name.trim(), firm:f.firm.trim(), type:f.type, phone:digits ? digits : '', email:f.email.trim(), city:f.city.trim(), tier:f.tier, rate:Number(f.rate) || 0, owner:f.owner || null, notes:f.notes, active:f.active});
    setBusy(false); if (ok) close(); };
  return html`<div className="modal" role="dialog" aria-modal="true" aria-label=${init ? 'Edit partner' : 'Add partner'}>
    <div className="scrim" onClick=${close}></div>
    <form className="sheet" onSubmit=${submit} noValidate>
      <header><h2>${init ? 'Edit partner' : 'Add partner'}</h2><p>Architects, contractors and agents who send you clients. Their leads, sales value and commission are tracked automatically.</p></header>
      <div className="form">
        <label>Name <span className="req">*</span><input value=${f.name} onInput=${e => set('name', e.target.value)} placeholder="e.g. Ar. Neha Sharma" autoFocus/>${tried && errs.name && html`<span className="err">Enter the partner's name.</span>`}</label>
        <label>Firm<input value=${f.firm} onInput=${e => set('firm', e.target.value)} placeholder="Studio / company name"/></label>
        <label className="full">Type <span className="req">*</span><select value=${f.type} disabled=${!!init && init.stats?.leads > 0} onChange=${e => set('type', e.target.value)}>${Object.entries(PARTNER_TYPES).map(([k, n]) => html`<option key=${k} value=${k}>${n}</option>`)}</select>${init && init.stats?.leads > 0 && html`<span className="hint">Type is fixed once the partner has leads.</span>`}</label>
        <label>WhatsApp number<input inputMode="tel" value=${f.phone} onInput=${e => set('phone', e.target.value)} placeholder="10-digit mobile"/>${tried && errs.phone && html`<span className="err">Enter a 10-digit number or leave it empty.</span>`}</label>
        <label>Email<input type="email" value=${f.email} onInput=${e => set('email', e.target.value)}/></label>
        <label>City<input value=${f.city} onInput=${e => set('city', e.target.value)}/></label>
        <label>Tier<select value=${f.tier} onChange=${e => set('tier', e.target.value)}>${['Silver','Gold','Platinum'].map(t => html`<option key=${t}>${t}</option>`)}</select></label>
        <label>Commission %<input inputMode="decimal" value=${f.rate} onInput=${e => set('rate', e.target.value.replace(/[^\d.]/g,''))}/>${tried && errs.rate && html`<span className="err">0 to 30.</span>`}</label>
        <label>Relationship owner<select value=${f.owner} onChange=${e => set('owner', e.target.value)}><option value="">Not set</option>${owners.map(u => html`<option key=${u.id} value=${u.id}>${u.name}</option>`)}</select></label>
        <label className="full">Notes<textarea rows="2" value=${f.notes} onInput=${e => set('notes', e.target.value)} placeholder="Agreement, preferred brands, payout terms…"></textarea></label>
        ${init && html`<label className="full" style=${{flexDirection:'row',alignItems:'center',gap:8}}><input type="checkbox" checked=${f.active} onChange=${e => set('active', e.target.checked)} style=${{width:'auto'}}/> Active (inactive partners are hidden from the lead form)</label>`}
        <div className="form-foot"><button type="button" className="btn ghost" onClick=${close}>Cancel</button><button type="submit" className="btn primary" disabled=${busy}>${init ? 'Save' : 'Add partner'}</button></div>
      </div>
    </form>
  </div>`;
}
function Partners({leads, open, call, erp}){

    const due = (st.commission || 0) - (st.commissionPaid || 0);
    const lastDays = st.lastLead ? Math.floor((Date.now() - st.lastLead) / DAY) : null;
    return {p, ls, st, due, lastDays};
  }).filter(r => type === 'all' || r.p.type === type).sort((a,b) => (b.st.wonValue || 0) - (a.st.wonValue || 0) || b.ls.length - a.ls.length);
  const tot = rows.reduce((a, r) => ({leads:a.leads + (r.st.leads || 0), pipe:a.pipe + (r.st.pipeline || 0), won:a.won + (r.st.wonValue || 0), proj:a.proj + (r.st.projectValue || 0), due:a.due + r.due}), {leads:0, pipe:0, won:0, proj:0, due:0});
  const save = async (body, id) => !!(await call(id ? 'PATCH' : 'POST', id ? `/partners/${id}` : '/partners', body, id ? 'Partner updated.' : `${body.name} added. Choose them under "Referred by" when adding a lead.`));
  return html`<section className="view">
    <div className="toolbar">
      <div className="chips" role="group" aria-label="Partner type">${[['all','All partners'],['architect','Architects'],['contractor','Contractors'],['agent','Agents']].map(([id,n]) => html`<button key=${id} className="chip" aria-pressed=${type === id} onClick=${() => setType(id)}>${n}</button>`)}</div>
      <label className="chip" style=${{cursor:'pointer'}}><input type="checkbox" checked=${showInactive} onChange=${e => setShowInactive(e.target.checked)} style=${{margin:0}}/> Show inactive</label>
      <span style=${{marginLeft:'auto'}}></span>
      <button className="btn small" onClick=${() => downloadCsv('partners')}>Export CSV</button>
      <button className="btn small primary" onClick=${() => setForm({})}><${Icon} n="plus" s=${14}/>Add partner</button>
    </div>
    <div className="kpis" style=${{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(150px,1fr))',gap:12,marginBottom:16}}>
      ${[['Partners', rows.length], ['Leads sent', tot.leads], ['Open pipeline', lakh(tot.pipe)], ['Won value', lakh(tot.won)], ['Project value', lakh(tot.proj)], ...(money ? [['Commission due', inr(tot.due)]] : [])].map(([k, v]) => html`<div key=${k} className="panel" style=${{padding:'12px 14px'}}><div className="sub" style=${{fontSize:11,letterSpacing:'.08em',textTransform:'uppercase',color:'var(--muted)'}}>${k}</div><b className="num" style=${{fontSize:20}}>${v}</b></div>`)}
    </div>
    <div className="table-wrap"><table>
      <thead><tr><th>Partner</th><th>Type</th><th>Tier</th><th className="r">Leads</th><th className="r">Open pipeline</th><th className="r">Won</th><th className="r">Won value</th><th className="r">Project value</th>${money && html`<th className="r">Commission due</th>`}<th>Last lead</th><th></th></tr></thead>
      <tbody>${rows.map(r => html`<${React.Fragment} key=${r.p.id}>
        <tr className="click" onClick=${() => setExp(exp === r.p.id ? null : r.p.id)} aria-expanded=${exp === r.p.id} style=${r.p.active === false ? {opacity:.55} : null}>
          <td className="p-name"><b>${r.p.name}</b><div className="sub">${[r.p.firm, r.p.city, r.p.owner ? 'managed by ' + r.p.owner : ''].filter(Boolean).join(' · ')}</div></td>
          <td><span className="src"><i className="sw" style=${{background:`var(--s-${r.p.type})`}}></i>${PARTNER_TYPES[r.p.type]}</span></td>

          <td className="r num"><b>${r.st.wonValue ? lakh(r.st.wonValue) : '—'}</b></td>
          <td className="r num">${r.st.projectValue ? lakh(r.st.projectValue) : '—'}</td>
          ${money && html`<td className="r num">${r.due ? inr(r.due) : '—'}<div className="sub">${r.p.rate}%${r.st.commissionPaid ? ' · ' + inr(r.st.commissionPaid) + ' paid' : ''}</div></td>`}
          <td>${r.lastDays == null ? html`<span className="dormant">No leads yet</span>` : r.lastDays > 60 ? html`<span className="dormant">${r.lastDays}d ago</span>` : html`<span className="num">${r.lastDays === 0 ? 'Today' : r.lastDays + 'd ago'}</span>`}</td>
          <td><button className="btn small ghost" onClick=${e => { e.stopPropagation(); setForm(r.p); }}>Edit</button></td>
        </tr>
        ${exp === r.p.id && html`<tr className="expand"><td colSpan=${money ? 11 : 10}>
          <div style=${{display:'flex',gap:18,flexWrap:'wrap',fontSize:13,marginBottom:8}}>${r.p.phone && html`<span>WhatsApp <b>${r.p.phone}</b></span>`}${r.p.email && html`<span>${r.p.email}</span>`}${r.p.notes && html`<span className="meta">${r.p.notes}</span>`}</div>
          ${r.ls.length ? html`<div className="mini-leads">${r.ls.map(l => html`<button key=${l.id} className="mini" onClick=${() => open(l.id, 'details')}><b>${l.name}</b><span style=${{color:'var(--muted)'}}>${stageById[l.stage].name}</span><span className="num">${lakh(l.value)}</span></button>`)}</div>` : html`<span style=${{color:'var(--muted)'}}>No leads from this partner yet.</span>`}
          ${money && r.p.commissions?.length > 0 && html`<table style=${{marginTop:10,minWidth:0}}><thead><tr><th>Commission on</th><th className="r">Amount</th><th>Status</th><th></th></tr></thead><tbody>${r.p.commissions.map(c => html`<tr key=${c.id}><td>${leads.find(l => l.id === c.leadId)?.name || c.leadId}</td><td className="r num">${inr(c.amount)}</td><td><span className=${'pill' + (c.status === 'paid' ? ' good' : ' warn')}>${c.status}</span></td><td><button className="btn small" onClick=${() => call('POST', `/commissions/${c.id}/paid`, {paid:c.status !== 'paid'}, c.status !== 'paid' ? 'Commission marked paid.' : 'Marked pending again.')}>${c.status === 'paid' ? 'Mark pending' : 'Mark paid'}</button></td></tr>`)}</tbody></table>`}
        </td></tr>`}
      <//>`)}</tbody>
    </table></div>
    ${form && html`<${PartnerForm} init=${form.id ? form : null} erp=${erp} close=${() => setForm(null)} save=${b => save(b, form.id)}/>`}
  </section>`;
}

/* ---------- Automations ---------- */
function Automations({autos, toggle}){
  const on = autos.filter(a => a.on).length;
  return html`<section className="view">
    <p style=${{margin:'0 0 14px',color:'var(--muted)'}}>${on} of ${autos.length} automations are on. Each one reads as When this happens, Then do this; every action is logged on the lead's timeline.</p>
    <div className="autos">${autos.map(a => html`<article key=${a.id} className=${'auto' + (a.on ? '' : ' off')}>
      <div className="auto-top"><div><span className="fam">${a.fam}</span><b>${a.name}</b></div><button className="switch" role="switch" aria-checked=${a.on} aria-label=${'Turn ' + a.name + (a.on ? ' off' : ' on')} onClick=${() => toggle(a.id)}></button></div>
      <dl className="rule"><dt>When</dt><dd>${a.when}</dd><dt>Then</dt><dd>${a.then}</dd></dl>
      <div className="auto-foot"><span>${a.on ? 'Running' : 'Paused'}</span><span className="num">${a.runs} runs this month</span></div>
    </article>`)}</div>
  </section>`;
}

/* ---------- Add lead ---------- */
function AddLead({leads, close, add, call, erp}){
  const [newPartner, setNewPartner] = useState(false);
  const [f, setF] = useState({name:'', phone:'', source:'', sub:'', ref:'', showroom:SHOWROOMS[0], interest:'', value:'', area:'', owner:OWNERS[0]});
  const [tried, setTried] = useState(false);
  const set = (k,v) => setF(x => ({...x, [k]:v}));
  const s = srcById[f.source];
  const digits = f.phone.replace(/\D/g,'').slice(-10);
  const dup = digits.length === 10 ? leads.find(l => l.phone.replace(/\D/g,'').slice(-10) === digits) : null;
  const partners = s?.family === 'partner' ? PARTNERS.filter(p => p.type === f.source && p.active !== false) : [];
  const clients = leads.filter(l => l.stage === 'won');
  const errs = {name:!f.name.trim(), phone:digits.length !== 10, source:!f.source, ref:(s?.family === 'partner' || s?.family === 'referral') && !f.ref};
  const ok = !Object.values(errs).some(Boolean);
  const submit = e => { e.preventDefault(); setTried(true); if (!ok) return;
    const owner = s.family === 'partner' ? partnerById[f.ref].owner : f.owner;
    add({...f, owner, phone:'+91 ' + digits.slice(0,5) + ' ' + digits.slice(5), showroom: f.source === 'walkin' ? f.showroom : '', dup:!!dup}); };
  return html`<div className="modal" role="dialog" aria-modal="true" aria-label="Add lead">
    <div className="scrim" onClick=${close}></div>
    <form className="sheet" onSubmit=${submit} noValidate>
      <header><h2>Add lead</h2><p>Name, mobile and source are all you need. A welcome message goes out automatically.</p></header>
      <div className="form">
        <label>Client name <span className="req">*</span><input id="f-name" value=${f.name} onInput=${e => set('name', e.target.value)} placeholder="e.g. Rohan Agrawal" autoFocus/>${tried && errs.name && html`<span className="err">Enter the client's name.</span>`}</label>
        <label>WhatsApp number <span className="req">*</span><input id="f-phone" inputMode="tel" value=${f.phone} onInput=${e => set('phone', e.target.value)} placeholder="10-digit mobile"/>${tried && errs.phone && html`<span className="err">Enter a 10-digit mobile number.</span>`}</label>
        ${dup && html`<div className="warnbox full">This number is already a lead: <b>${dup.name}</b> (${srcById[dup.source].short}${dup.ref ? ', ' + refName(dup, leads) : ''}, ${stageById[dup.stage].name}). Saving will flag it for the manager so partner credit is not double-counted.</div>`}
        <div className="full" style=${{display:'grid',gap:6}}>
          <span style=${{fontSize:12,fontWeight:500,color:'var(--ink-2)'}}>Lead source <span className="req">*</span></span>
          <div className="src-grid" role="group" aria-label="Lead source">${SOURCES.map(x => html`<button type="button" key=${x.id} className="src-opt" aria-pressed=${f.source === x.id} onClick=${() => setF(v => ({...v, source:x.id, ref:'', sub:''}))}><i style=${{width:9,height:9,borderRadius:2,background:`var(--s-${x.id})`,flex:'none'}}></i>${x.name}</button>`)}</div>
          ${tried && errs.source && html`<span className="err">Pick where this client came from.</span>`}
        </div>
        ${s?.family === 'partner' && html`<label className="full">Referred by <span className="req">*</span><select id="f-ref" value=${f.ref} onChange=${e => set('ref', e.target.value)}><option value="">Choose ${s.short.toLowerCase()}</option>${partners.map(p => html`<option key=${p.id} value=${p.id}>${p.name}${p.firm ? ', ' + p.firm : ''}</option>`)}</select><button type="button" className="linkbtn" onClick=${() => setNewPartner(true)}>+ Add a new ${s.short.toLowerCase()}</button>${tried && errs.ref && html`<span className="err">Choose the partner who sent this client, so they get credit.</span>`}${f.ref && html`<span style=${{color:'var(--muted)',fontWeight:400}}>Assigned to ${partnerById[f.ref].owner}, who manages this partner.</span>`}</label>`}
        ${s?.family === 'referral' && html`<label className="full">Referred by client <span className="req">*</span><select id="f-client" value=${f.ref} onChange=${e => set('ref', e.target.value)}><option value="">Choose an existing client</option>${clients.map(c => html`<option key=${c.id} value=${c.id}>${c.name}</option>`)}</select>${tried && errs.ref && html`<span className="err">Choose the client who referred them.</span>`}</label>`}
        ${f.source === 'walkin' && html`<label>Showroom<select id="f-showroom" value=${f.showroom} onChange=${e => set('showroom', e.target.value)}>${SHOWROOMS.map(x => html`<option key=${x}>${x}</option>`)}</select></label>`}
        ${SUB[f.source] && html`<label>Sub-source<select id="f-sub" value=${f.sub} onChange=${e => set('sub', e.target.value)}><option value="">Choose</option>${SUB[f.source].map(x => html`<option key=${x}>${x}</option>`)}</select></label>`}
        <label>Interested in<input id="f-interest" value=${f.interest} onInput=${e => set('interest', e.target.value)} placeholder="Modular kitchen, wardrobes"/></label>
        <label>Budget (₹)<input id="f-value" inputMode="numeric" value=${f.value} onInput=${e => set('value', e.target.value.replace(/\D/g,''))} placeholder="350000"/></label>
        <label>Area<input id="f-area" value=${f.area} onInput=${e => set('area', e.target.value)} placeholder="Locality"/></label>
        ${s?.family !== 'partner' && html`<label>Owner<select id="f-owner" value=${f.owner} onChange=${e => set('owner', e.target.value)}>${OWNERS.map(o => html`<option key=${o}>${o}</option>`)}</select></label>`}
        <div className="form-foot"><button type="button" className="btn ghost" onClick=${close}>Cancel</button><button type="submit" className="btn primary">Add lead</button></div>
      </div>
    </form>
    ${newPartner && html`<${PartnerForm} init=${null} erp=${erp} close=${() => setNewPartner(false)} save=${async b => { const r = await call('POST', '/partners', {...b, type:f.source}, `${b.name} added as a partner.`); if (r?.id) set('ref', r.id); return !!r; }}/>`}
  </div>`;
}

function LostDialog({lead, close, pick}){
  return html`<div className="modal" role="dialog" aria-modal="true" aria-label="Lost reason">
    <div className="scrim" onClick=${close}></div>
    <div className="sheet" style=${{width:'min(400px,100%)'}}>
      <header><h2>Mark as lost</h2><p>Why is ${lead.name} not going ahead? This feeds the lost-reason report.</p></header>
      <div className="reasons">${LOST_REASONS.map(r => html`<button key=${r} className="btn" style=${{justifyContent:'flex-start'}} onClick=${() => pick(r)}>${r}</button>`)}<button className="btn ghost" onClick=${close}>Cancel</button></div>
    </div>
  </div>`;
}

const isCustomerPortal = /^\/c(\/|$)/.test(location.pathname);
if (isCustomerPortal) API.setAudience('customer');
ReactDOM.createRoot(document.getElementById('root')).render(isCustomerPortal ? html`<${CustomerApp} live=${true}/>` : html`<${App}/>`);
if ('serviceWorker' in navigator && location.protocol !== 'file:') window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
</script>

</body></html>
