/* ---------- App ---------- */
const VIEWS = [
  {id:'dashboard', name:'Dashboard', icon:'dash'},
  {id:'pipeline', name:'Leads', icon:'board'},
  {id:'inbox', name:'Inbox', icon:'chat'},
  {id:'partners', name:'Partners', icon:'users'},
  {id:'automations', name:'Automations', icon:'bolt'},
  {id:'ops', name:'Control room', icon:'chart', g:'ops', title:'Control room · what needs action now'},
  {id:'projects', name:'Projects', icon:'folder', g:'ops'},
  {id:'tasks', name:'Tasks', icon:'tasks', g:'ops'},
  {id:'support', name:'Support', icon:'chat', g:'ops', title:'Customer support desk'},
  {id:'survey', name:'Survey app', icon:'ruler', g:'ops', title:'Site survey app · mobile'},
  {id:'install', name:'Installer app', icon:'tool', g:'ops', title:'Installer app · mobile'},
  {id:'team', name:'Scorecards', icon:'users', g:'ops', title:'Scorecards · who delivers on time'},
  {id:'customer', name:'Customer app', icon:'phone', g:'ops', title:'Customer app · preview'},
  {id:'installers', name:'Installer management', icon:'tool', g:'admin', title:'Installer management'},
  {id:'users', name:'Users and access', icon:'lock', g:'admin', title:'Users and access control'}];
const viewFromHash = () => { const h = location.hash.slice(1); return VIEWS.some(v => v.id === h) ? h : 'pipeline'; };

function App(){
  const EMPTY = {me:null, projects:[], items:[], tasks:[], users:[], roles:{}, audit:[]};
  const [boot, setBoot] = useState('loading');
  const [leads, setLeads] = useState([]);
  const [autos, setAutos] = useState([]);
  const [view, setView] = useState(viewFromHash);
  const [openId, setOpenId] = useState(null);
  const [openTab, setOpenTab] = useState('chat');
  const [adding, setAdding] = useState(false);
  const [lostFor, setLostFor] = useState(null);
  const [toasts, setToasts] = useState([]);
  const [erp, setErp] = useState(EMPTY);
  const [pOpen, setPOpen] = useState(null), [pTab, setPTab] = useState('items');
  const [iOpen, setIOpen] = useState(null), [tOpen, setTOpen] = useState(null);
  const [newProj, setNewProj] = useState(false), [newTask, setNewTask] = useState(false), [taskInit, setTaskInit] = useState(null);
  const queued = useQueueCount();
  const erpRef = useRef(erp); erpRef.current = erp;
  const appRef = useRef(null);
  if (!appRef.current){
    appRef.current = {timers:{}, pending:{}, surveyDraft:{}, deferred:null};
    // restore survey work that was saved on the phone but not yet on the server (app closed or offline)
    try { Object.keys(localStorage).filter(k => k.startsWith('mms-survey-local:')).forEach(k => { const l = JSON.parse(localStorage.getItem(k)); if (l && l.rooms && Date.now() - l.at < 14 * 24 * HR) appRef.current.surveyDraft[k.slice(17)] = l.rooms; else localStorage.removeItem(k); }); } catch(e){}
  }
  const app = appRef.current;
  app.cur = () => erpRef.current;
  app.applyState = st => {
    if (Object.keys(app.timers).length){ app.deferred = st; return; }
    // keep survey rooms the surveyor is still typing (saved separately, debounced)
    const projects = st.erp.projects.map(p => app.surveyDraft[p.id] && p.survey.status !== 'submitted' ? {...p, survey:{...p.survey, rooms:app.surveyDraft[p.id]}} : p);
    syncTeam(st.erp.users);
    const sg = st.erp.settings || {};
    Object.keys(STAGE_TGT).forEach(k => delete STAGE_TGT[k]); Object.assign(STAGE_TGT, sg.stageTargets || {});
    TASK_TPL.splice(0, TASK_TPL.length, ...(sg.taskTemplates || []));
    PARTNERS.splice(0, PARTNERS.length, ...st.crm.partners); Object.keys(partnerById).forEach(k => delete partnerById[k]); st.crm.partners.forEach(p => { partnerById[p.id] = p; });
    OWNERS.splice(0, OWNERS.length, ...st.erp.users.filter(u => u.role === 'sales' && u.active !== false).map(u => u.name));
    setErp({...st.erp, projects}); setLeads(st.crm.leads); setAutos(st.crm.autos);
  };
  app.flushDeferred = () => { if (app.deferred){ const d = app.deferred; app.deferred = null; app.applyState(d); } };
  app.reload = async () => { const st = await API.call('GET', '/state'); app.applyState(st); setBoot('ready'); };
  app.loggedOut = () => { API.setToken(null); setErp(EMPTY); setLeads([]); setBoot('login'); };
  useEffect(() => {
    API.onAuthLost(() => setBoot('login'));
    API.refresh().then(ok => ok ? app.reload().catch(() => setBoot('login')) : setBoot('login'));
  }, []);
  if (erp.users.length) syncTeam(erp.users);
  const allowed = canView(erp, view);
  useEffect(() => { if (boot === 'ready' && !canView(erp, view)){ const v = VIEWS.find(x => canView(erp, x.id)); if (v) go(v.id); } }, [erp.me, boot]);
  useEffect(() => { const f = () => setView(viewFromHash()); window.addEventListener('hashchange', f); return () => window.removeEventListener('hashchange', f); }, []);
  const go = id => { setView(id); try { history.replaceState(null, '', '#' + id); } catch(e) { location.hash = id; } };

  const toast = (text, kind) => { const id = Math.random(); setToasts(t => [...t, {id, text, kind}]); setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 4200); };
  const crm = {note(){}};
  const ops = makeOps(erp, setErp, toast, leads, crm, app);
  const call = async (method, path, body, msg) => { try { const r = await API.call(method, path, body); if (r.state) app.applyState(r.state); if (msg) toast(typeof msg === 'function' ? msg(r) : msg); return r; } catch(e){ toast(e.message, 'err'); return null; } };
  const ui = {
    go:(id, init) => { setTaskInit(init || null); go(id); },
    openProject:(id, tab = 'items') => { setIOpen(null); setOpenId(null); setPTab(tab); setPOpen(id); },
    openItem:id => setIOpen(id), openTask:id => setTOpen(id),
    openLead:id => { setPOpen(null); open(id, 'details'); },
    feedback:(p, r) => call('POST', `/projects/${p.id}/feedback`, {rating:r, comment:''}, `Feedback ${r}/5 saved and added to the CRM lead.`)};

  function moveLead(id, stage, reason){
    const lead = leads.find(l => l.id === id); if (!lead || lead.stage === stage) return;
    if (stage === 'lost' && !reason){ setLostFor(id); return; }
    setLeads(ls => ls.map(l => l.id === id ? {...l, stage} : l));
    call('POST', `/leads/${id}/stage`, {stage, reason:reason || ''}, r => (r.notes || []).join(' '));
  }
  const send = (id, text, tpl) => call('POST', `/leads/${id}/messages`, tpl ? {tpl} : {text});
  const setFollow = (id, days) => call('PATCH', `/leads/${id}`, {followUpDays:days}, `Follow-up set for ${days === 1 ? 'tomorrow' : fmtDate(addDays(days))}.`);
  async function addLead(data){
    const r = await call('POST', '/leads', {name:data.name, phone:data.phone, source:data.source, sub:data.sub || '', ref:data.ref || null, showroom:data.showroom || '', interest:data.interest || '', value:Number(data.value) || 0, area:data.area || '', owner:data.owner},
      res => `${data.name} added to New and assigned to ${res.ownerName}.${srcById[data.source].family === 'partner' ? ' Partner thanked on WhatsApp.' : ''}${res.dup ? ' Duplicate number flagged.' : ''}`);
    if (r) setAdding(false);
  }
  const toggleAuto = id => { const a = autos.find(x => x.id === id); setAutos(as => as.map(x => x.id === id ? {...x, on:!x.on} : x)); call('PATCH', `/automations/${id}`, {on:!a.on}); };
  async function reset(){ if (!confirmReset()) return; const r = await call('POST', '/admin/demo-reset', {}); if (r) { app.loggedOut(); toast('Sample data restored. Log in again.'); } }
  const confirmReset = () => true;
  const open = (id, tab='chat') => { setOpenTab(tab); setOpenId(id); };

  const unread = leads.filter(l => awaitingReply(l) && !['won','lost'].includes(l.stage)).length;
  const current = leads.find(l => l.id === openId);
  const meta = VIEWS.find(v => v.id === view);
  const toastsEl = html`<div className="toasts" role="status" aria-live="polite">${toasts.map(t => html`<div className=${'toast' + (t.kind === 'err' ? ' err' : '')} key=${t.id}><${Icon} n=${t.kind === 'err' ? 'x' : 'check'} s=${16}/><span>${t.text}</span></div>`)}</div>`;

  if (boot === 'loading') return html`<div style=${{height:'100%',display:'grid',placeItems:'center',color:'var(--muted)'}}>Loading…</div>`;
  if (boot === 'login' || !erp.me || !userById[erp.me]) return html`<${React.Fragment}><${LoginScreen} audience="staff" onLogin=${async () => { await app.reload(); toast('Logged in.'); }}/>${toastsEl}<//>`;
  return html`<div className="app">
    <aside className="rail">
      <div className="brand"><${Mark}/><div><b>CRM +<br/>Operations</b></div></div>
      ${[['crm','Sales · CRM'],['ops','Operations'],['admin','Admin']].filter(([g]) => VIEWS.some(v => (v.g || 'crm') === g && canView(erp, v.id))).map(([g, label]) => html`<div key=${g}>
        <div className="rail-label">${label}</div>
        <nav className="nav" aria-label=${label}>${VIEWS.filter(v => (v.g || 'crm') === g && canView(erp, v.id)).map(v => html`<button key=${v.id} aria-current=${view === v.id ? 'page' : undefined} onClick=${() => go(v.id)}><${Icon} n=${v.icon}/>${v.name}${v.id === 'inbox' && unread ? html`<span className="count num">${unread}</span>` : null}${v.id === 'tasks' && erp.tasks.filter(t => t.assignee === erp.me && t.status !== 'done' && daysFrom(t.deadline) <= 0).length ? html`<span className="count num" style=${{background:'var(--crit)'}}>${erp.tasks.filter(t => t.assignee === erp.me && t.status !== 'done' && daysFrom(t.deadline) <= 0).length}</span>` : null}</button>`)}</nav>
      </div>`)}
      <div className="me-box"><span>Logged in</span><div style=${{display:'flex',alignItems:'center',gap:8,color:'var(--rail-ink)',fontSize:13.5}}><div style=${{display:'grid',minWidth:0}}><b style=${{fontWeight:600,whiteSpace:'nowrap'}}>${uname(erp.me)}</b><span style=${{color:'var(--rail-muted)',fontSize:12,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>${roleById[userById[erp.me].role]?.name}</span></div><button className="linkbtn" style=${{marginLeft:'auto',marginTop:0,whiteSpace:'nowrap'}} onClick=${() => ops.setMe(null)}>Log out</button></div></div>
      ${SERVER.demoMode && html`<label className="me-box"><span>Switch user (demo)</span><select value=${erp.me} onChange=${e => ops.setMe(e.target.value)}>${TEAM.map(u => html`<option key=${u.id} value=${u.id}>${u.name} · ${roleById[u.role]?.name || u.role}</option>`)}</select></label>`}
      ${queued > 0 && html`<div className="me-box" style=${{color:'var(--warn)',fontSize:12}}>${queued} change${queued > 1 ? 's' : ''} saved on this device, waiting to sync</div>`}
      <div className="wa-status">
        <b><span className="dot" style=${{background:SERVER.whatsappLive ? 'var(--wa)' : 'var(--warn)'}}></span>${SERVER.whatsappLive ? 'WhatsApp connected' : 'WhatsApp simulated'}</b>
        <span>${SERVER.whatsappLive ? 'Messages go out from your business number' : 'Add Meta tokens on the server to go live'}</span>
        ${SERVER.demoMode && can(erp, 'admin') && html`<button className="linkbtn" onClick=${reset}>Reset sample data</button>`}
      </div>
    </aside>

    <main className="main">
      <header className="topbar">
        <h1><span className="eyebrow">${meta.g === 'ops' ? 'MAKE MY SPACE OPERATIONS' : meta.g === 'admin' ? 'MAKE MY SPACE ADMIN' : 'MAKE MY SPACE CRM'}</span>${meta.title || (meta.name === 'Leads' ? 'Lead pipeline' : meta.name)}</h1>
        ${SERVER.demoMode && html`<span className="sample hide-sm">Demo mode</span>`}
        ${!meta.g && allowed && html`<button className="btn primary" onClick=${() => setAdding(true)}><${Icon} n="plus" s=${16}/>Add lead</button>`}
        ${view === 'projects' && can(erp, 'assign') && html`<button className="btn primary" onClick=${() => setNewProj(true)}><${Icon} n="plus" s=${16}/>New project</button>`}
        ${(view === 'tasks' || view === 'ops') && html`<button className="btn primary" onClick=${() => setNewTask(true)}><${Icon} n="plus" s=${16}/>New task</button>`}
      </header>
      ${!allowed ? html`<${NoAccess} erp=${erp} view=${view}/>` : html`<${React.Fragment}>
      ${view === 'dashboard' && html`<${Dashboard} leads=${leads} open=${open} go=${go}/>`}
      ${view === 'pipeline' && html`<${Pipeline} leads=${leads} open=${open} move=${moveLead}/>`}
      ${view === 'inbox' && html`<${Inbox} leads=${leads} open=${open} send=${send}/>`}
      ${view === 'partners' && html`<${Partners} leads=${leads} open=${open} call=${call} erp=${erp}/>`}
      ${view === 'automations' && html`<${Automations} autos=${autos} toggle=${toggleAuto}/>`}
      ${view === 'ops' && html`<${ControlRoom} erp=${erp} ui=${ui} ops=${ops}/>`}
      ${view === 'projects' && html`<${Projects} erp=${erp} ui=${ui} ops=${ops}/>`}
      ${userById[erp.me]?.role === 'guest' && html`<div className="panel" style=${{margin:'16px 16px 0',borderLeft:'4px solid var(--accent)'}}><h3>Welcome to Make My Space</h3><p className="hint">Your account is active, but you don't have a role yet. ${SERVER.signup === 'open' ? 'An admin has been told you joined' : 'An admin will set it shortly'}; once they do, the screens for your work appear here. Until then you only see tasks given to you.</p></div>`}
      ${view === 'tasks' && !can(erp, 'admin') && can(erp, 'people') && html`<div style=${{margin:'16px 16px 0'}}><${PeopleBox} erp=${erp} ops=${ops}/></div>`}
      ${view === 'tasks' && html`<${Tasks} key=${erp.me + JSON.stringify(taskInit)} init=${taskInit} erp=${erp} ui=${ui} ops=${ops}/>`}
      ${view === 'support' && html`<${SupportDesk} erp=${erp} ops=${ops}/>`}
      ${view === 'survey' && html`<${SurveyApp} erp=${erp} ops=${ops}/>`}
      ${view === 'install' && html`<${InstallApp} key=${erp.me} erp=${erp} ops=${ops}/>`}
      ${view === 'team' && html`<${Team} erp=${erp}/>`}
      ${view === 'installers' && html`<${InstallerMgmt} erp=${erp} ui=${ui} ops=${ops} toast=${toast}/>`}
      ${view === 'customer' && html`<${CustomerApp} erp=${erp} ops=${ops} toast=${toast}/>`}
      ${view === 'users' && html`<${UsersAdmin} erp=${erp} ops=${ops} toast=${toast}/>`}
      <//>`}
    </main>

    <nav className="bottomnav" aria-label="Main">${VIEWS.filter(v => canView(erp, v.id)).map(v => html`<button key=${v.id} aria-current=${view === v.id ? 'page' : undefined} onClick=${() => go(v.id)}><${Icon} n=${v.icon} s=${20}/>${v.name}${v.id === 'inbox' && unread ? html`<span className="count">${unread}</span>` : null}</button>`)}</nav>

    ${current && html`<${Drawer} lead=${current} leads=${leads} call=${call} money=${can(erp, 'money')} tab=${openTab} setTab=${setOpenTab} close=${() => setOpenId(null)} move=${moveLead} send=${send} follow=${setFollow} extra=${current.stage === 'won' && (can(erp, 'edit') || can(erp, 'crm')) ? html`<${ConvertBox} key=${current.id} lead=${current} erp=${erp} ops=${ops} ui=${ui}/>` : null} setOwner=${o => call('PATCH', `/leads/${current.id}`, {owner:o}, `${current.name} reassigned to ${o}.`)}/>`}
    ${adding && html`<${AddLead} leads=${leads} close=${() => setAdding(false)} add=${addLead} call=${call} erp=${erp}/>`}
    ${pOpen && html`<${ProjectDrawer} key=${pOpen} p=${erp.projects.find(p => p.id === pOpen)} erp=${erp} ui=${ui} ops=${ops} leads=${leads} tab=${pTab} setTab=${setPTab} close=${() => setPOpen(null)}/>`}
    ${tOpen && html`<${TaskDrawer} key=${tOpen} t=${erp.tasks.find(t => t.id === tOpen)} erp=${erp} ops=${ops} close=${() => setTOpen(null)}/>`}
    ${iOpen && html`<${ItemModal} key=${iOpen} it=${erp.items.find(i => i.id === iOpen)} erp=${erp} ops=${ops} ui=${ui} close=${() => setIOpen(null)}/>`}
    ${newProj && html`<${NewProject} leads=${leads} erp=${erp} ops=${ops} ui=${ui} close=${() => setNewProj(false)}/>`}
    ${newTask && html`<${NewTask} erp=${erp} ops=${ops} close=${() => setNewTask(false)}/>`}
    ${lostFor && html`<${LostDialog} lead=${leads.find(l => l.id === lostFor)} close=${() => setLostFor(null)} pick=${r => { const id = lostFor; setLostFor(null); moveLead(id, 'lost', r); }}/>`}
    <div className="toasts" role="status" aria-live="polite">${toasts.map(t => html`<div className=${'toast' + (t.kind === 'err' ? ' err' : '')} key=${t.id}><${Icon} n=${t.kind === 'err' ? 'x' : 'check'} s=${16}/><span>${t.text}</span></div>`)}</div>
  </div>`;
}

/* ---------- Pipeline (board + list) ---------- */
function Pipeline({leads, open, move}){
  const [mode, setMode] = useState(() => { try { return localStorage.getItem('mms-crm-mode') || 'board'; } catch(e){ return 'board'; } });
  const [q, setQ] = useState('');
  const [src, setSrc] = useState('all');
  const [owner, setOwner] = useState('all');
  const [dragId, setDragId] = useState(null);
  const [over, setOver] = useState(null);
  useEffect(() => { try { localStorage.setItem('mms-crm-mode', mode); } catch(e){} }, [mode]);

  const shown = leads.filter(l =>
    (src === 'all' || l.source === src) && (owner === 'all' || l.owner === owner) &&
    (!q || (l.name + ' ' + l.phone + ' ' + l.interest + ' ' + refName(l, leads) + ' ' + l.area).toLowerCase().includes(q.toLowerCase())));
  const counts = Object.fromEntries(SOURCES.map(s => [s.id, leads.filter(l => l.source === s.id).length]));

  return html`<section className="view board-view">
    <div className="toolbar">
      <div className="seg" role="group" aria-label="View">
        <button aria-pressed=${mode === 'board'} onClick=${() => setMode('board')}><${Icon} n="board" s=${15}/>Board</button>
        <button aria-pressed=${mode === 'list'} onClick=${() => setMode('list')}><${Icon} n="list" s=${15}/>List</button>
      </div>
      <label className="search"><${Icon} n="search" s=${16}/><input id="lead-search" placeholder="Search name, phone, partner" value=${q} onInput=${e => setQ(e.target.value)} aria-label="Search leads"/></label>
      <select className="sel" id="owner-filter" value=${owner} onChange=${e => setOwner(e.target.value)} aria-label="Owner"><option value="all">All owners</option>${OWNERS.map(o => html`<option key=${o}>${o}</option>`)}</select>
    </div>
    <div className="chips" style=${{marginBottom:14}} role="group" aria-label="Lead source">
      <button className="chip" aria-pressed=${src === 'all'} onClick=${() => setSrc('all')}>All sources <span className="n">${leads.length}</span></button>
      ${SOURCES.map(s => html`<button key=${s.id} className="chip" aria-pressed=${src === s.id} onClick=${() => setSrc(src === s.id ? 'all' : s.id)}><i className="sw" style=${{width:8,height:8,borderRadius:2,background:`var(--s-${s.id})`,display:'inline-block'}}></i>${s.short} <span className="n">${counts[s.id]}</span></button>`)}
    </div>

    ${mode === 'board' ? html`<div className="board">
      ${STAGES.map(st => {
        const items = shown.filter(l => l.stage === st.id).sort((a,b) => (a.fu||'9') < (b.fu||'9') ? -1 : 1);
        const total = items.reduce((s,l) => s + l.value, 0);
        return html`<div key=${st.id} className=${'col' + (over === st.id ? ' over' : '') + (st.type !== 'open' ? ' closed' : '')}
          onDragOver=${e => { e.preventDefault(); setOver(st.id); }} onDragLeave=${() => setOver(o => o === st.id ? null : o)}
          onDrop=${e => { e.preventDefault(); const id = e.dataTransfer.getData('text/plain') || dragId; setOver(null); setDragId(null); if (id) move(id, st.id); }}>
          <div className="col-head">
            <i className="mark" style=${{background: st.type === 'won' ? 'var(--good)' : st.type === 'lost' ? 'var(--crit)' : st.type === 'nurture' ? 'var(--line-2)' : 'var(--ink)'}}></i>
            <h2>${st.name}</h2><span className="c">${items.length}</span><span className="v">${total ? lakh(total) : ''}</span>
          </div>
          <div className="col-list">
            ${items.length ? items.map(l => html`<${Card} key=${l.id} lead=${l} leads=${leads} open=${open} dragging=${dragId === l.id} onDrag=${setDragId}/>`) : html`<div className="col-empty">Drop a lead here</div>`}
          </div>
        </div>`;
      })}
    </div>` : html`<div className="table-wrap" style=${{flex:1,minHeight:0,overflow:'auto'}}><table>
      <thead><tr><th>Client</th><th>Source</th><th>Stage</th><th className="r">Value</th><th>Follow-up</th><th>WhatsApp</th><th>Owner</th></tr></thead>
      <tbody>${shown.map(l => html`<tr key=${l.id} className="click" onClick=${() => open(l.id, 'details')}>
        <td><b>${l.name}</b><div className="sub">${l.interest}</div></td>
        <td><${SourceTag} lead=${l} leads=${leads}/></td>
        <td onClick=${e => e.stopPropagation()}><select className="sel" id=${'st-' + l.id} value=${l.stage} onChange=${e => move(l.id, e.target.value)} aria-label=${'Stage for ' + l.name}>${STAGES.map(s => html`<option key=${s.id} value=${s.id}>${s.name}</option>`)}</select></td>
        <td className="r num"><b>${lakh(l.value)}</b></td>
        <td>${['won','lost'].includes(l.stage) ? html`<span className="sub">Closed</span>` : html`<${Due} fu=${l.fu}/>`}</td>
        <td>${windowOpen(l) ? html`<span className="wa-pill"><span className="dot"></span>${hoursLeft(l)}h left</span>` : html`<span className="sub">Template only</span>`}</td>
        <td>${l.owner}</td>
      </tr>`)}</tbody></table></div>`}
  </section>`;
}

/* ---------- Drawer ---------- */
function QuoteTab({lead, call}){
  const latest = lead.quotes?.length ? lead.quotes[lead.quotes.length - 1] : null;
  const blankLine = () => ({room:'', item:'', desc:'', size:'', qty:'1', unit:'nos', rate:''});
  const [editing, setEditing] = useState(!latest);
  const [lines, setLines] = useState(latest ? latest.lines.map(l => ({...l, qty:String(l.qty), rate:String(l.rate)})) : [blankLine()]);
  const [discount, setDiscount] = useState(latest ? String(latest.discount || '') : ''), [gst, setGst] = useState(latest ? String(latest.gstPct) : '18'), [notes, setNotes] = useState(latest?.notes || '');
  const upd = (i, k, v) => setLines(ls => ls.map((l, j) => j === i ? {...l, [k]:v} : l));
  const sub = lines.reduce((a, l) => a + (Number(l.qty) || 0) * (Number(l.rate) || 0), 0), taxable = Math.max(0, sub - (Number(discount) || 0)), total = Math.round(taxable * (1 + (Number(gst) || 0) / 100));
  const valid = lines.some(l => l.item.trim() && Number(l.rate) > 0);
  const save = async () => {
    const body = {lines:lines.filter(l => l.item.trim()).map(l => ({room:l.room, item:l.item.trim(), desc:l.desc, size:l.size, qty:Number(l.qty) || 0, unit:l.unit || 'nos', rate:Number(l.rate) || 0})), discount:Number(discount) || 0, gstPct:Number(gst) || 0, notes};
    const r = await call('POST', `/leads/${lead.id}/quotes`, body, res => `Quotation R${res.rev} saved · ${rs(total)}. Deal value updated.`);
    if (r){ setEditing(false); if (r.quoteId) openPrint('quote', r.quoteId); }
  };
  return html`<div className="details">
    ${lead.quotes?.length > 0 && html`<div className="box"><h4>Revisions</h4><table style=${{minWidth:0}}><tbody>${[...lead.quotes].reverse().map(x => html`<tr key=${x.id}><td><b>R${x.rev}</b></td><td className="num">${rs(x.total)}</td><td><span className=${'pill' + (x.status === 'accepted' ? ' good' : x.status === 'superseded' ? '' : ' warn')}>${x.status}</span></td><td className="meta">${dayLabel(x.at)}</td>
      <td style=${{whiteSpace:'nowrap'}}><button className="btn small ghost" onClick=${() => openPrint('quote', x.id)}>Print / PDF</button>${x.status === 'sent' && html`<button className="btn small" onClick=${() => call('POST', `/quotes/${x.id}/accept`, {}, 'Quotation marked accepted. Deal value updated.')}>Client accepted</button>`}</td></tr>`)}</tbody></table>
      ${!editing && html`<div className="row-btns" style=${{marginTop:8}}><button className="btn small" onClick=${() => setEditing(true)}>New revision</button></div>`}</div>`}
    ${editing && html`<div className="box"><h4>${latest ? 'Revision R' + (latest.rev + 1) : 'New quotation'}</h4>
      <div style=${{overflowX:'auto'}}><table className="qtable" style=${{minWidth:640}}><thead><tr><th>Room</th><th>Item</th><th>Size</th><th className="r">Qty</th><th className="r">Rate ₹</th><th className="r">Amount</th><th></th></tr></thead><tbody>
        ${lines.map((l, i) => html`<tr key=${i}>
          <td><input value=${l.room} onInput=${e => upd(i, 'room', e.target.value)} placeholder="Kitchen" style=${{width:90}}/></td>
          <td><input value=${l.item} onInput=${e => upd(i, 'item', e.target.value)} placeholder="Base units, carcass + shutters" style=${{width:'100%',minWidth:160}}/><input value=${l.desc} onInput=${e => upd(i, 'desc', e.target.value)} placeholder="Material / finish (optional)" style=${{width:'100%',marginTop:4,fontSize:12}}/></td>
          <td><input value=${l.size} onInput=${e => upd(i, 'size', e.target.value)} placeholder="3000 × 600" style=${{width:90}}/></td>
          <td className="r"><input inputMode="decimal" value=${l.qty} onInput=${e => upd(i, 'qty', e.target.value.replace(/[^\d.]/g,''))} style=${{width:52,textAlign:'right'}}/><select value=${l.unit} onChange=${e => upd(i, 'unit', e.target.value)} style=${{width:62,marginLeft:4}}>${['nos','sqft','rft','set'].map(u => html`<option key=${u}>${u}</option>`)}</select></td>
          <td className="r"><input inputMode="numeric" value=${l.rate} onInput=${e => upd(i, 'rate', e.target.value.replace(/[^\d.]/g,''))} style=${{width:90,textAlign:'right'}}/></td>
          <td className="r num">${rs((Number(l.qty) || 0) * (Number(l.rate) || 0))}</td>
          <td><button className="btn small ghost" aria-label="Remove line" disabled=${lines.length === 1} onClick=${() => setLines(ls => ls.filter((_, j) => j !== i))}>×</button></td></tr>`)}
      </tbody></table></div>
      <div className="row-btns"><button className="btn small" onClick=${() => setLines(ls => [...ls, blankLine()])}>+ Add line</button></div>
      <dl className="fields" style=${{marginTop:10}}>
        <div><dt>Subtotal</dt><dd className="num">${rs(sub)}</dd></div>
        <div><dt>Discount ₹</dt><dd><input inputMode="numeric" value=${discount} onInput=${e => setDiscount(e.target.value.replace(/\D/g,''))} style=${{width:110}}/></dd></div>
        <div><dt>GST %</dt><dd><input inputMode="numeric" value=${gst} onInput=${e => setGst(e.target.value.replace(/[^\d.]/g,''))} style=${{width:60}}/></dd></div>
        <div><dt>Total incl. GST</dt><dd className="num"><b>${rs(total)}</b></dd></div>
      </dl>
      <label style=${{display:'grid',gap:4,fontSize:12,marginTop:8}}>Notes for the client<textarea rows="2" value=${notes} onInput=${e => setNotes(e.target.value)} placeholder="Brand of hardware, exclusions, timeline…"></textarea></label>
      <div className="row-btns" style=${{marginTop:10}}>${latest && html`<button className="btn small ghost" onClick=${() => setEditing(false)}>Cancel</button>`}<button className="btn small primary" disabled=${!valid} onClick=${save}>Save and open PDF</button></div>
    </div>`}
  </div>`;
}

/* ---------- Chat ---------- */
function Chat({lead, send}){
  const [text, setText] = useState('');
  const [tpl, setTpl] = useState(TEMPLATES[0].id);
  const end = useRef(null);
  const isOpen = windowOpen(lead);
  useEffect(() => { end.current?.scrollIntoView({block:'end'}); }, [lead.msgs.length, lead.id]);
  const fill = b => b.replace('{{name}}', first(lead.name)).replace('{{interest}}', lead.interest.toLowerCase());
  const submit = () => { const t = text.trim(); if (!t) return; send(lead.id, t); setText(''); };
  let lastDay = '';
  return html`<div className="chat">
    ${isOpen ? html`<div className="window open"><span className="dot"></span>24-hour window open · ${hoursLeft(lead)}h left for free-form replies</div>`
      : html`<div className="window closed"><${Icon} n="lock" s=${14}/>Window closed. Send an approved template to restart the chat.</div>`}
    <div className="msgs">
      ${lead.msgs.length === 0 && html`<div className="day">No messages yet</div>`}
      ${lead.msgs.map((m,i) => { const d = dayLabel(m.t); const sep = d !== lastDay; lastDay = d;
        return html`<${React.Fragment} key=${i}>${sep && html`<div className="day">${d}</div>`}
          <div className=${'msg ' + m.from}>${m.tpl && html`<span className="tpl">${m.from === 'auto' ? 'Automation · ' : 'Template · '}${m.tpl}</span>`}<span>${m.text}</span><span className="meta">${clock(m.t)}${m.from !== 'them' ? html`<span style=${{color:'var(--wa)'}}>✓✓</span>` : null}</span></div>
        <//>`; })}
      <div ref=${end}></div>
    </div>
    <div className="composer">
      ${isOpen ? html`
        <div className="quick">${QUICK.map(q => html`<button key=${q} onClick=${() => setText(q)}>${q}</button>`)}</div>
        <div className="compose-row">
          <textarea id=${'compose-' + lead.id} rows="1" placeholder=${'Reply to ' + first(lead.name)} value=${text} onInput=${e => setText(e.target.value)} onKeyDown=${e => { if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); submit(); } }} aria-label="Message"></textarea>
          <button className="btn wa" onClick=${submit} disabled=${!text.trim()}><${Icon} n="send" s=${16}/>Send</button>
        </div>` : html`
        <div className="tpl-list" role="group" aria-label="Approved templates">${TEMPLATES.map(t => html`<button key=${t.id} className="tpl-opt" aria-pressed=${tpl === t.id} onClick=${() => setTpl(t.id)}><b>${t.id}</b><em>${t.cat}</em><span>${fill(t.body)}</span></button>`)}</div>
        <div style=${{display:'flex',justifyContent:'flex-end'}}><button className="btn wa" onClick=${() => { const t = TEMPLATES.find(x => x.id === tpl); send(lead.id, fill(t.body), t.id); }}><${Icon} n="send" s=${16}/>Send template</button></div>`}
    </div>
  </div>`;
}

/* ---------- Dashboard ---------- */
function Dashboard({leads, open, go}){
  const openLeads = leads.filter(l => OPEN.includes(l.stage));
  const weekNew = leads.filter(l => Date.now() - l.created < 7*DAY).length;
  const due = openLeads.filter(l => l.fu && daysFrom(l.fu) <= 0).sort((a,b) => a.fu < b.fu ? -1 : 1);
  const overdue = due.filter(l => daysFrom(l.fu) < 0).length;
  const pipe = openLeads.reduce((s,l) => s + l.value, 0);
  const won = leads.filter(l => l.stage === 'won');
  const wonVal = won.reduce((s,l) => s + l.value, 0);
  const waiting = leads.filter(l => awaitingReply(l) && windowOpen(l) && !['won','lost'].includes(l.stage));
  const bySrc = SOURCES.map(s => { const all = leads.filter(l => l.source === s.id); return {s, n:all.length, won:all.filter(l => l.stage === 'won').length, val:all.filter(l => l.stage === 'won').reduce((a,l) => a + l.value, 0)}; });
  const max = Math.max(...bySrc.map(x => x.n), 1);
  const reached = OPEN.map((id,i) => ({id, name:stageById[id].name, n:leads.filter(l => { const j = OPEN.indexOf(l.stage); return (j >= i) || l.stage === 'won'; }).length}));
  const fmax = Math.max(...reached.map(r => r.n), 1);
  const hr = new Date().getHours();
  return html`<section className="view">
    <p style=${{margin:'0 0 14px',color:'var(--muted)'}}>${hr < 12 ? 'Good morning' : hr < 17 ? 'Good afternoon' : 'Good evening'}. ${due.length} follow-ups need attention today and ${waiting.length} clients are waiting for a reply.</p>
    <div className="kpis">
      <div className="kpi"><span className="l">New this week</span><span className="v">${weekNew}</span><span className="s">${leads.filter(l => Date.now() - l.created < DAY).length} today</span></div>
      <div className=${'kpi' + (overdue ? ' alert' : '')}><span className="l">Follow-ups due</span><span className="v">${due.length}</span><span className="s">${overdue} overdue</span></div>
      <div className="kpi"><span className="l">Open pipeline</span><span className="v">${lakh(pipe)}</span><span className="s">${openLeads.length} active leads</span></div>
      <div className="kpi"><span className="l">Won</span><span className="v">${lakh(wonVal)}</span><span className="s">${won.length} deals closed</span></div>
    </div>
    <div className="grid2">
      <div className="stack">
        <div className="panel"><h3>Leads by source</h3><p className="hint">Total leads, with the won share filled solid. Partner sources close the largest deals.</p>
          <div className="bars">${bySrc.map(x => html`<div className="bar-row" key=${x.s.id}>
            <span style=${{display:'flex',alignItems:'center',gap:8,minWidth:0}}><i style=${{width:8,height:8,borderRadius:2,background:`var(--s-${x.s.id})`,flex:'none'}}></i><span style=${{overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>${x.s.short}</span></span>
            <div className="bar-track" title=${`${x.n} leads, ${x.won} won`}><i style=${{width:(x.won/max*100)+'%',background:`var(--s-${x.s.id})`}}></i><i style=${{width:((x.n-x.won)/max*100)+'%',background:`var(--s-${x.s.id})`,opacity:.35}}></i></div>
            <span className="n"><b>${x.n}</b> · ${x.val ? lakh(x.val) : '—'}</span></div>`)}</div>
          <div className="legend"><span><i style=${{background:'var(--ink-2)'}}></i>Won</span><span><i style=${{background:'var(--ink-2)',opacity:.35}}></i>Open, nurture or lost</span><span>Right: leads · won value</span></div>
        </div>
        <div className="panel"><h3>Pipeline funnel</h3><p className="hint">Leads that have reached each stage, including those now won.</p>
          <div className="funnel">${reached.map(r => html`<div className="f-row" key=${r.id}><span>${r.name}</span><div><div className="f-bar" style=${{width:(r.n/fmax*100)+'%'}}></div></div><span className="n">${r.n}</span></div>`)}</div>
        </div>
      </div>
      <div className="stack">
        <div className="panel"><h3>Waiting for a reply</h3><p className="hint">Inside the free 24-hour window. Answer these first.</p>
          <div className="task-list">${waiting.length ? waiting.map(l => html`<button className="task" key=${l.id} onClick=${() => open(l.id, 'chat')}><span className="avatar" style=${{marginLeft:0}}>${initials(l.name)}</span><span className="who"><b>${l.name}</b><span>${l.msgs[l.msgs.length-1].text}</span></span><span className="wa-pill" style=${{marginLeft:'auto'}}>${ago(l.lastIn)}</span></button>`) : html`<p className="hint">All caught up.</p>`}</div>
        </div>
        <div className="panel"><h3>Follow-ups due</h3><p className="hint">Overdue first, then today.</p>
          <div className="task-list">${due.map(l => html`<button className="task" key=${l.id} onClick=${() => open(l.id, 'details')}><span className="avatar" style=${{marginLeft:0}}>${initials(l.name)}</span><span className="who"><b>${l.name}</b><span>${stageById[l.stage].name} · ${l.owner}</span></span><${Due} fu=${l.fu}/></button>`)}</div>
          <button className="btn small ghost" style=${{marginTop:8}} onClick=${() => go('pipeline')}>Open the board</button>
        </div>
      </div>
    </div>
  </section>`;
}

/* ---------- Inbox ---------- */
function Inbox({leads, open, send}){
  const [filter, setFilter] = useState('all');

  const [sel, setSel] = useState(() => convs[0]?.id);
  const lead = leads.find(l => l.id === sel) || convs[0];

        ${convs.map(l => { const m = l.msgs[l.msgs.length-1]; return html`<button key=${l.id} className="conv" aria-current=${lead && lead.id === l.id ? 'true' : undefined} onClick=${() => narrow() ? open(l.id, 'chat') : setSel(l.id)}>

        <div className="chat-head"><span className="avatar" style=${{marginLeft:0}}>${initials(lead.name)}</span><div style=${{minWidth:0}}><b>${lead.name}</b><div style=${{fontSize:12,color:'var(--muted)'}}>${stageById[lead.stage].name} · ${lead.owner}</div></div><button className="btn small" style=${{marginLeft:'auto'}} onClick=${() => open(lead.id, 'details')}>Open lead</button></div>

/* ---------- Partners ---------- */
const PARTNER_TYPES = {architect:'Architect / Interior planner', contractor:'Civil engineer / Contractor', agent:'Real estate agent'};
function PartnerForm({init, erp, close, save}){
  const blank = {name:'', firm:'', type:'architect', phone:'', email:'', city:'', tier:'Silver', rate:'2', owner:'', notes:'', active:true};
  const [f, setF] = useState(init ? {...blank, ...init, rate:String(init.rate ?? ''), owner:init.ownerId || '', phone:init.phone || ''} : blank);
  const [tried, setTried] = useState(false), [busy, setBusy] = useState(false);
  const set = (k, v) => setF(x => ({...x, [k]:v}));
  const digits = f.phone.replace(/\D/g,'').slice(-10);
  const errs = {name:f.name.trim().length < 2, phone:!!f.phone.trim() && digits.length !== 10, rate:!(Number(f.rate) >= 0 && Number(f.rate) <= 30)};
  const owners = (erp?.users || []).filter(u => u.active !== false && ['sales','admin','ops_head'].includes(u.role));
  const submit = async e => { e.preventDefault(); setTried(true); if (Object.values(errs).some(Boolean)) return; setBusy(true);
    const ok = await save({name:f.name.trim(), firm:f.firm.trim(), type:f.type, phone:digits ? digits : '', email:f.email.trim(), city:f.city.trim(), tier:f.tier, rate:Number(f.rate) || 0, owner:f.owner || null, notes:f.notes, active:f.active});
    setBusy(false); if (ok) close(); };
  return html`<div className="modal" role="dialog" aria-modal="true" aria-label=${init ? 'Edit partner' : 'Add partner'}>
    <div className="scrim" onClick=${close}></div>
    <form className="sheet" onSubmit=${submit} noValidate>
      <header><h2>${init ? 'Edit partner' : 'Add partner'}</h2><p>Architects, contractors and agents who send you clients. Their leads, sales value and commission are tracked automatically.</p></header>
      <div className="form">
        <label>Name <span className="req">*</span><input value=${f.name} onInput=${e => set('name', e.target.value)} placeholder="e.g. Ar. Neha Sharma" autoFocus/>${tried && errs.name && html`<span className="err">Enter the partner's name.</span>`}</label>
        <label>Firm<input value=${f.firm} onInput=${e => set('firm', e.target.value)} placeholder="Studio / company name"/></label>
        <label className="full">Type <span className="req">*</span><select value=${f.type} disabled=${!!init && init.stats?.leads > 0} onChange=${e => set('type', e.target.value)}>${Object.entries(PARTNER_TYPES).map(([k, n]) => html`<option key=${k} value=${k}>${n}</option>`)}</select>${init && init.stats?.leads > 0 && html`<span className="hint">Type is fixed once the partner has leads.</span>`}</label>
        <label>WhatsApp number<input inputMode="tel" value=${f.phone} onInput=${e => set('phone', e.target.value)} placeholder="10-digit mobile"/>${tried && errs.phone && html`<span className="err">Enter a 10-digit number or leave it empty.</span>`}</label>
        <label>Email<input type="email" value=${f.email} onInput=${e => set('email', e.target.value)}/></label>
        <label>City<input value=${f.city} onInput=${e => set('city', e.target.value)}/></label>
        <label>Tier<select value=${f.tier} onChange=${e => set('tier', e.target.value)}>${['Silver','Gold','Platinum'].map(t => html`<option key=${t}>${t}</option>`)}</select></label>
        <label>Commission %<input inputMode="decimal" value=${f.rate} onInput=${e => set('rate', e.target.value.replace(/[^\d.]/g,''))}/>${tried && errs.rate && html`<span className="err">0 to 30.</span>`}</label>
        <label>Relationship owner<select value=${f.owner} onChange=${e => set('owner', e.target.value)}><option value="">Not set</option>${owners.map(u => html`<option key=${u.id} value=${u.id}>${u.name}</option>`)}</select></label>
        <label className="full">Notes<textarea rows="2" value=${f.notes} onInput=${e => set('notes', e.target.value)} placeholder="Agreement, preferred brands, payout terms…"></textarea></label>
        ${init && html`<label className="full" style=${{flexDirection:'row',alignItems:'center',gap:8}}><input type="checkbox" checked=${f.active} onChange=${e => set('active', e.target.checked)} style=${{width:'auto'}}/> Active (inactive partners are hidden from the lead form)</label>`}
        <div className="form-foot"><button type="button" className="btn ghost" onClick=${close}>Cancel</button><button type="submit" className="btn primary" disabled=${busy}>${init ? 'Save' : 'Add partner'}</button></div>
      </div>
    </form>
  </div>`;
}
function Partners({leads, open, call, erp}){
  const [exp, setExp] = useState(null), [type, setType] = useState('all'), [form, setForm] = useState(null), [showInactive, setShowInactive] = useState(false);
  const money = can(erp, 'money');
  const rows = PARTNERS.filter(p => showInactive || p.active !== false).map(p => {
    const ls = leads.filter(l => l.ref === p.id), st = p.stats || {};
    const due = (st.commission || 0) - (st.commissionPaid || 0);
    const lastDays = st.lastLead ? Math.floor((Date.now() - st.lastLead) / DAY) : null;
    return {p, ls, st, due, lastDays};
  }).filter(r => type === 'all' || r.p.type === type).sort((a,b) => (b.st.wonValue || 0) - (a.st.wonValue || 0) || b.ls.length - a.ls.length);
  const tot = rows.reduce((a, r) => ({leads:a.leads + (r.st.leads || 0), pipe:a.pipe + (r.st.pipeline || 0), won:a.won + (r.st.wonValue || 0), proj:a.proj + (r.st.projectValue || 0), due:a.due + r.due}), {leads:0, pipe:0, won:0, proj:0, due:0});
  const save = async (body, id) => !!(await call(id ? 'PATCH' : 'POST', id ? `/partners/${id}` : '/partners', body, id ? 'Partner updated.' : `${body.name} added. Choose them under "Referred by" when adding a lead.`));
  return html`<section className="view">
    <div className="toolbar">
      <div className="chips" role="group" aria-label="Partner type">${[['all','All partners'],['architect','Architects'],['contractor','Contractors'],['agent','Agents']].map(([id,n]) => html`<button key=${id} className="chip" aria-pressed=${type === id} onClick=${() => setType(id)}>${n}</button>`)}</div>
      <label className="chip" style=${{cursor:'pointer'}}><input type="checkbox" checked=${showInactive} onChange=${e => setShowInactive(e.target.checked)} style=${{margin:0}}/> Show inactive</label>
      <span style=${{marginLeft:'auto'}}></span>
      <button className="btn small" onClick=${() => downloadCsv('partners')}>Export CSV</button>
      <button className="btn small primary" onClick=${() => setForm({})}><${Icon} n="plus" s=${14}/>Add partner</button>
    </div>
    <div className="kpis" style=${{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(150px,1fr))',gap:12,marginBottom:16}}>
      ${[['Partners', rows.length], ['Leads sent', tot.leads], ['Open pipeline', lakh(tot.pipe)], ['Won value', lakh(tot.won)], ['Project value', lakh(tot.proj)], ...(money ? [['Commission due', inr(tot.due)]] : [])].map(([k, v]) => html`<div key=${k} className="panel" style=${{padding:'12px 14px'}}><div className="sub" style=${{fontSize:11,letterSpacing:'.08em',textTransform:'uppercase',color:'var(--muted)'}}>${k}</div><b className="num" style=${{fontSize:20}}>${v}</b></div>`)}
    </div>
    <div className="table-wrap"><table>
      <thead><tr><th>Partner</th><th>Type</th><th>Tier</th><th className="r">Leads</th><th className="r">Open pipeline</th><th className="r">Won</th><th className="r">Won value</th><th className="r">Project value</th>${money && html`<th className="r">Commission due</th>`}<th>Last lead</th><th></th></tr></thead>
      <tbody>${rows.map(r => html`<${React.Fragment} key=${r.p.id}>
        <tr className="click" onClick=${() => setExp(exp === r.p.id ? null : r.p.id)} aria-expanded=${exp === r.p.id} style=${r.p.active === false ? {opacity:.55} : null}>
          <td className="p-name"><b>${r.p.name}</b><div className="sub">${[r.p.firm, r.p.city, r.p.owner ? 'managed by ' + r.p.owner : ''].filter(Boolean).join(' · ')}</div></td>
          <td><span className="src"><i className="sw" style=${{background:`var(--s-${r.p.type})`}}></i>${PARTNER_TYPES[r.p.type]}</span></td>
          <td><span className=${'tier ' + r.p.tier}>${r.p.tier}</span></td>
          <td className="r num">${r.st.leads || 0}</td>
          <td className="r num">${r.st.pipeline ? lakh(r.st.pipeline) : '—'}<div className="sub">${r.st.open || 0} open</div></td>
          <td className="r num">${r.st.won || 0}</td>
          <td className="r num"><b>${r.st.wonValue ? lakh(r.st.wonValue) : '—'}</b></td>
          <td className="r num">${r.st.projectValue ? lakh(r.st.projectValue) : '—'}</td>
          ${money && html`<td className="r num">${r.due ? inr(r.due) : '—'}<div className="sub">${r.p.rate}%${r.st.commissionPaid ? ' · ' + inr(r.st.commissionPaid) + ' paid' : ''}</div></td>`}
          <td>${r.lastDays == null ? html`<span className="dormant">No leads yet</span>` : r.lastDays > 60 ? html`<span className="dormant">${r.lastDays}d ago</span>` : html`<span className="num">${r.lastDays === 0 ? 'Today' : r.lastDays + 'd ago'}</span>`}</td>
          <td><button className="btn small ghost" onClick=${e => { e.stopPropagation(); setForm(r.p); }}>Edit</button></td>
        </tr>
        ${exp === r.p.id && html`<tr className="expand"><td colSpan=${money ? 11 : 10}>
          <div style=${{display:'flex',gap:18,flexWrap:'wrap',fontSize:13,marginBottom:8}}>${r.p.phone && html`<span>WhatsApp <b>${r.p.phone}</b></span>`}${r.p.email && html`<span>${r.p.email}</span>`}${r.p.notes && html`<span className="meta">${r.p.notes}</span>`}</div>
          ${r.ls.length ? html`<div className="mini-leads">${r.ls.map(l => html`<button key=${l.id} className="mini" onClick=${() => open(l.id, 'details')}><b>${l.name}</b><span style=${{color:'var(--muted)'}}>${stageById[l.stage].name}</span><span className="num">${lakh(l.value)}</span></button>`)}</div>` : html`<span style=${{color:'var(--muted)'}}>No leads from this partner yet.</span>`}
          ${money && r.p.commissions?.length > 0 && html`<table style=${{marginTop:10,minWidth:0}}><thead><tr><th>Commission on</th><th className="r">Amount</th><th>Status</th><th></th></tr></thead><tbody>${r.p.commissions.map(c => html`<tr key=${c.id}><td>${leads.find(l => l.id === c.leadId)?.name || c.leadId}</td><td className="r num">${inr(c.amount)}</td><td><span className=${'pill' + (c.status === 'paid' ? ' good' : ' warn')}>${c.status}</span></td><td><button className="btn small" onClick=${() => call('POST', `/commissions/${c.id}/paid`, {paid:c.status !== 'paid'}, c.status !== 'paid' ? 'Commission marked paid.' : 'Marked pending again.')}>${c.status === 'paid' ? 'Mark pending' : 'Mark paid'}</button></td></tr>`)}</tbody></table>`}
        </td></tr>`}
      <//>`)}</tbody>
    </table></div>
    ${form && html`<${PartnerForm} init=${form.id ? form : null} erp=${erp} close=${() => setForm(null)} save=${b => save(b, form.id)}/>`}
  </section>`;
}

/* ---------- Automations ---------- */
function Automations({autos, toggle}){
  const on = autos.filter(a => a.on).length;
  return html`<section className="view">
    <p style=${{margin:'0 0 14px',color:'var(--muted)'}}>${on} of ${autos.length} automations are on. Each one reads as When this happens, Then do this; every action is logged on the lead's timeline.</p>
    <div className="autos">${autos.map(a => html`<article key=${a.id} className=${'auto' + (a.on ? '' : ' off')}>
      <div className="auto-top"><div><span className="fam">${a.fam}</span><b>${a.name}</b></div><button className="switch" role="switch" aria-checked=${a.on} aria-label=${'Turn ' + a.name + (a.on ? ' off' : ' on')} onClick=${() => toggle(a.id)}></button></div>
      <dl className="rule"><dt>When</dt><dd>${a.when}</dd><dt>Then</dt><dd>${a.then}</dd></dl>
      <div className="auto-foot"><span>${a.on ? 'Running' : 'Paused'}</span><span className="num">${a.runs} runs this month</span></div>
    </article>`)}</div>
  </section>`;
}

/* ---------- Add lead ---------- */
function AddLead({leads, close, add, call, erp}){
  const [newPartner, setNewPartner] = useState(false);
  const [f, setF] = useState({name:'', phone:'', source:'', sub:'', ref:'', showroom:SHOWROOMS[0], interest:'', value:'', area:'', owner:OWNERS[0]});
  const [tried, setTried] = useState(false);
  const set = (k,v) => setF(x => ({...x, [k]:v}));
  const s = srcById[f.source];
  const digits = f.phone.replace(/\D/g,'').slice(-10);
  const dup = digits.length === 10 ? leads.find(l => l.phone.replace(/\D/g,'').slice(-10) === digits) : null;
  const partners = s?.family === 'partner' ? PARTNERS.filter(p => p.type === f.source && p.active !== false) : [];
  const clients = leads.filter(l => l.stage === 'won');
  const errs = {name:!f.name.trim(), phone:digits.length !== 10, source:!f.source, ref:(s?.family === 'partner' || s?.family === 'referral') && !f.ref};
  const ok = !Object.values(errs).some(Boolean);
  const submit = e => { e.preventDefault(); setTried(true); if (!ok) return;
    const owner = s.family === 'partner' ? partnerById[f.ref].owner : f.owner;
    add({...f, owner, phone:'+91 ' + digits.slice(0,5) + ' ' + digits.slice(5), showroom: f.source === 'walkin' ? f.showroom : '', dup:!!dup}); };
  return html`<div className="modal" role="dialog" aria-modal="true" aria-label="Add lead">
    <div className="scrim" onClick=${close}></div>
    <form className="sheet" onSubmit=${submit} noValidate>
      <header><h2>Add lead</h2><p>Name, mobile and source are all you need. A welcome message goes out automatically.</p></header>
      <div className="form">
        <label>Client name <span className="req">*</span><input id="f-name" value=${f.name} onInput=${e => set('name', e.target.value)} placeholder="e.g. Rohan Agrawal" autoFocus/>${tried && errs.name && html`<span className="err">Enter the client's name.</span>`}</label>
        <label>WhatsApp number <span className="req">*</span><input id="f-phone" inputMode="tel" value=${f.phone} onInput=${e => set('phone', e.target.value)} placeholder="10-digit mobile"/>${tried && errs.phone && html`<span className="err">Enter a 10-digit mobile number.</span>`}</label>
        ${dup && html`<div className="warnbox full">This number is already a lead: <b>${dup.name}</b> (${srcById[dup.source].short}${dup.ref ? ', ' + refName(dup, leads) : ''}, ${stageById[dup.stage].name}). Saving will flag it for the manager so partner credit is not double-counted.</div>`}
        <div className="full" style=${{display:'grid',gap:6}}>
          <span style=${{fontSize:12,fontWeight:500,color:'var(--ink-2)'}}>Lead source <span className="req">*</span></span>
          <div className="src-grid" role="group" aria-label="Lead source">${SOURCES.map(x => html`<button type="button" key=${x.id} className="src-opt" aria-pressed=${f.source === x.id} onClick=${() => setF(v => ({...v, source:x.id, ref:'', sub:''}))}><i style=${{width:9,height:9,borderRadius:2,background:`var(--s-${x.id})`,flex:'none'}}></i>${x.name}</button>`)}</div>
          ${tried && errs.source && html`<span className="err">Pick where this client came from.</span>`}
        </div>
        ${s?.family === 'partner' && html`<label className="full">Referred by <span className="req">*</span><select id="f-ref" value=${f.ref} onChange=${e => set('ref', e.target.value)}><option value="">Choose ${s.short.toLowerCase()}</option>${partners.map(p => html`<option key=${p.id} value=${p.id}>${p.name}${p.firm ? ', ' + p.firm : ''}</option>`)}</select><button type="button" className="linkbtn" onClick=${() => setNewPartner(true)}>+ Add a new ${s.short.toLowerCase()}</button>${tried && errs.ref && html`<span className="err">Choose the partner who sent this client, so they get credit.</span>`}${f.ref && html`<span style=${{color:'var(--muted)',fontWeight:400}}>Assigned to ${partnerById[f.ref].owner}, who manages this partner.</span>`}</label>`}
        ${s?.family === 'referral' && html`<label className="full">Referred by client <span className="req">*</span><select id="f-client" value=${f.ref} onChange=${e => set('ref', e.target.value)}><option value="">Choose an existing client</option>${clients.map(c => html`<option key=${c.id} value=${c.id}>${c.name}</option>`)}</select>${tried && errs.ref && html`<span className="err">Choose the client who referred them.</span>`}</label>`}
        ${f.source === 'walkin' && html`<label>Showroom<select id="f-showroom" value=${f.showroom} onChange=${e => set('showroom', e.target.value)}>${SHOWROOMS.map(x => html`<option key=${x}>${x}</option>`)}</select></label>`}
        ${SUB[f.source] && html`<label>Sub-source<select id="f-sub" value=${f.sub} onChange=${e => set('sub', e.target.value)}><option value="">Choose</option>${SUB[f.source].map(x => html`<option key=${x}>${x}</option>`)}</select></label>`}
        <label>Interested in<input id="f-interest" value=${f.interest} onInput=${e => set('interest', e.target.value)} placeholder="Modular kitchen, wardrobes"/></label>
        <label>Budget (₹)<input id="f-value" inputMode="numeric" value=${f.value} onInput=${e => set('value', e.target.value.replace(/\D/g,''))} placeholder="350000"/></label>
        <label>Area<input id="f-area" value=${f.area} onInput=${e => set('area', e.target.value)} placeholder="Locality"/></label>
        ${s?.family !== 'partner' && html`<label>Owner<select id="f-owner" value=${f.owner} onChange=${e => set('owner', e.target.value)}>${OWNERS.map(o => html`<option key=${o}>${o}</option>`)}</select></label>`}
        <div className="form-foot"><button type="button" className="btn ghost" onClick=${close}>Cancel</button><button type="submit" className="btn primary">Add lead</button></div>
      </div>
    </form>
    ${newPartner && html`<${PartnerForm} init=${null} erp=${erp} close=${() => setNewPartner(false)} save=${async b => { const r = await call('POST', '/partners', {...b, type:f.source}, `${b.name} added as a partner.`); if (r?.id) set('ref', r.id); return !!r; }}/>`}
  </div>`;
}

function LostDialog({lead, close, pick}){
  return html`<div className="modal" role="dialog" aria-modal="true" aria-label="Lost reason">
    <div className="scrim" onClick=${close}></div>
    <div className="sheet" style=${{width:'min(400px,100%)'}}>
      <header><h2>Mark as lost</h2><p>Why is ${lead.name} not going ahead? This feeds the lost-reason report.</p></header>
      <div className="reasons">${LOST_REASONS.map(r => html`<button key=${r} className="btn" style=${{justifyContent:'flex-start'}} onClick=${() => pick(r)}>${r}</button>`)}<button className="btn ghost" onClick=${close}>Cancel</button></div>
    </div>
  </div>`;
}

const isCustomerPortal = /^\/c(\/|$)/.test(location.pathname);
if (isCustomerPortal) API.setAudience('customer');
ReactDOM.createRoot(document.getElementById('root')).render(isCustomerPortal ? html`<${CustomerApp} live=${true}/>` : html`<${App}/>`);
if ('serviceWorker' in navigator && location.protocol !== 'file:') window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
</script>

</body></html>
