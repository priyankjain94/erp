<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Make My Space CRM + Operations</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#24261E">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: dark olive rail + warm working canvas; board scrolls sideways inside its own frame. Brand: Make My Space kit. */
:root{
  --bg:#F4F0EA; --surface:#FFFFFF; --surface-2:#EDE6DA; --line:#E0D6C6; --line-2:#CDBEAA;
  --ink:#24261E; --ink-2:#3A3D31; --muted:#6B6F58;
  --rail:#24261E; --rail-2:#2F3227; --rail-ink:#E3D9C9; --rail-muted:#A8A48F;
  --accent:#A0784A; --accent-strong:#86602F; --accent-soft:#F1E6D6; --on-accent:#FFFFFF;
  --good:#4F7A4A; --good-soft:#E3EDDF; --warn:#A97424; --warn-soft:#F6EAD3; --crit:#A8483A; --crit-soft:#F5E1DD;
  --wa:#2F8A5B; --bubble-us:#E9E2D2; --bubble-auto:#F1E6D6; --bubble-them:#FFFFFF;
  --s-architect:#A0784A; --s-contractor:#6E5A8A; --s-agent:#3F7E8C; --s-walkin:#4B4F3C; --s-field:#8A6C2E; --s-online:#3D6FA8; --s-referral:#A8566B;
  --shadow:0 1px 2px rgba(36,38,30,.06),0 4px 14px rgba(36,38,30,.06);
  --f-display:"Jost","Noto Sans",system-ui,sans-serif;
  --f-body:"Inter","Noto Sans",system-ui,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#181A14; --surface:#22241D; --surface-2:#2B2E25; --line:#34372C; --line-2:#474B3D;
  --ink:#EDE6DA; --ink-2:#D9D0C0; --muted:#A8A48F;
  --rail:#111209; --rail-2:#1C1E16; --rail-ink:#E3D9C9; --rail-muted:#8F8B78;
  --accent:#C8A270; --accent-strong:#D9B886; --accent-soft:#3A3224; --on-accent:#1A1B14;
  --good:#8DB884; --good-soft:#26331F; --warn:#D9A955; --warn-soft:#3A2F1C; --crit:#E08A7C; --crit-soft:#3D2420;
  --wa:#5CC08A; --bubble-us:#33362B; --bubble-auto:#3A3224; --bubble-them:#2B2E25;
  --s-architect:#C8A270; --s-contractor:#A893C9; --s-agent:#79B8C6; --s-walkin:#B9BC9C; --s-field:#D2AF66; --s-online:#7FA9DB; --s-referral:#D98EA2;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#181A14; --surface:#22241D; --surface-2:#2B2E25; --line:#34372C; --line-2:#474B3D;
  --ink:#EDE6DA; --ink-2:#D9D0C0; --muted:#A8A48F;
  --rail:#111209; --rail-2:#1C1E16; --rail-ink:#E3D9C9; --rail-muted:#8F8B78;
  --accent:#C8A270; --accent-strong:#D9B886; --accent-soft:#3A3224; --on-accent:#1A1B14;
  --good:#8DB884; --good-soft:#26331F; --warn:#D9A955; --warn-soft:#3A2F1C; --crit:#E08A7C; --crit-soft:#3D2420;
  --wa:#5CC08A; --bubble-us:#33362B; --bubble-auto:#3A3224; --bubble-them:#2B2E25;
  --s-architect:#C8A270; --s-contractor:#A893C9; --s-agent:#79B8C6; --s-walkin:#B9BC9C; --s-field:#D2AF66; --s-online:#7FA9DB; --s-referral:#D98EA2;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;overflow:hidden}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
#root{height:100%}

.app{display:grid;grid-template-columns:228px minmax(0,1fr);height:100%}
.rail{background:var(--rail);color:var(--rail-ink);display:flex;flex-direction:column;padding:20px 14px 16px 16px;gap:22px;min-height:0}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand svg{flex:none}
.brand b{font-family:var(--f-display);font-weight:300;letter-spacing:.14em;font-size:13px;text-transform:uppercase;line-height:1.2}
.brand small{display:block;font-family:var(--f-display);font-weight:500;letter-spacing:.3em;font-size:9px;color:var(--rail-muted);margin-top:3px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;background:none;border:0;color:var(--rail-muted);padding:9px 10px;border-radius:8px;text-align:left;font-weight:500}
.nav button:hover{color:var(--rail-ink);background:var(--rail-2)}
.nav button[aria-current="page"]{color:var(--rail-ink);background:var(--rail-2)}
.nav button[aria-current="page"] svg{color:var(--accent)}
.nav .count{margin-left:auto;font-size:11px;background:var(--wa);color:#fff;border-radius:99px;padding:1px 7px;font-weight:600}
.rail-label{font-family:var(--f-display);font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--rail-muted);padding:0 10px;margin-bottom:6px}
.wa-status{margin-top:auto;border-top:1px solid var(--rail-2);padding:14px 10px 0;display:grid;gap:4px;font-size:12px;color:var(--rail-muted)}
.wa-status b{color:var(--rail-ink);font-weight:500;display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--wa);display:inline-block;flex:none}
.linkbtn{background:none;border:0;padding:0;color:var(--rail-muted);text-decoration:underline;text-underline-offset:3px;font-size:12px;justify-self:start;margin-top:6px}

.main{display:flex;flex-direction:column;min-width:0;min-height:0;height:100%}
.topbar{display:flex;align-items:center;gap:12px;padding:16px 24px 14px;border-bottom:1px solid var(--line);background:var(--bg);flex-wrap:wrap}
.topbar h1{font-family:var(--f-display);font-weight:300;font-size:22px;letter-spacing:.06em;text-transform:uppercase;margin:0;margin-right:auto;text-wrap:balance}
.topbar .eyebrow{display:block;font-family:var(--f-display);font-weight:500;font-size:10px;letter-spacing:.3em;color:var(--muted);margin-bottom:2px}
.view{flex:1;min-height:0;overflow:auto;padding:20px 24px 28px}
.view.board-view{display:flex;flex-direction:column;overflow:hidden;padding-bottom:12px}

.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-2);background:var(--surface);padding:8px 14px;border-radius:8px;font-weight:500;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-strong);border-color:var(--accent-strong)}
.btn.small{padding:5px 10px;font-size:12px}
.btn.ghost{background:transparent}
.btn.wa{background:var(--wa);border-color:var(--wa);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
.seg{display:inline-flex;background:var(--surface-2);border-radius:9px;padding:3px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:7px;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:0 10px;min-width:0;flex:0 1 260px}
.search input{border:0;background:none;outline:none;padding:8px 0;width:100%;min-width:0}
.search svg{color:var(--muted);flex:none}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;max-width:100%;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 11px;font-size:12px;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;color:var(--ink-2)}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.chip .n{opacity:.6;font-variant-numeric:tabular-nums}
select.sel{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;font-size:13px}

/* Board */
.board{flex:1;min-height:0;display:flex;gap:12px;overflow-x:auto;padding-bottom:8px}
.col{flex:0 0 272px;display:flex;flex-direction:column;min-height:0;background:var(--surface-2);border-radius:12px;border:1px solid transparent;transition:border-color .15s,background .15s}
.col.over{border-color:var(--accent);background:var(--accent-soft)}
.col.closed{flex-basis:232px}
.col-head{padding:12px 12px 8px;display:flex;align-items:baseline;gap:8px}
.col-head h2{font-family:var(--f-display);font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;margin:0}
.col-head .c{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.col-head .v{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.col-head .mark{width:8px;height:8px;border-radius:2px;flex:none;align-self:center}
.col-list{flex:1;overflow-y:auto;padding:4px 8px 10px;display:flex;flex-direction:column;gap:8px}
.col-empty{border:1.5px dashed var(--line-2);border-radius:10px;padding:16px;text-align:center;color:var(--muted);font-size:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:11px 12px;display:grid;gap:7px;cursor:grab;box-shadow:var(--shadow);text-align:left;width:100%}
.card:hover{border-color:var(--line-2)}
.card.dragging{opacity:.4}
.card-top{display:flex;align-items:center;gap:8px}
.card-top .name{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-top .wa-dot{margin-left:auto}
.card-meta{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-row{display:flex;align-items:center;gap:8px;justify-content:space-between;min-width:0}
.card-foot{display:flex;align-items:center;gap:8px}
.val{font-weight:600;font-variant-numeric:tabular-nums;font-size:13px;white-space:nowrap}
.avatar{margin-left:auto;width:24px;height:24px;border-radius:50%;background:var(--surface-2);color:var(--ink-2);display:grid;place-items:center;font-size:10px;font-weight:600;flex:none;letter-spacing:.02em}
.src{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:500;color:var(--ink-2);min-width:0}
.src .sw{width:8px;height:8px;border-radius:2px;flex:none}
.src span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.src .by{color:var(--muted);font-weight:400}
.due{font-size:11px;font-weight:600;padding:2px 7px;border-radius:99px;display:inline-flex;align-items:center;gap:4px;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.due.over{background:var(--crit-soft);color:var(--crit)}
.due.today{background:var(--warn-soft);color:var(--warn)}
.due.none{background:transparent;color:var(--crit);padding-left:0}
.wa-pill{font-size:11px;font-weight:600;color:var(--wa);display:inline-flex;align-items:center;gap:5px;white-space:nowrap}

/* Table */
.table-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:860px}
th{text-align:left;font-family:var(--f-display);font-weight:600;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--bg)}
td .sub{font-size:12px;color:var(--muted)}
td.r,th.r{text-align:right}

/* Dashboard */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:4px}
.kpi .l{font-family:var(--f-display);font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);font-weight:500}
.kpi .v{font-family:var(--f-display);font-size:30px;font-weight:300;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi.alert .v{color:var(--crit)}
.grid2{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;min-width:0}
.panel h3{font-family:var(--f-display);font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;margin:0 0 4px}
.panel .hint{color:var(--muted);font-size:12px;margin:0 0 14px}
.bars{display:grid;gap:10px}
.bar-row{display:grid;grid-template-columns:150px minmax(0,1fr) 92px;gap:10px;align-items:center;font-size:13px}
.bar-track{height:14px;background:var(--surface-2);border-radius:4px;overflow:hidden;display:flex}
.bar-track i{display:block;height:100%}
.bar-row .n{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px}
.bar-row .n b{color:var(--ink);font-weight:600}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.funnel{display:grid;gap:6px}
.f-row{display:grid;grid-template-columns:110px minmax(0,1fr) 34px;gap:10px;align-items:center;font-size:13px}
.f-bar{height:22px;background:var(--accent);opacity:.85;border-radius:4px;min-width:4px}
.f-row .n{font-variant-numeric:tabular-nums;text-align:right;font-weight:600}
.task-list{display:grid;gap:2px}
.task{display:flex;align-items:center;gap:10px;padding:9px 6px;border-radius:8px;border:0;background:none;text-align:left;width:100%}
.task:hover{background:var(--bg)}
.task .who{display:grid;min-width:0}
.task .who b{font-weight:600;font-size:13.5px}
.task .who span{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.task .due{margin-left:auto}
.stack{display:grid;gap:16px}

/* Drawer */
.scrim{position:fixed;inset:0;background:rgba(17,18,9,.42);z-index:40;animation:fade .15s}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(580px,100%);background:var(--bg);z-index:41;display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(0,0,0,.18);animation:slide .2s ease-out;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
@keyframes slide{from{transform:translateX(24px);opacity:0}}
@keyframes fade{from{opacity:0}}
.d-head{padding:18px 20px 14px;border-bottom:1px solid var(--line);display:grid;gap:10px;background:var(--surface)}
.d-title{display:flex;align-items:flex-start;gap:12px}
.d-title h2{font-family:var(--f-display);font-weight:400;font-size:22px;margin:0;line-height:1.15}
.d-title .phone{font-size:13px;color:var(--muted);user-select:all;font-variant-numeric:tabular-nums}
.icon-btn{border:1px solid var(--line);background:var(--surface);width:34px;height:34px;border-radius:8px;display:grid;place-items:center;flex:none}
.icon-btn:hover{border-color:var(--accent)}
.d-actions{display:flex;gap:6px;margin-left:auto}
.stepper{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.step{border:1px solid var(--line);background:var(--bg);padding:5px 10px;border-radius:6px;font-size:12px;font-weight:500;white-space:nowrap;color:var(--muted)}
.step.done{color:var(--ink-2);background:var(--surface-2);border-color:var(--surface-2)}
.step.cur{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.step.won.cur{background:var(--good);border-color:var(--good);color:#fff}
.step.lost.cur{background:var(--crit);border-color:var(--crit);color:#fff}
.tabs{display:flex;gap:18px;padding:0 20px;border-bottom:1px solid var(--line);background:var(--surface)}
.tabs button{border:0;background:none;padding:10px 0;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}
.d-body{flex:1;min-height:0;overflow:auto}

.chat{display:flex;flex-direction:column;height:100%;min-height:0}
.window{display:flex;align-items:center;gap:8px;padding:8px 16px;font-size:12px;border-bottom:1px solid var(--line)}
.window.open{color:var(--wa)}
.window.closed{color:var(--warn);background:var(--warn-soft)}
.msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:82%;padding:8px 12px 6px;border-radius:12px;font-size:13.5px;display:grid;gap:3px;border:1px solid var(--line)}
.msg.them{background:var(--bubble-them);align-self:flex-start;border-top-left-radius:4px}
.msg.us{background:var(--bubble-us);align-self:flex-end;border-top-right-radius:4px;border-color:transparent}
.msg.auto{background:var(--bubble-auto);align-self:flex-end;border-top-right-radius:4px;border-color:transparent}
.msg .meta{font-size:10.5px;color:var(--muted);justify-self:end;display:flex;gap:6px}
.msg .tpl{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600}
.day{align-self:center;font-size:11px;color:var(--muted);background:var(--surface-2);padding:2px 10px;border-radius:99px}
.composer{border-top:1px solid var(--line);padding:10px 12px 12px;display:grid;gap:8px;background:var(--surface)}
.quick{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.quick button{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:4px 10px;font-size:12px;white-space:nowrap;color:var(--ink-2)}
.quick button:hover{border-color:var(--accent)}
.compose-row{display:flex;gap:8px;align-items:flex-end}
.compose-row textarea{flex:1;resize:none;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 12px;min-height:40px;max-height:120px;outline:none}
.compose-row textarea:focus{border-color:var(--accent)}
.tpl-list{display:grid;gap:6px;max-height:210px;overflow:auto}
.tpl-opt{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 10px;text-align:left;display:grid;gap:2px}
.tpl-opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.tpl-opt b{font-size:12px;font-weight:600;font-family:ui-monospace,Menlo,monospace}
.tpl-opt span{font-size:12px;color:var(--muted)}
.tpl-opt em{font-style:normal;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:600}

.details{padding:18px 20px;display:grid;gap:18px}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 18px;margin:0}
.fields div{display:grid;gap:3px;min-width:0}
.fields dt{font-family:var(--f-display);font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);font-weight:500}
.fields dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.box{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--surface);display:grid;gap:10px}
.box h4{margin:0;font-family:var(--f-display);font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:600}
.row-btns{display:flex;gap:6px;flex-wrap:wrap}
.timeline{padding:18px 20px;display:grid;gap:0;margin:0;list-style:none}
.timeline li{display:grid;grid-template-columns:14px 1fr auto;gap:10px;padding:0 0 14px;position:relative;font-size:13px}
.timeline li::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--line-2);margin-top:6px;margin-left:3px}
.timeline li.auto::before{background:var(--accent)}

const DAY = 864e5, NOW = Date.now();

const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const parseYmd = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = n => ymd(new Date(today.getTime() + n*DAY));
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmtDate = s => { const d = parseYmd(s); return `${d.getDate()} ${MONTHS[d.getMonth()]}`; };

const minsAgo = m => NOW - m*60000;
const ago = t => { const m = Math.round((Date.now()-t)/60000); if (m < 1) return 'now'; if (m < 60) return m + 'm'; const h = Math.round(m/60); if (h < 24) return h + 'h'; return Math.round(h/24) + 'd'; };
const clock = t => new Date(t).toLocaleTimeString('en-IN', {hour:'numeric', minute:'2-digit'});
const dayLabel = t => { const d = new Date(t); d.setHours(0,0,0,0); const n = Math.round((today - d)/DAY); return n === 0 ? 'Today' : n === 1 ? 'Yesterday' : `${d.getDate()} ${MONTHS[d.getMonth()]}`; };
const inr = n => '₹' + Math.round(n).toLocaleString('en-IN');
const lakh = n => n >= 1e7 ? '₹' + (n/1e7).toFixed(2).replace(/\.?0+$/,'') + ' Cr' : n >= 1e5 ? '₹' + (n/1e5).toFixed(1).replace(/\.0$/,'') + ' L' : inr(n);

/* ---------- Login (team or customer) ---------- */
function LoginScreen({audience = 'staff', onLogin, title = 'Team login'}){
  const [phone, setPhone] = useState(''), [step, setStep] = useState(1), [code, setCode] = useState(''), [err, setErr] = useState(''), [info, setInfo] = useState(null), [busy, setBusy] = useState(false), [demo, setDemo] = useState([]);
  useEffect(() => { if (SERVER.demoMode || true) API.call('GET', '/auth/demo-users?audience=' + audience).then(r => setDemo(r.users || [])).catch(() => {}); }, []);
  const next = async e => { e.preventDefault(); setErr('');
    if (phone.replace(/\D/g,'').length < 10) return setErr('Enter your 10-digit mobile number.');
    setBusy(true);
    try { const r = await API.call('POST', '/auth/otp/request', {phone, audience}); setInfo(r); setStep(2); } catch(x){ setErr(x.message); }
    setBusy(false); };
  const verify = async e => { e.preventDefault(); setErr(''); setBusy(true);
    try { const r = await API.call('POST', '/auth/otp/verify', {phone, audience, code}); API.setToken(r.accessToken); await onLogin(r); } catch(x){ setErr(x.message); }
    setBusy(false); };
  return html`<div style=${{minHeight:'100%',display:'grid',placeItems:'center',padding:16,background:'var(--bg)',overflow:'auto'}}>
    <div className="sheet" style=${{width:'min(420px,100%)'}}>
      <header style=${{display:'flex',gap:12,alignItems:'center'}}><${Mark}/><div><h2>${title}</h2><p style=${{margin:0}}>Make My Space${audience === 'customer' ? ' · track your project' : ' CRM + Operations'}</p></div></header>
      ${step === 1 ? html`<form className="form" style=${{gridTemplateColumns:'1fr'}} onSubmit=${next} noValidate>
          <label>Mobile number (WhatsApp)<input inputMode="tel" autoFocus value=${phone} onInput=${e => setPhone(e.target.value)} placeholder="10-digit mobile"/></label>
          ${err && html`<span className="err">${err}</span>`}
          <button className="btn primary" type="submit" disabled=${busy} style=${{justifyContent:'center'}}>${busy ? 'Sending…' : 'Send OTP on WhatsApp'}</button>
          ${demo.length > 0 && html`<details style=${{fontSize:12,color:'var(--muted)'}}><summary>Demo numbers</summary><div style=${{display:'grid',gap:2,marginTop:6}}>${demo.map(u => html`<button type="button" key=${u.phone} className="linkbtn" style=${{color:'var(--muted)',textAlign:'left',marginTop:0}} onClick=${() => setPhone(u.phone)}>${u.name}${u.role ? ' · ' + (roleById[u.role]?.name || u.role) : ''} · ${u.phone}</button>`)}</div></details>`}
        </form>`
      : html`<form className="form" style=${{gridTemplateColumns:'1fr'}} onSubmit=${verify}>
          <div className="banner">Hi ${info.name}. We sent a code to ${info.phone} on WhatsApp.</div>
          ${info.devCode && html`<div className="banner warn">Demo only: the code is ${info.devCode}</div>`}
          <label>Code<input inputMode="numeric" autoFocus maxLength="8" value=${code} onInput=${e => setCode(e.target.value.replace(/\D/g,'').slice(0,8))} style=${{fontSize:22,letterSpacing:'.4em',textAlign:'center'}}/></label>
          ${err && html`<span className="err">${err}</span>`}
          <div className="inline"><button type="button" className="btn ghost" onClick=${() => { setStep(1); setCode(''); setErr(''); }}>Change number</button><button className="btn primary" type="submit" style=${{marginLeft:'auto'}} disabled=${code.length < 4 || busy}>Log in</button></div>
        </form>`}
    </div></div>`;
}

/* ---------- Installation team form ---------- */
function TeamForm({erp, ops, toast, team, close}){
  const [f, setF] = useState(team ? {name:team.name, phone:team.phone || '', members:(team.members || []).join(', '), skills:team.skills || ITEM_TYPES.map(t => t.id)} : {name:'', phone:'', members:'', skills:ITEM_TYPES.map(t => t.id)});
  const d = digits10(f.phone), clash = erp.users.find(u => digits10(u.phone) === d && (!team || u.id !== team.id));
  const ok = f.name.trim() && d.length === 10 && !clash && f.skills.length;
  const save = async () => {
    const body = {name:f.name.trim(), phone:d, members:f.members.split(',').map(x => x.trim()).filter(Boolean), skills:f.skills};
    const r = team ? await ops.updTeam(team.id, body, `${body.name}'s team updated.`) : await ops.addTeam(body);
    if (r) close();
  };
  return html`<div className="modal" role="dialog" aria-modal="true" aria-label="Installation team"><div className="scrim" onClick=${close}></div>
    <div className="sheet"><header><h2>${team ? 'Edit installation team' : 'Add installation team'}</h2><p>The team lead logs in to the Installer app with this WhatsApp number. Helpers are listed for the record and site entry.</p></header>
      <div className="form">
        <label>Team lead name<input autoFocus value=${f.name} onInput=${e => setF({...f, name:e.target.value})} placeholder="e.g. Imran"/></label>
        <label>Lead's WhatsApp<input inputMode="tel" value=${f.phone} onInput=${e => setF({...f, phone:e.target.value})} placeholder="10-digit mobile"/>${clash && html`<span className="err">Already used by ${clash.name}.</span>`}</label>
        <label className="full">Helpers (comma separated)<input value=${f.members} onInput=${e => setF({...f, members:e.target.value})} placeholder="e.g. Raju, Mohan"/></label>
        <div className="full" style=${{display:'grid',gap:6}}><span style=${{fontSize:12,fontWeight:500,color:'var(--ink-2)'}}>Can install</span>
          <div className="chips" style=${{flexWrap:'wrap'}}>${ITEM_TYPES.map(t => html`<button type="button" key=${t.id} className="chip" aria-pressed=${f.skills.includes(t.id)} onClick=${() => setF({...f, skills:f.skills.includes(t.id) ? f.skills.filter(x => x !== t.id) : [...f.skills, t.id]})}>${t.name}</button>`)}</div></div>
        <div className="form-foot">${team && html`<button type="button" className="btn ghost" style=${{marginRight:'auto',color:'var(--crit)'}} onClick=${async () => { if (await ops.updTeam(team.id, {active:false}, `${team.name} deactivated. Their open items now show as Needs an installer.`)) close(); }}>Deactivate team</button>`}<button type="button" className="btn ghost" onClick=${close}>Cancel</button><button type="button" className="btn primary" disabled=${!ok} onClick=${save}>${team ? 'Save' : 'Add team and send invite'}</button></div>
      </div></div></div>`;

    const nextInst = its.filter(i => !i.installDone && i.installer && PIDX(i.stage) >= PIDX('dispatch')).sort((a,b) => a.target < b.target ? -1 : 1)[0];
    const due = p.payments.filter(m => !m.received);

      <div className="mcard"><div className="card-row"><b>Your project</b><span className="meta">Target ${fmtDate(p.target)}</span></div>

      <button className="mcard" onClick=${() => setView('items')}><div className="card-row"><b>Your furniture</b><span className="meta">${its.length} pieces ›</span></div></button>
      <button className="mcard" onClick=${() => setView('pay')}><div className="card-row"><b>Payments</b><span className="meta">${due.length ? due.length + ' pending ›' : 'All paid ›'}</span></div></button>

      ${p.feedback && html`<div className="banner good">Thank you for rating us ${p.feedback.rating}/5.</div>`}

    else if (view === 'approve') screen = html`<${Phone} title="Approve drawings" sub=${p.customer} back=${back}>
      ${toApprove.map(i => { const wall = p.survey.rooms.find(r => r.code === i.room)?.walls.find(w => w.label === i.wall); return html`<div key=${i.id} className="mcard"><b>${typeById[i.type].name} · ${i.roomName}</b><span className="meta">Drawing ${latestDrawing(i).rev}${i.desc ? ' · ' + i.desc : ''}</span>${latestDrawing(i).url ? html`<a className="btn small" href=${latestDrawing(i).url} target="_blank" rel="noopener">Open drawing PDF</a>` : html`<${Elevation} it=${i} wall=${wall}/>`}

/* keep the shared user lists in step with the user table */
function syncTeam(users){
  const active = users.filter(u => u.active !== false).map(u => ({...u, roleName:u.title || roleById[u.role]?.name || u.role}));
  const all = users.map(u => ({...u, roleName:u.title || roleById[u.role]?.name || u.role}));
  TEAM.splice(0, TEAM.length, ...active);
  Object.keys(userById).forEach(k => delete userById[k]); all.forEach(u => { userById[u.id] = u; });
  INSTALLERS.splice(0, INSTALLERS.length, ...active.filter(u => u.role === 'installer'));
  DESIGNERS.splice(0, DESIGNERS.length, ...active.filter(u => u.role === 'designer'));
}

/* ---------- gates: what must be true before an item leaves its stage ---------- */
function gatesFor(it, p){
  const g = [], add = (ok, text, hard) => g.push({ok:!!ok, text, hard});
  if (!it || !p) return g;
  switch (it.stage){
    case 'survey': add(p.survey.status === 'submitted', 'Site survey submitted with every wall measured', false); break;
    case 'drawing': { const d = latestDrawing(it); add(d, 'Production drawing and packing list uploaded', true); add(d && d.approved, 'Customer approved the latest drawing', true); break; }
    case 'pi': { add(it.hwPI, 'Hardware PI raised', false); add(it.prodPI, 'Production PI raised', false); const m = p.payments.find(x => x.gate === 'order'); add(m && m.received, `Payment received · ${m ? m.label + ' (' + m.pct + '%)' : 'before order'}`, true); break; }
    case 'order': add(it.po, 'PO number entered', false); break;
    case 'dispatch': add(it.dispatch, 'Dispatch details entered (vehicle, boxes, date)', false); add(it.delivered, 'Material delivered at site', true); add(p.siteReady, 'Site ready: civil, electrical, painting, flooring done', true); break;
    case 'install': add(it.installDone, 'Installation completed with photos and checklist', true); add(!openSnags(it).length, 'No open snags', true); add(it.signedOff, 'Customer sign-off by WhatsApp OTP', true); break;
    case 'handover': add(true, 'Handover photos and documents shared', false); break;
  }
  return g;
}


/* =====================================================================
   API CLIENT — every change goes to the Make My Space server; the server
   enforces permissions and business rules and returns the fresh state.
   ===================================================================== */
const API = (() => {
  let token = null, audience = 'user', onAuthLost = () => {};
  const qKey = 'mms-offline-queue';
  const readQ = () => { try { return JSON.parse(localStorage.getItem(qKey)) || []; } catch(e){ return []; } };
  const writeQ = q => { try { localStorage.setItem(qKey, JSON.stringify(q)); } catch(e){} try { window.dispatchEvent(new Event('mms-queue')); } catch(e){} };
  async function refresh(){
    try {
      const r = await fetch('/api/v1/auth/refresh', {method:'POST', credentials:'same-origin', headers:{'Content-Type':'application/json'}, body:JSON.stringify({audience})});
      if (!r.ok) return false;
      token = (await r.json()).accessToken; return true;
    } catch(e){ return false; }
  }
  async function call(method, path, body, opts = {}){
    const doFetch = () => fetch('/api/v1' + path, {method, credentials:'same-origin', headers:{'Content-Type':'application/json', ...(token ? {Authorization:'Bearer ' + token} : {})}, body: body === undefined ? undefined : JSON.stringify(body)});
    let r;
    try { r = await doFetch(); }
    catch(e){
      if (opts.queue){ const q = readQ().filter(x => !(opts.dedupe && x.dedupe === opts.dedupe)); q.push({method, path, body, dedupe:opts.dedupe, at:Date.now()}); writeQ(q); return {queued:true}; }
      throw new Error('No internet connection. Please try again.');
    }
    if (r.status === 401 && !opts.noRefresh){
      if (await refresh()) r = await doFetch();
      else { onAuthLost(); const err = new Error('Please log in again.'); err.status = 401; throw err; }
    }
    const data = r.status === 204 ? {} : await r.json().catch(() => ({}));
    if (!r.ok){ const err = new Error(data.message || 'Something went wrong.'); err.status = r.status; err.data = data; throw err; }
    return data;
  }
  let flushing = false;
  async function flush(){
    if (flushing || !navigator.onLine) return; const q = readQ(); if (!q.length) return;
    flushing = true; const rest = [];
    for (const x of q){ try { await call(x.method, x.path, x.body); } catch(e){ if (!e.status) rest.push(x); } }
    writeQ(rest); flushing = false;
  }
  window.addEventListener('online', flush); setInterval(flush, 20000);
  return { call, refresh, flush, pending: () => readQ().length, setToken: t => { token = t; }, setAudience: a => { audience = a; }, onAuthLost: fn => { onAuthLost = fn; } };
})();

async function uploadDataUrl(dataUrl){
  const blob = await (await fetch(dataUrl)).blob();
  const type = blob.type || 'image/jpeg';
  const slot = await API.call('POST', '/uploads', {contentType:type, size:blob.size});
  const r = await fetch(slot.uploadUrl, {method:'PUT', body:blob, headers:{'Content-Type':type}});
  if (!r.ok) throw new Error('Upload failed');
  return slot; // {ref, viewUrl}
}

  return n;
}

/* ---------- operations used by every screen (same names as the tested prototype) ---------- */
function makeOps(erp, setErp, toast, leads, crm, app){
  const me = erp.me;
  const apply = res => { if (res && res.state) app.applyState(res.state); return res; };
  const run = async (method, path, body, msg, opts) => {
    try { const res = apply(await API.call(method, path, body, opts)); if (res && res.queued) toast('Saved on this phone. It will sync when the internet is back.'); else if (msg) toast(typeof msg === 'function' ? msg(res) : msg); return res || {}; }
    catch(e){ toast(e.message || 'Something went wrong.'); return null; }
  };
  const timers = app.timers, pend = app.pending;
  const later = (key, fn, ms) => { clearTimeout(timers[key]); timers[key] = setTimeout(async () => { delete timers[key]; await fn(); if (!Object.keys(timers).length) app.flushDeferred(); }, ms); };
  const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
  const E = () => app.cur();
  const ops = {
    me,
    gates: it => gatesFor(it, E().projects.find(p => p.id === it.projectId)),
    async setMe(id){
      if (!id){ try { await API.call('POST', '/auth/logout'); } catch(e){} app.loggedOut(); return; }
      try { const r = await API.call('POST', '/auth/demo-switch', {userId:id}); API.setToken(r.accessToken); await app.reload(); toast('Now using the app as ' + uname(id) + '.'); } catch(e){ toast(e.message); }
    },
    async moveItem(id, dir, reason){
      const it = E().items.find(i => i.id === id);
      try {
        const res = apply(await API.call('POST', `/items/${id}/transition`, {direction:dir, reason:reason || ''}));
        const to = pstById[res.to];
        toast(dir === 'back' ? `${it.code} sent back to ${to.short}.` : `${it.code} moved to ${to.short}.${res.flags && res.flags.length ? ' Flagged amber.' : ''}`);
        return true;
      } catch(e){ toast(e.message); return false; }
    },
    updItem(id, fn){
      const before = E().items.find(i => i.id === id); if (!before) return;
      const after = clone(before); fn(after, E());
      setErp(s => ({...s, items:s.items.map(i => i.id === id ? after : i)}));
      const patch = {};
      for (const k of ['owner','target','hwPI','prodPI','po','delivered']) if (!same(before[k], after[k])) patch[k] = after[k];
      if (!same(before.dispatch, after.dispatch) && after.dispatch) patch.dispatch = {vehicle:after.dispatch.vehicle || '', boxes:after.dispatch.boxes === '' || after.dispatch.boxes == null ? null : Number(after.dispatch.boxes), date:after.dispatch.date || null};
      if (Object.keys(patch).length){
        pend['item:' + id] = {...(pend['item:' + id] || {}), ...patch};
        const typing = 'po' in patch || 'dispatch' in patch;
        later('item:' + id, () => { const p = pend['item:' + id]; delete pend['item:' + id]; return run('PATCH', `/items/${id}`, p); }, typing ? 700 : 0);
      }
      if (after.drawings.length > before.drawings.length) run('POST', `/items/${id}/drawings`, {}, `Drawing R${after.drawings.length - 1} uploaded with packing list.`);
      else if (after.drawings.length && !before.drawings[before.drawings.length - 1]?.approved && after.drawings[after.drawings.length - 1].approved) run('POST', `/items/${id}/drawings/approve`, {}, 'Customer approval recorded.');
      after.boxes.forEach((b, i) => { if (before.boxes[i] && before.boxes[i].got !== b.got) run('POST', `/items/${id}/boxes/${b.n}`, {got:b.got}, null, {queue:true, dedupe:`box:${id}:${b.n}`}); });
    },
    sendDrawing: id => run('POST', `/items/${id}/drawings/send`, {}, 'Sent to the customer on WhatsApp with an Approve button.'),
    updProject(id, fn){
      const before = E().projects.find(p => p.id === id); if (!before) return;
      const after = clone(before); fn(after, E());
      setErp(s => ({...s, projects:s.projects.map(p => p.id === id ? after : p)}));
      after.payments.forEach((m, i) => { if (before.payments[i] && before.payments[i].received !== m.received) run('POST', `/projects/${id}/payments/${m.id}`, {received:m.received}); });
      if (before.siteReady !== after.siteReady) run('PATCH', `/projects/${id}`, {siteReady:after.siteReady});
      if (before.notes !== after.notes) later('notes:' + id, () => run('PATCH', `/projects/${id}`, {notes:after.notes}), 800);
      if (!same(before.survey.rooms, after.survey.rooms)) {
        app.surveyDraft[id] = after.survey.rooms;
        later('survey:' + id, () => API.call('PUT', `/surveys/${id}/draft`, {rooms:cleanRooms(app.surveyDraft[id])}, {queue:true, dedupe:'survey:' + id}).catch(e => toast(e.message)), 900);
      }
      if (!same(before.feedback, after.feedback) && after.feedback) run('POST', `/projects/${id}/feedback`, {rating:after.feedback.rating, comment:after.feedback.comment || ''});
    },
    assign: (itemIds, installer, target) => run('POST', '/assignments', {itemIds, installer, target:target || null}, res => `${itemIds.length} item${itemIds.length > 1 ? 's' : ''} assigned to ${uname(installer)}. WhatsApp sent.${res.warning ? ' ' + res.warning : ''}`),
    addTask: f => run('POST', '/tasks', {title:f.title, projectId:f.projectId || null, itemId:f.itemId || null, assignee:f.assignee, deadline:f.deadline, priority:f.priority || 'normal', proof:f.proof || '', repeat:f.repeat || ''}, `Task assigned to ${uname(f.assignee)}. WhatsApp sent with Open / Start buttons.`),
    taskDo(id, action, data = {}){
      const t0 = E().tasks.find(x => x.id === id);
      const msg = {start:'Task started.', done:`Done: ${t0?.title}${t0?.repeat ? '. Next one scheduled.' : '.'}`, block:'Marked blocked. Reminders paused; assigner notified on WhatsApp.', unblock:'Unblocked.', handover:`Handed over to ${uname(data.to)}. WhatsApp sent.`, remind:'Reminder sent on WhatsApp.', deadline:'Deadline changed.'}[action];
      return run('POST', `/tasks/${id}/${action}`, data, msg);
    },
    async convert(lead, f){
      const res = lead
        ? await run('POST', `/leads/${lead.id}/convert`, {pm:f.pm, target:f.target, surveyDate:f.surveyDate, advance:!!f.advance, address:f.address})
        : await run('POST', '/projects', {customer:f.customer, phone:f.phone, address:f.address, value:Number(f.value) || 0, pm:f.pm, target:f.target, surveyDate:f.surveyDate, advance:!!f.advance});
      if (res && res.code) toast(`${res.code} created. Survey task sent to the surveyor${lead ? ', welcome message sent to the customer' : ''}.`);
      return res ? res.id : null;
    },
    async checkIn(pid){ const g = await geo(); return run('POST', `/surveys/${pid}/check-in`, g, 'Checked in. Survey timer started.', {queue:true}); },
    async submitSurvey(pid, sign){
      clearTimeout(timers['survey:' + pid]); delete timers['survey:' + pid];
      const rooms = E().projects.find(p => p.id === pid).survey.rooms;
      return run('POST', `/surveys/${pid}/submit`, {signed:!!sign, rooms:cleanRooms(rooms)}, res => `Survey submitted. ${res.created} items created, designer tasks assigned, customer updated on WhatsApp.`);
    },
    async startWork(id){ const g = await geo(); return run('POST', `/items/${id}/work/start`, g, null, {queue:true}); },
    pauseWork: (id, reason) => run('POST', `/items/${id}/work/pause`, {reason}, `Paused: ${reason}. Timer stopped.`, {queue:true}),
    async requestSignoff(id, checklist, photo){
      let ref = photo;
      if (photo && photo.startsWith('data:')) { try { ref = (await uploadDataUrl(photo)).ref; } catch(e){ toast('Photo upload failed. Check the internet and try again.'); return null; } }
      return run('POST', `/items/${id}/complete/request-otp`, {checklist, photo:ref});
    },
    verifySignoff: (id, code) => run('POST', `/items/${id}/complete/verify`, {code}, res => res.heldBySnags ? `Installed. ${res.heldBySnags} snag open, so it stays in Installation until fixed.` : 'Installed and signed off. Moved to Handover; the PM is notified.'),
    async raiseSnag(id, s){
      let photo = s.photo || null;
      if (photo && photo.startsWith('data:')) { try { photo = (await uploadDataUrl(photo)).ref; } catch(e){ photo = null; } }
      return run('POST', `/items/${id}/snags`, {type:s.type, part:s.part, note:s.note || '', photo}, 'Snag raised. Reorder task sent to purchase on WhatsApp.', {queue:true});
    },
    advanceSnag: (id, sid) => run('POST', `/snags/${sid}/advance`, {}),
    /* admin */
    addUser: f => run('POST', '/users', f, `${f.name} added. Login invite sent on WhatsApp.`),
    updUser: (id, patch, msg) => run('PATCH', `/users/${id}`, patch, msg),
    setPerm: (role, perm, allowed) => run('PUT', `/roles/${role}/permissions`, {perm, allowed}),
    resetRoles: () => run('POST', '/roles/reset', {}, 'Access reset to defaults.'),
    addTeam: f => run('POST', '/teams', f, `Team ${f.name} added. Login invite sent on WhatsApp.`),
    updTeam: (id, patch, msg) => run('PATCH', `/teams/${id}`, patch, msg)
  };
  return ops;
}
function cleanRooms(rooms){
  return (rooms || []).map(r => ({id:r.id, name:r.name, code:r.code, ceiling:Number(r.ceiling) || 2900, floor:r.floor || '', shape:r.shape || 'rect',
    walls:r.walls.map(w => ({label:w.label, w:w.w === '' ? undefined : w.w, h:w.h === '' ? undefined : w.h, photo:w.photo || null, notes:w.notes || '', obs:(w.obs || []).map(o => ({type:o.type, left:Number(o.left) || 0, floor:Number(o.floor) || 0, w:Number(o.w), h:Number(o.h)}))})),
    items:(r.items || []).map(x => ({type:x.type, wall:x.wall, desc:x.desc || ''}))}));
}

function OpsDashboard({erp, ui, ops}){
  const live = erp.items.filter(i => i.stage !== 'closed');
  const late = live.filter(i => itemHealth(i) === 'late').sort((a,b) => a.target < b.target ? -1 : 1);
  const openT = erp.tasks.filter(t => t.status !== 'done');
  const overdueT = openT.filter(t => daysFrom(t.deadline) < 0 && t.status !== 'blocked');
  const snags = erp.items.flatMap(i => openSnags(i).map(s => ({...s, it:i})));
  const pend = erp.projects.flatMap(p => p.payments.filter(m => !m.received).map(m => ({...m, p})));
  const dueNow = pend.filter(m => { const items = erp.items.filter(i => i.projectId === m.p.id); return m.gate === 'order' ? items.some(i => i.stage === 'pi') : m.label === 'Before dispatch' ? items.some(i => i.stage === 'order' || i.stage === 'dispatch') : m.label === 'On handover' ? items.some(i => i.stage === 'handover') : false; });
  const byPerson = TEAM.map(u => ({u, n:overdueT.filter(t => t.assignee === u.id).length})).filter(x => x.n).sort((a,b) => b.n - a.n);
  const maxS = Math.max(...PSTAGES.map(s => live.filter(i => i.stage === s.id).length), 1);
  return html`<section className="view">
    <p style=${{margin:'0 0 14px',color:'var(--muted)'}}>${live.length} items in progress across ${erp.projects.filter(p => erp.items.some(i => i.projectId === p.id && i.stage !== 'closed') || p.survey.status !== 'submitted').length} projects. ${late.length} items are past their target date and ${overdueT.length} tasks are overdue.</p>

      <div className="kpi"><span className="l">Items in progress</span><span className="v">${live.length}</span><span className="s">${erp.items.filter(i => i.stage === 'install').length} at installation</span></div>
      <div className=${'kpi' + (overdueT.length ? ' alert' : '')}><span className="l">Overdue tasks</span><span className="v">${overdueT.length}</span><span className="s">${openT.filter(t => t.status === 'blocked').length} blocked</span></div>
      <div className=${'kpi' + (snags.length ? ' alert' : '')}><span className="l">Open snags</span><span className="v">${snags.length}</span><span className="s">${late.length} items late</span></div>
      <div className="kpi"><span className="l">Payments to collect now</span><span className="v">${lakh(dueNow.reduce((s,m) => s + m.amount, 0))}</span><span className="s">${dueNow.length} milestones due</span></div>
    </div>
    <div className="grid2">
      <div className="stack">
        <div className="panel"><h3>Items by stage</h3><p className="hint">Every wardrobe, kitchen and unit moves on its own. Bars show items waiting in each stage now.</p>

            return html`<div className="bar-row" key=${s.id}><span>${s.name}</span><div className="bar-track"><i style=${{width:((c.length-lt)/maxS*100)+'%', background:s.color}}></i><i style=${{width:(lt/maxS*100)+'%', background:'var(--crit)'}}></i></div><span className="n"><b>${c.length}</b>${lt ? ` · ${lt} late` : ''}</span></div>`; })}</div>
          <div className="legend"><span><i style=${{background:'var(--crit)'}}></i>Past target date</span></div>
        </div>
        <div className="panel"><h3>Late items</h3><p className="hint">Past target date, oldest first. Open one to see what is holding it.</p>
          <div className="task-list">${late.length ? late.map(i => { const p = erp.projects.find(x => x.id === i.projectId);
            return html`<button className="task" key=${i.id} onClick=${() => ui.openItem(i.id)}><${Av} id=${i.owner}/><span className="who"><b className="mono" style=${{fontSize:12.5}}>${i.code} · ${typeById[i.type].name}</b><span>${p.customer} · ${pstById[i.stage].name} · ${uname(i.owner)}</span></span><span className="due over">${-daysFrom(i.target)}d late</span></button>`; }) : html`<p className="hint">Nothing late.</p>`}</div>
        </div>
      </div>
      <div className="stack">
        <div className="panel"><h3>Overdue tasks by person</h3><p className="hint">WhatsApp reminders repeat daily; the assigner is told after 2 days.</p>
          <div className="task-list">${byPerson.length ? byPerson.map(x => html`<button className="task" key=${x.u.id} onClick=${() => ui.go('tasks', {person:x.u.id})}><${Av} id=${x.u.id}/><span className="who"><b>${x.u.name}</b><span>${x.u.roleName}</span></span><span className="due over">${x.n} overdue</span></button>`) : html`<p className="hint">No overdue tasks.</p>`}</div>
        </div>
        <div className="panel"><h3>Open snags</h3><p className="hint">An item cannot complete until its snags are fixed.</p>
          <div className="task-list">${snags.length ? snags.map(s => html`<button className="task" key=${s.id} onClick=${() => ui.openItem(s.it.id)}><span className="pill crit">${s.type}</span><span className="who"><b>${s.part}</b><span className="mono">${s.it.code} · ${SNAG_LABEL[s.status]}</span></span><span className="due">${ago(s.at)} ago</span></button>`) : html`<p className="hint">No open snags.</p>`}</div>
        </div>

function SketchSVG({r, size = 220, active}){
  const walls = r.walls, n = walls.length;
  if (r.shape === 'L' && n === 6){
    const pts = [[20,20],[200,20],[200,110],[120,110],[120,200],[20,200]];
    return html`<svg viewBox="0 0 220 220" width=${size} height=${size} aria-label="Room sketch"><polygon points=${pts.map(p => p.join(',')).join(' ')} fill="var(--surface-2)" stroke="var(--ink-2)" strokeWidth="2"/>
      ${pts.map((a,i) => { const b = pts[(i+1)%6], mx = (a[0]+b[0])/2, my = (a[1]+b[1])/2; return html`<g key=${i}><circle cx=${mx} cy=${my} r="11" fill=${active === walls[i].label ? 'var(--accent)' : 'var(--ink)'}/><text x=${mx} y=${my+4} textAnchor="middle" fontSize="11" fontWeight="600" fill="var(--bg)">${walls[i].label}</text></g>`; })}
      <rect x="40" y="194" width="40" height="12" fill="var(--bg)"/><text x="60" y="216" textAnchor="middle" fontSize="9" fill="var(--muted)">door</text></svg>`;
  }
  const cx = 110, cy = 110, R = 82;
  const pts = walls.map((_,i) => { const a = Math.PI/2 + (i * 2*Math.PI/n) + Math.PI/n; return [cx + R*Math.cos(a) * (n === 4 ? 1.12 : 1), cy + R*Math.sin(a) * (n === 4 ? 1.12 : 1)]; });
  return html`<svg viewBox="0 0 220 220" width=${size} height=${size} aria-label="Room sketch"><polygon points=${pts.map(p => p.map(v => v.toFixed(1)).join(',')).join(' ')} fill="var(--surface-2)" stroke="var(--ink-2)" strokeWidth="2"/>
    ${pts.map((a,i) => { const b = pts[(i+1)%n], mx = (a[0]+b[0])/2, my = (a[1]+b[1])/2; return html`<g key=${i}><circle cx=${mx} cy=${my} r="11" fill=${active === walls[i].label ? 'var(--accent)' : 'var(--ink)'}/><text x=${mx} y=${my+4} textAnchor="middle" fontSize="11" fontWeight="600" fill="var(--bg)">${walls[i].label}</text></g>`; })}
    <text x="110" y="214" textAnchor="middle" fontSize="9" fill="var(--muted)">Wall A has the door · clockwise</text></svg>`;
}
const Thumb = ({src}) => src && src !== 'sample' ? html`<img className="thumb" src=${src} alt="Wall photo"/>` : html`<span className="thumb">${src ? 'photo' : '—'}</span>`;
function SurveyView({p}){

/* ---------- Item detail ---------- */
function Elevation({it, wall}){
  const W = wall ? wall.w : 2400, H = wall ? wall.h : 2900, sc = 300 / Math.max(W, H);
  const uw = Math.min(W - 200, it.type === 'VN' ? 900 : it.type === 'TV' ? 2400 : W - 300), uh = it.type === 'VN' ? 600 : it.type === 'TV' ? 500 : it.type === 'KT' ? 850 : Math.min(H - 300, 2400);
  const ux = (W - uw) / 2, uy = it.type === 'VN' ? 850 : it.type === 'TV' ? 450 : it.type === 'KT' ? 0 : 0;
  const doors = Math.max(1, Math.round(uw / 600));
  return html`<svg className="elev" viewBox=${`0 0 ${W*sc + 60} ${H*sc + 50}`} role="img" aria-label=${'Elevation of ' + it.code}>

const EVT = {assigned:'Assigned', seen:'Seen', started:'Started', handover:'Handed over', reminded:'WhatsApp reminder', blocked:'Blocked', done:'Done', deadline:'Deadline changed'};
function reminderPlan(erp){
  const out = [];
  erp.tasks.filter(t => t.status !== 'done').forEach(t => {
    const d = daysFrom(t.deadline);
    if (t.status === 'blocked') { out.push({time:'09:30', to:t.assigner, t, kind:'Blocked', text:`${uname(t.assignee)} is blocked: ${t.blockedReason}`}); return; }
    if (d === 1) out.push({time:'10:00', to:t.assignee, t, kind:'Due tomorrow', text:'Due tomorrow'});
    if (d === 0) out.push({time:'09:30', to:t.assignee, t, kind:'Due today', text:'Due today'});
    if (d < 0) out.push({time:'10:00', to:t.assignee, t, kind:'Overdue', text:`Overdue by ${-d} day${d < -1 ? 's' : ''}`});
    if (d <= -2) out.push({time:'10:05', to:t.assigner, t, kind:'Escalation', text:`${uname(t.assignee)} is ${-d} days late`});
  });
  return out.sort((a,b) => a.time < b.time ? -1 : 1);
}

function compressPhoto(file, cb){
  const r = new FileReader();
  r.onload = () => { const img = new Image(); img.onload = () => { const s = Math.min(1, 640 / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width*s); c.height = Math.round(img.height*s); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); cb(c.toDataURL('image/jpeg', 0.6)); }; img.src = r.result; };
  r.readAsDataURL(file);
}

    const wi = r.walls.findIndex(w => w.label === scr.label), w = r.walls[wi], done = p.survey.status === 'submitted';
    const setW = (k, v) => updRoom(y => { y.walls[wi][k] = v; });
    screen = html`<${Phone} title=${`${r.name} · Wall ${w.label}`} sub=${wi === 0 ? 'Wall with the entry door' : 'Clockwise from wall A'} back=${() => setScr({n:'room', pid:p.id, rid:r.id})} right=${html`<span className="wall-letter sm">${w.label}</span>`}
      foot=${html`<button className="big" disabled=${wi === 0} onClick=${() => setScr({...scr, label:r.walls[wi-1].label})}>‹ ${wi > 0 ? r.walls[wi-1].label : ''}</button><button className="big pri" onClick=${() => wi < r.walls.length - 1 ? setScr({...scr, label:r.walls[wi+1].label}) : setScr({n:'room', pid:p.id, rid:r.id})}>${wi < r.walls.length - 1 ? 'Next: wall ' + r.walls[wi+1].label : 'Done'}</button>`}>
      <${PhotoBox} src=${photoSrc(w.photo, w.photoUrl)} label=${'Wide photo of wall ' + w.label} onPick=${d => { setW('photo', d); uploadDataUrl(d).then(sl => updRoom(y => { const ww = y.walls.find(z => z.label === w.label); if (ww && ww.photo === d){ ww.photo = sl.ref; ww.photoUrl = sl.viewUrl; } })).catch(() => {}); }}/>

      <div className="mm">
        <label>Width (mm)<input inputMode="numeric" value=${w.w} onInput=${e => setW('w', e.target.value.replace(/\D/g,''))} placeholder="e.g. 3600" disabled=${done}/></label>
        <label>Height (mm)<input inputMode="numeric" value=${w.h} onInput=${e => setW('h', e.target.value.replace(/\D/g,''))} placeholder="2900" disabled=${done}/></label>
      </div>
      <div className="mcard"><div className="card-row"><b>Obstructions</b>${!done && html`<button className="btn small" onClick=${() => setSheet({n:'obs', type:'Window', left:'', floor:'', w:'', h:'', wi})}><${Icon} n="plus" s=${14}/>Add</button>`}</div>
        ${w.obs.length ? w.obs.map((o,i) => html`<div key=${i} className="mrow" style=${{fontSize:13}}><span className="grow"><b>${o.type}</b> · ${o.w}×${o.h} mm, ${o.left} from left, ${o.floor} up</span>${!done && html`<button className="btn small ghost" onClick=${() => updRoom(y => y.walls[wi].obs.splice(i,1))}>✕</button>`}</div>`) : html`<span className="meta">Window, door, switchboard, AC point, plumbing, beam…</span>`}</div>
      <label style=${{display:'grid',gap:4,fontSize:12,fontWeight:500}}>Notes<textarea className="inp" rows="2" value=${w.notes} onInput=${e => setW('notes', e.target.value)} placeholder="e.g. Wall not plumb, 8 mm out at top" disabled=${done}></textarea></label>
    <//>`;
  }

  else if (scr.n === 'review'){
    const errs = [], warns = [];
    p.survey.rooms.forEach(rm => {
      rm.walls.forEach(w => { const miss = [!w.photo && 'photo', !(Number(w.w) > 0) && 'width', !(Number(w.h) > 0) && 'height'].filter(Boolean); if (miss.length) errs.push(`${rm.name} · wall ${w.label}: ${miss.join(', ')} missing`); });
      if (rm.walls.length === 4){ [[0,2],[1,3]].forEach(([a,b]) => { const d = Math.abs(Number(rm.walls[a].w) - Number(rm.walls[b].w)); if (rm.walls[a].w && rm.walls[b].w && d > 20) warns.push(`${rm.name}: walls ${rm.walls[a].label} and ${rm.walls[b].label} differ by ${d} mm. Recheck, or note that the room is out of square.`); }); }
      if (!rm.items.length) warns.push(`${rm.name}: no furniture tagged.`);
    });
    const n = p.survey.rooms.reduce((s,rm) => s + rm.items.length, 0);
    screen = html`<${Phone} title="Review and submit" sub=${p.customer} back=${() => setScr({n:'job', pid:p.id})}
      foot=${html`<button className="big go" disabled=${errs.length > 0 || !n} onClick=${() => { ops.submitSurvey(p.id, sheet === 'signed'); setSheet(null); setScr({n:'job', pid:p.id}); }}>Submit survey</button>`}>
      <div className=${'banner ' + (errs.length ? 'crit' : 'good')}>${errs.length ? `${errs.length} thing${errs.length > 1 ? 's' : ''} to fix before submitting.` : `All ${p.survey.rooms.reduce((s,rm) => s + rm.walls.length, 0)} walls have a photo and measurements. ${n} furniture items will be created.`}</div>
      ${errs.map((e,i) => html`<div key=${i} className="mcard" style=${{borderColor:'var(--crit)'}}><span style=${{fontSize:13}}>${e}</span></div>`)}
      ${warns.map((e,i) => html`<div key=${'w'+i} className="mcard" style=${{borderColor:'var(--warn)'}}><span style=${{fontSize:13,color:'var(--warn)'}}>${e}</span></div>`)}
      ${!n && html`<div className="banner warn">Tag at least one piece of furniture so items can be created.</div>`}
      <div className="mcard"><b>Customer signature (optional)</b><${SignPad} onSigned=${() => setSheet('signed')}/></div>
      <span className="meta" style=${{fontSize:12,color:'var(--muted)'}}>On submit: survey PDF is attached to ${p.code}, items move to Production drawing, designers get tasks, and the customer gets a WhatsApp update.</span>
    <//>`;
  } else screen = null;

  // bottom sheets
  let overlay = null;
  if (sheet && sheet.n === 'room') overlay = html`<div className="sheet-m" onClick=${e => e.target === e.currentTarget && setSheet(null)}><div className="in">
    <h3>Add room</h3>
    <div className="presets">${ROOM_PRESETS.map(([nm, code]) => html`<button key=${code} aria-pressed=${sheet.code === code} onClick=${() => setSheet({...sheet, name:nm, code})}>${nm}</button>`)}</div>
    <div className="mm"><label className="full">Room name<input value=${sheet.name} onInput=${e => setSheet({...sheet, name:e.target.value, code:sheet.code || e.target.value.replace(/[^A-Za-z]/g,'').slice(0,3).toUpperCase()})} placeholder="or type a name"/></label>
      <label>Shape<select value=${sheet.shape} onChange=${e => setSheet({...sheet, shape:e.target.value, count:e.target.value === 'L' ? 6 : e.target.value === 'rect' ? 4 : sheet.count})}><option value="rect">Rectangle · 4 walls</option><option value="L">L-shape · 6 walls</option><option value="custom">Other</option></select></label>
      ${sheet.shape === 'custom' ? html`<label>Number of walls<input inputMode="numeric" value=${sheet.count} onInput=${e => setSheet({...sheet, count:Math.min(8, Math.max(3, Number(e.target.value.replace(/\D/g,'')) || 3))})}/></label>` : html`<label>Ceiling (mm)<input inputMode="numeric" value=${sheet.ceiling} onInput=${e => setSheet({...sheet, ceiling:e.target.value.replace(/\D/g,'')})}/></label>`}
      <label className="full">Floor<select value=${sheet.floor} onChange=${e => setSheet({...sheet, floor:e.target.value})}>${FLOORS.map(f => html`<option key=${f}>${f}</option>`)}</select></label></div>
    <div className="inline"><button className="big" onClick=${() => setSheet(null)}>Cancel</button><button className="big pri" disabled=${!sheet.name.trim()} onClick=${() => {
      const code = (sheet.code || 'RM').toUpperCase(), used = p.survey.rooms.filter(x => x.code.startsWith(code)).length, rc = used ? code.slice(0,2) + (used + 1) : code;
      const nr = {id:'R' + Date.now().toString(36), name:sheet.name.trim(), code:rc, ceiling:Number(sheet.ceiling) || 2900, floor:sheet.floor, shape:sheet.shape, walls:LETTERS.slice(0, sheet.count).map(l => ({label:l, w:'', h:String(Number(sheet.ceiling) || 2900), photo:null, obs:[], notes:''})), items:[]};
      ops.updProject(p.id, x => { x.survey.rooms.push(nr); }); setSheet(null); setScr({n:'room', pid:p.id, rid:nr.id}); }}>Add room</button></div>
  </div></div>`;
  if (sheet && sheet.n === 'obs') overlay = html`<div className="sheet-m" onClick=${e => e.target === e.currentTarget && setSheet(null)}><div className="in">
    <h3>Obstruction on wall ${r.walls[sheet.wi].label}</h3>
    <div className="mm"><label className="full">Type<select value=${sheet.type} onChange=${e => setSheet({...sheet, type:e.target.value})}>${OBSTRUCTIONS.map(o => html`<option key=${o}>${o}</option>`)}</select></label>
      ${[['left','From left corner (mm)'],['floor','Height from floor (mm)'],['w','Width (mm)'],['h','Height (mm)']].map(([k,l]) => html`<label key=${k}>${l}<input inputMode="numeric" value=${sheet[k]} onInput=${e => setSheet({...sheet, [k]:e.target.value.replace(/\D/g,'')})}/></label>`)}</div>
    <div className="inline"><button className="big" onClick=${() => setSheet(null)}>Cancel</button><button className="big pri" disabled=${!sheet.w || !sheet.h} onClick=${() => { const o = {type:sheet.type, left:Number(sheet.left)||0, floor:Number(sheet.floor)||0, w:Number(sheet.w), h:Number(sheet.h)}; updRoom(y => y.walls[sheet.wi].obs.push(o)); setSheet(null); }}>Add</button></div>
  </div></div>`;
  if (sheet && sheet.n === 'item') overlay = html`<div className="sheet-m" onClick=${e => e.target === e.currentTarget && setSheet(null)}><div className="in">
    <h3>Tag furniture in ${r.name}</h3>
    <div className="presets">${ITEM_TYPES.map(t => html`<button key=${t.id} aria-pressed=${sheet.type === t.id} onClick=${() => setSheet({...sheet, type:t.id})}>${t.name}</button>`)}</div>
    <div className="mm"><label>On wall<select value=${sheet.wall} onChange=${e => setSheet({...sheet, wall:e.target.value})}>${r.walls.map(w => html`<option key=${w.label}>${w.label}</option>`)}</select></label><label>Short note<input value=${sheet.desc} onInput=${e => setSheet({...sheet, desc:e.target.value})} placeholder="e.g. sliding, with loft"/></label></div>
    <div className="inline"><button className="big" onClick=${() => setSheet(null)}>Cancel</button><button className="big pri" onClick=${() => { updRoom(y => y.items.push({type:sheet.type, wall:sheet.wall, desc:sheet.desc.trim()})); setSheet(null); }}>Add ${typeById[sheet.type].name.toLowerCase()}</button></div>
  </div></div>`;

  return html`<section className="view"><div className="phone-wrap">${screen && React.cloneElement(screen, {overlay})}<${SideNote} title="Survey app flow" steps=${steps}/></div></section>`;
}
function SignPad({onSigned}){
  const ref = useRef(null), drawing = useRef(false);
  useEffect(() => { const c = ref.current; c.width = c.offsetWidth * 2; c.height = c.offsetHeight * 2; const x = c.getContext('2d'); x.scale(2,2); x.lineWidth = 2; x.lineCap = 'round'; x.strokeStyle = getComputedStyle(document.body).color; }, []);
  const pos = e => { const b = ref.current.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; };
  return html`<canvas className="sig" ref=${ref} aria-label="Signature pad"
    onPointerDown=${e => { drawing.current = true; const x = ref.current.getContext('2d'); x.beginPath(); x.moveTo(...pos(e)); }}
    onPointerMove=${e => { if (!drawing.current) return; const x = ref.current.getContext('2d'); x.lineTo(...pos(e)); x.stroke(); }}
    onPointerUp=${() => { drawing.current = false; onSigned(); }}></canvas>`;
}

/* ---------- Installer app ---------- */
function InstallApp({erp, ops}){
  const meU = userById[erp.me];
  const lockedSelf = meU.role === 'installer';
  const [who, setWho] = useState(lockedSelf ? erp.me : (INSTALLERS[0]?.id || 'ravi'));
  const [scr, setScr] = useState({n:'list'});
  const [tab, setTab] = useState('active');
  const [sheet, setSheet] = useState(null);
  const [, tick] = useState(0);
  const mine = erp.items.filter(i => i.installer === who);
  const it = scr.id && erp.items.find(i => i.id === scr.id);
  useEffect(() => { if (!it || !running(it)) return; const t = setInterval(() => tick(x => x + 1), 1000); return () => clearInterval(t); }, [it && running(it)]);
  const lists = {active:mine.filter(i => i.stage === 'install'), upcoming:mine.filter(i => PIDX(i.stage) < PIDX('install')), done:mine.filter(i => PIDX(i.stage) > PIDX('install'))};
  const steps = ['Jobs list shows only this installer’s items, each with its own deadline.','On arrival, tick boxes against the packing list. Missing or damaged becomes a snag.','Start, Pause (with reason) and Complete record the work time. No timesheets.','Complete needs the checklist, an after photo and the customer’s WhatsApp OTP.','If no snag is open, the item moves to Handover and the PM is notified.'];
  let screen;
  const status = i => i.installDone ? 'Done' : running(i) ? 'Working' : i.sessions.length ? 'Paused' : 'Not started';

  if (scr.n === 'list') screen = html`<${Phone} title=${'Hi ' + uname(who)} sub=${userById[who].roleName} right=${lockedSelf ? null : html`<select className="sel" style=${{background:'var(--rail-2)',color:'var(--rail-ink)',border:0,fontSize:12}} value=${who} onChange=${e => setWho(e.target.value)} aria-label="Installer">${INSTALLERS.map(u => html`<option key=${u.id} value=${u.id}>${u.name}</option>`)}</select>`}>
    <div className="seg" style=${{width:'100%'}}>${[['active','Active'],['upcoming','Upcoming'],['done','Done']].map(([id,n]) => html`<button key=${id} style=${{flex:1,justifyContent:'center'}} aria-pressed=${tab === id} onClick=${() => setTab(id)}>${n} ${lists[id].length}</button>`)}</div>
    ${lists[tab].map(i => { const p = erp.projects.find(x => x.id === i.projectId); const d = daysFrom(i.target);
      return html`<button key=${i.id} className="mcard" onClick=${() => setScr({n:'job', id:i.id})}>
        <div className="card-row"><span className="mono" style=${{fontWeight:600}}>${i.code}</span>${tab === 'active' ? html`<span className=${'pill ' + (running(i) ? 'good' : i.sessions.length ? 'warn' : '')}>${status(i)}</span>` : tab === 'upcoming' ? html`<${StagePill} stage=${i.stage}/>` : html`<span className="pill good">Installed</span>`}</div>
        <b>${typeById[i.type].name}${i.desc ? html` <span className="meta" style=${{fontWeight:400}}>· ${i.desc}</span>` : null}</b>
        <span className="meta">${p.customer} · ${p.address} · ${i.roomName}, wall ${i.wall}</span>
        ${tab !== 'done' && html`<div className="card-row"><span className=${'due' + (d < 0 ? ' over' : d === 0 ? ' today' : '')}>${d < 0 ? -d + 'd late' : d === 0 ? 'Target today' : 'Target ' + fmtDate(i.target)}</span>${tab === 'active' ? html`<span className="meta">Boxes ${i.boxes.filter(b => b.got).length}/${i.boxes.length}${openSnags(i).length ? ` · ${openSnags(i).length} snag` : ''}</span>` : html`<span className="meta">Material not at site yet</span>`}</div>`}
      </button>`; })}
    ${!lists[tab].length && html`<p style=${{color:'var(--muted)',textAlign:'center',margin:'24px 0'}}>No jobs here.</p>`}
  <//>`;

  else if (scr.n === 'job' && it){
    const p = erp.projects.find(x => x.id === it.projectId), wall = p.survey.rooms.find(r => r.code === it.room)?.walls.find(w => w.label === it.wall);
    const active = it.stage === 'install' && !it.installDone, run = running(it), got = it.boxes.filter(b => b.got).length, d = latestDrawing(it);
    const todayMs = it.sessions.filter(s => s.start > new Date().setHours(0,0,0,0)).reduce((a,s) => a + ((s.end || Date.now()) - s.start), 0);
    const hms = ms => { const s = Math.floor(ms/1000); return `${Math.floor(s/3600)}:${String(Math.floor(s%3600/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`; };
    screen = html`<${Phone} title=${it.code} sub=${typeById[it.type].name + ' · ' + p.customer} back=${() => setScr({n:'list'})}
      foot=${!active ? null : run ? html`<button className="big warn" onClick=${() => setSheet({n:'pause'})}>Pause</button><button className="big go" onClick=${() => setSheet({n:'complete', step:1, checks:{}, photo:null, otp:null, code:'', busy:false})}>Complete</button>`
        : html`<button className="big" onClick=${() => setSheet({n:'snag', type:SNAG_TYPES[0], part:'', note:''})}>Snag</button><button className="big pri" disabled=${it.stage !== 'install'} onClick=${() => ops.startWork(it.id)}>${it.sessions.length ? 'Resume' : 'Start work'}</button>`}>
      ${active && html`<div className="mcard" style=${{textAlign:'center',justifyItems:'center'}}><span className="meta">${run ? 'Working · timer running' : it.sessions.length ? 'Paused' : 'Not started'}</span><span className="timer">${hms(workMs(it))}</span><span className="meta">Total work time · today ${hms(todayMs)} · standard ${typeById[it.type].std} h</span></div>`}
      ${it.installDone && html`<div className="banner good">Installed ${fmtDT(it.installedAt)} · ${hrs(workMs(it))} · customer signed off.</div>`}
      <div className="mcard"><div className="card-row"><b>${p.customer}</b><span className=${'due' + (daysFrom(it.target) < 0 ? ' over' : '')}>Target ${fmtDate(it.target)}</span></div><span className="meta">${p.address}</span>
        <div className="inline"><a className="btn small" href=${'tel:' + p.phone.replace(/\s/g,'')}><${Icon} n="phone" s=${14}/>${p.phone}</a><a className="btn small" target="_blank" rel="noopener" href=${'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(p.address)}>Open map</a></div>
        ${p.notes && html`<span className="meta" style=${{color:'var(--warn)'}}>${p.notes}</span>`}</div>
      <div className="mcard"><div className="card-row"><b>Production drawing</b>${d ? html`<span className="pill good">${d.rev} · latest approved</span>` : html`<span className="pill">None</span>`}</div>
        ${d && html`<${Elevation} it=${it} wall=${wall}/>`}<span className="meta">${it.roomName}, wall ${it.wall}${wall ? ` · ${wall.w} × ${wall.h} mm` : ''}. Older revisions are hidden.</span></div>
      <div className="mcard"><div className="card-row"><b>Packing list</b><span className="meta">${got}/${it.boxes.length} received</span></div>
        ${it.boxes.map(b => html`<div key=${b.n} className="mrow" style=${{fontSize:13}}><span className="mono" style=${{width:28,color:'var(--muted)'}}>#${b.n}</span><span className="grow">${b.label}</span>
          ${it.stage === 'install' && !it.installDone ? html`<button className=${'btn small' + (b.got === true ? ' primary' : '')} onClick=${() => ops.updItem(it.id, x => { x.boxes.find(y => y.n === b.n).got = true; })}>${b.got === true ? '✓ Got' : 'Got'}</button><button className="btn small ghost" onClick=${() => { ops.updItem(it.id, x => { x.boxes.find(y => y.n === b.n).got = false; }); setSheet({n:'snag', type:'Missing part', part:'Box #' + b.n + ' ' + b.label, note:''}); }}>Missing</button>` : html`<span className="sub">${b.got ? '✓' : '—'}</span>`}</div>`)}</div>
      ${it.snags.length > 0 && html`<div className="mcard"><b>Snags</b>${it.snags.map(s => html`<div key=${s.id} className="mrow" style=${{fontSize:13}}><span className=${'pill ' + (s.status === 'fixed' ? 'good' : 'crit')}>${SNAG_LABEL[s.status]}</span><span className="grow">${s.part} · ${s.type}</span></div>`)}</div>`}
      ${wall && html`<div className="mcard"><b>Survey photo · wall ${it.wall}</b><${PhotoBox} src=${photoSrc(wall.photo, wall.photoUrl)} label="Survey photo" onPick=${() => {}}/>${wall.obs.length ? html`<span className="meta">${wall.obs.map(o => `${o.type} ${o.w}×${o.h} at ${o.left} from left`).join(' · ')}</span>` : null}</div>`}
    <//>`;
  } else screen = null;

  let overlay = null;
  if (sheet && it){
    const close = () => setSheet(null);
    const wrap = inner => html`<div className="sheet-m" onClick=${e => e.target === e.currentTarget && close()}><div className="in">${inner}</div></div>`;
    if (sheet.n === 'pause') overlay = wrap(html`<h3>Why are you pausing?</h3>${PAUSE_REASONS.map(r => html`<button key=${r} className="big" style=${{justifyContent:'flex-start'}} onClick=${() => { ops.pauseWork(it.id, r); close(); }}>${r}</button>`)}<button className="big" onClick=${close}>Cancel</button>`);
    if (sheet.n === 'snag') overlay = wrap(html`<h3>Report a snag · ${it.code}</h3>
      <div className="presets">${SNAG_TYPES.map(t => html`<button key=${t} aria-pressed=${sheet.type === t} onClick=${() => setSheet({...sheet, type:t})}>${t}</button>`)}</div>
      <div className="mm"><label className="full">Which part<input value=${sheet.part} onInput=${e => setSheet({...sheet, part:e.target.value})} placeholder="e.g. Shutter 3, left hinge"/></label><label className="full">Note<input value=${sheet.note} onInput=${e => setSheet({...sheet, note:e.target.value})} placeholder="What is wrong"/></label></div>
      <${PhotoBox} src=${sheet.photo} label="Photo of the problem" onPick=${d => setSheet({...sheet, photo:d})}/>
      <div className="inline"><button className="big" onClick=${close}>Cancel</button><button className="big pri" disabled=${!sheet.part.trim()} onClick=${() => { ops.raiseSnag(it.id, {type:sheet.type, part:sheet.part.trim(), note:sheet.note.trim(), photo:sheet.photo || null}); close(); }}>Report snag</button></div>`);
    if (sheet.n === 'complete'){
      const allChecked = CHECKLIST.every(c => sheet.checks[c]);
      overlay = sheet.step === 1 ? wrap(html`<h3>Complete ${it.code}</h3>
        ${CHECKLIST.map(c => html`<label key=${c} className="check" style=${{fontSize:15,padding:'4px 0'}}><input type="checkbox" checked=${!!sheet.checks[c]} onChange=${() => setSheet({...sheet, checks:{...sheet.checks, [c]:!sheet.checks[c]}})}/>${c}</label>`)}
        <${PhotoBox} src=${sheet.photo} label="After photo of the finished unit" onPick=${d => setSheet({...sheet, photo:d})}/>
        ${!sheet.photo && html`<button className="linkbtn" style=${{color:'var(--muted)'}} onClick=${() => setSheet({...sheet, photo:'sample'})}>Demo: use a sample photo</button>`}
        <div className="inline"><button className="big" onClick=${close}>Cancel</button><button className="big pri" disabled=${!allChecked || !sheet.photo || sheet.busy} onClick=${async () => { setSheet({...sheet, busy:true}); const r = await ops.requestSignoff(it.id, sheet.checks, sheet.photo); setSheet(r ? {...sheet, busy:false, step:2, otp:r.devCode || null} : {...sheet, busy:false}); }}>${sheet.busy ? 'Sending…' : 'Send OTP to customer'}</button></div>`)
      : wrap(html`<h3>Customer sign-off</h3><div className="banner">OTP sent to ${erp.projects.find(p => p.id === it.projectId).customer} on WhatsApp. Ask them for the 4 digits.</div>
        ${sheet.otp && html`<div className="banner warn">Demo only: the OTP is ${sheet.otp}</div>`}
        <div className="otp"><input inputMode="numeric" maxLength="4" style=${{width:160,letterSpacing:'.4em'}} value=${sheet.code} onInput=${e => setSheet({...sheet, code:e.target.value.replace(/\D/g,'').slice(0,4)})} aria-label="OTP" autoFocus/></div>
        
        <div className="inline"><button className="big" onClick=${() => setSheet({...sheet, step:1})}>Back</button><button className="big go" disabled=${sheet.code.length < 4 || sheet.busy} onClick=${async () => { setSheet({...sheet, busy:true}); const r = await ops.verifySignoff(it.id, sheet.code); if (r) close(); else setSheet({...sheet, busy:false}); }}>Confirm and complete</button></div>`);
    }
  }
  return html`<section className="view"><div className="phone-wrap">${screen && React.cloneElement(screen, {overlay})}<${SideNote} title="Installer app flow" steps=${steps}/></div></section>`;
}

/* ---------- Team performance ---------- */
function Team({erp}){
  const rows = TEAM.map(u => {
    const ts = erp.tasks.filter(t => t.assignee === u.id), open = ts.filter(t => t.status !== 'done');
    const done = ts.filter(t => t.status === 'done').map(t => { const e = [...t.events].reverse().find(x => x.e === 'done'); return {t, at:e ? e.t : Date.now()}; });
    const onTime = done.filter(x => x.at <= parseYmd(x.t.deadline).getTime() + DAY);
    const lateDays = done.filter(x => x.at > parseYmd(x.t.deadline).getTime() + DAY).map(x => (x.at - parseYmd(x.t.deadline).getTime()) / DAY);
    const inst = erp.items.filter(i => i.installer === u.id && i.installDone);
    const w = inst.reduce((s,i) => s + workMs(i), 0) / HR, sd = inst.reduce((s,i) => s + typeById[i.type].std, 0);
    return {u, open:open.length, overdue:open.filter(t => daysFrom(t.deadline) < 0 && t.status !== 'blocked').length, blocked:open.filter(t => t.status === 'blocked').length, done:done.length,
      onTime:done.length ? Math.round(onTime.length / done.length * 100) : null, avgLate:lateDays.length ? (lateDays.reduce((a,b) => a + b, 0) / lateDays.length).toFixed(1) : null,
      inst:inst.length, w, sd, snag:inst.length ? Math.round(inst.filter(i => i.snags.length).length / inst.length * 100) : null};
  });
  const segs = erp.items.flatMap(i => i.log.filter(l => l.out).map(l => ({stage:l.stage, days:(l.out - l.in)/DAY})));
  const cyc = PSTAGES.filter(s => s.id !== 'closed').map(s => { const x = segs.filter(z => z.stage === s.id); return {s, n:x.length, avg:x.length ? x.reduce((a,b) => a + b.days, 0)/x.length : 0}; });
  const cmax = Math.max(...cyc.map(c => Math.max(c.avg, c.s.days)), 1);
  return html`<section className="view"><div className="stack">
    <div className="table-wrap"><table>
      <thead><tr><th>Person</th><th className="r">Open</th><th className="r">Overdue</th><th className="r">Blocked</th><th className="r">Done</th><th className="r">On time</th><th className="r">Avg delay</th><th className="r">Items installed</th><th className="r">Work vs standard</th><th className="r">Snag rate</th></tr></thead>
      <tbody>${rows.map(r => html`<tr key=${r.u.id}><td><span className="inline" style=${{gap:8}}><${Av} id=${r.u.id}/><span><b>${r.u.name}</b><div className="sub">${r.u.roleName}</div></span></span></td>
        <td className="r num">${r.open}</td><td className="r num" style=${{color:r.overdue ? 'var(--crit)' : null, fontWeight:r.overdue ? 600 : 400}}>${r.overdue}</td><td className="r num">${r.blocked || '—'}</td><td className="r num">${r.done}</td>
        <td className="r num">${r.onTime == null ? '—' : r.onTime + '%'}</td><td className="r num">${r.avgLate ? r.avgLate + ' d' : '—'}</td>
        <td className="r num">${r.u.role === 'installer' ? r.inst : '—'}</td><td className="r num">${r.u.role === 'installer' && r.inst ? html`${r.w.toFixed(1)} / ${r.sd} h<div className="sub" style=${{color:r.w > r.sd*1.15 ? 'var(--crit)' : 'var(--good)'}}>${Math.round(r.sd / r.w * 100)}% efficiency</div>` : '—'}</td>
        <td className="r num">${r.u.role === 'installer' && r.snag != null ? r.snag + '%' : '—'}</td></tr>`)}</tbody></table></div>
    <div className="panel"><h3>Average days per stage</h3><p className="hint">From the automatic stage record of every item. The thin mark is the target set in stage settings.</p>
      <div className="bars">${cyc.map(c => html`<div className="bar-row" key=${c.s.id}><span>${c.s.name}</span><div className="bar-track" style=${{position:'relative'}}><i style=${{width:(c.avg/cmax*100)+'%', background:c.avg > c.s.days ? 'var(--crit)' : c.s.color}}></i><span style=${{position:'absolute',left:(c.s.days/cmax*100)+'%',top:-2,bottom:-2,width:2,background:'var(--ink)'}} title=${'Target ' + c.s.days + ' days'}></span></div><span className="n"><b>${c.n ? c.avg.toFixed(1) + ' d' : '—'}</b> · target ${c.s.days}</span></div>`)}</div>
    </div>
  </div></section>`;
}

  app.flushDeferred = () => { if (app.deferred){ const d = app.deferred; app.deferred = null; app.applyState(d); } };

  const toast = text => { const id = Math.random(); setToasts(t => [...t, {id, text}]); setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 4200); };
  const crm = {note(){}};
  const ops = makeOps(erp, setErp, toast, leads, crm, app);
  const call = async (method, path, body, msg) => { try { const r = await API.call(method, path, body); if (r.state) app.applyState(r.state); if (msg) toast(typeof msg === 'function' ? msg(r) : msg); return r; } catch(e){ toast(e.message); return null; } };
  const ui = {
    go:(id, init) => { setTaskInit(init || null); go(id); },

    openItem:id => setIOpen(id), openTask:id => setTOpen(id),
