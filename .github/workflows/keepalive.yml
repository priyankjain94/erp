# Keeps the free Render server awake so WhatsApp reminders and escalations run on time.
# Not needed once the server is on a paid (always-on) plan — then delete this file.
name: keep-server-awake
on:
  schedule:
    - cron: '*/10 0-17 * * 1-6'   # every 10 min, 05:30–23:20 IST, Monday–Saturday
    - cron: '0 3 * * 0'           # once on Sunday morning for daily housekeeping
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the app
        run: |
          curl -fsS --retry 3 --retry-delay 20 --max-time 90 https://erp.makemyspace.in/api/health || true
          echo
          for i in 1 2 3; do curl -s -o /dev/null -w "health: connect %{time_connect}s  first byte %{time_starttransfer}s  total %{time_total}s\n" https://erp.makemyspace.in/api/health; done
          curl -s -o /dev/null -H 'Accept-Encoding: gzip' -w "page: %{size_download} bytes  first byte %{time_starttransfer}s  total %{time_total}s\n" https://erp.makemyspace.in/
          curl -sI -H 'Accept-Encoding: gzip' https://erp.makemyspace.in/ | grep -iE 'content-encoding|etag|server|platform' || true
