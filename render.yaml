# Render Blueprint — free TEST deployment (Render dashboard → New → Blueprint → pick this repo).
# Demo mode: OTP shown on screen, sample data loaded, WhatsApp simulated. Not for real customers.
# Free limits: app sleeps after 15 min idle (~1 min to wake); free database is deleted after 30 days.
services:
  - type: web
    name: mms-erp-test
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: development
      - key: DEMO_MODE
        value: "true"
      - key: SEED_DEMO
        value: "true"
      - key: SCHEDULER_ENABLED
        value: "true"
      - key: WORKER_ENABLED
        value: "true"
      - key: STORAGE_DRIVER
        value: db          # Render's free disk is wiped on every restart, so files live in the database
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: mms-erp-test-db
          property: connectionString
      # WhatsApp Cloud API: IDs here; secrets (token, app secret, verify token) are entered in the Render dashboard only
      - key: WHATSAPP_WABA_ID
        value: "2613333339176910"
      - key: WHATSAPP_PHONE_NUMBER_ID
        value: "1429433796920415"
      - key: META_APP_ID
        value: "2027884144572768"
      - key: WHATSAPP_FORWARD_URL
        value: https://mms-whatsapp-bot.vercel.app/api/webhook
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false

databases:
  - name: mms-erp-test-db
    plan: free
    region: singapore
    databaseName: mms
    user: mms
